# Signs the iPhone app and sends it to TestFlight, on one of GitHub's Macs. Run it by hand:
# Actions → "Send to TestFlight" → Run workflow. About fifteen minutes later the build shows
# up in the TestFlight app on any phone whose Apple ID is on the team.
#
# Once, in GitHub → the repo → Settings → Secrets and variables → Actions → New secret:
#   APPLE_TEAM_ID         developer.apple.com → Account → Membership details → Team ID
#   ASC_KEY_ID            App Store Connect → Users and Access → Integrations → the key's Key ID
#   ASC_ISSUER_ID         the Issuer ID shown above the list of keys on that same page
#   ASC_KEY_P8            the whole of the AuthKey_XXXX.p8 file, BEGIN and END lines included
# The key needs the Admin role: Xcode uses it to make the signing certificate and profile
# itself, so there are no certificates to export or keep track of.
name: Send to TestFlight
on:
  workflow_dispatch:
concurrency: testflight
jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check the Apple secrets are set
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          miss=""; for v in TEAM:APPLE_TEAM_ID KEY_ID:ASC_KEY_ID ISSUER:ASC_ISSUER_ID P8:ASC_KEY_P8; do
            n=${v%%:*}; [ -z "${!n}" ] && miss="$miss ${v#*:}"; done
          if [ -n "$miss" ]; then echo "::error::Missing repo secrets:$miss (see the top of .github/workflows/testflight.yml)"; exit 1; fi
          grep -q "BEGIN PRIVATE KEY" <<<"$P8" || { echo "::error::ASC_KEY_P8 should be the whole .p8 file, BEGIN and END lines included"; exit 1; }
      - name: Use the newest Xcode on the runner
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$X"; xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build the page into the app
        run: npm run sync
      - name: Archive, signed
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          printf '%s\n' "$P8" > "$RUNNER_TEMP/AuthKey.p8"
          # every upload needs a build number higher than the last; this workflow's run count is
          BUILD=$((100 + ${{ github.run_number }}))
          echo "build $BUILD"
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Rooms.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -60
      - name: Upload to App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Rooms.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -40
          echo "::notice::Uploaded. It appears in TestFlight once Apple has processed it, usually 10-20 minutes."
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
