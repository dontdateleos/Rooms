/* numbers that mean a quantity count up to it */
/* 16 — each digit rolls up to its value; the strip reads down from the target */
function odometer(el, to, suffix = "") { if (!el) return;
  if (to === "—" || to === null || to === undefined) { el.textContent = "—"; return; }
  const text = String(to) + suffix;
  if (REDUCED) { el.textContent = text; return; }
  el.textContent = ""; el.classList.add("odo");
  const strips = [];
  for (const ch of text) {
    if (!/[0-9]/.test(ch)) { const f = document.createElement("span"); f.className = "fix"; f.textContent = ch; el.appendChild(f); continue; }
    const d = +ch, reel = document.createElement("span"), strip = document.createElement("span");
    reel.className = "reel"; strip.className = "strip";
    for (let i = 0; i < 10; i++) { const b = document.createElement("b"); b.textContent = String((d - i + 10) % 10); strip.appendChild(b); }
    strip.style.transform = "translateY(calc(-7 * var(--oh)))"; reel.appendChild(strip); el.appendChild(reel); strips.push(strip); }
  requestAnimationFrame(() => strips.forEach(st => { st.style.transform = "translateY(0)"; }));
}

function countUp(el, to, suffix = "", ms = 600) {
  if (!el || to === "—" || to === null || to === undefined) { if (el) el.textContent = to ?? "—"; return; }
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = to + suffix; return; }
  const target = parseFloat(to), dec = String(to).includes(".") ? 1 : 0, t0 = performance.now();
  const tick = now => { const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    el.textContent = (target * e).toFixed(dec) + suffix; if (k < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

/* ---------- marks ----------
   Records, not achievements: every one of these describes something that already
   happened, and none of them can be got at by using the app differently. Nine of the
   twelve are computable from what a profile already loads. The three left out —
   Charter, Called It, and the room's year — each need a sweep across everybody's
   rows, so they wait until there is a reason to pay for that query. */
const decadeOf = w => w?.year ? Math.floor(+String(w.year).slice(0,4) / 10) * 10 : null;
const yearsSince = iso => iso ? (Date.now() - new Date(iso)) / (365.25 * 864e5) : 0;

function marksFor(p, es, taste, match, extra = {}) {
  const out = [];
  const add = (key, name, rule) => out.push({ key, name, rule });

  if (p.founder) add("founder", "Founder", "made the place");

  /* how far apart the two of you landed on the same thing */
  const byWork = {};
  for (const e of es) byWork[e.work_id] = Math.max(byWork[e.work_id] ?? -1, e.score);
  let splits = 0;
  if (p.id !== me.id) for (const m of myEntries) {
    const theirs = byWork[m.work_id];
    if (theirs !== undefined && Math.abs(theirs - m.score) >= 4) splits++;
  }
  if (splits >= 20) add("argument", "The Argument", `${splits} splits with you`);
  else if (splits >= 1) add("split", "The Split", splits === 1 ? "a split with you" : `${splits} splits with you`);

  if (Object.keys(KINDS).every(k => taste.kinds[k])) add("house", "The Whole House", "all four mediums");

  const decades = new Set(es.map(e => decadeOf(works[e.work_id])).filter(Boolean));
  if (decades.size >= 4) add("longview", "The Long View", `${decades.size} decades`);

  if (match !== null && match >= 90 && taste.tagged >= 3 && tasteOf(myEntries).tagged >= 3)
    add("twin", "Twin", `${match}% with you`);

  const yrs = Math.floor(yearsSince(p.created_at));
  if (yrs >= 3) add("stillhere", "Still Here", `${yrs} years in`);

  if (extra.clubsFinished > 0)
    add("table", "Ran the Table", extra.clubsFinished === 1 ? "finished a club" : `${extra.clubsFinished} clubs finished`);

  const notes = es.filter(e => e.note && e.note.trim()).length;

/* ---------- import ----------
   letterboxd: Date,Name,Year,Letterboxd URI,Rating   · goodreads: Title,Author,My Rating,Date Read
   steam: name,hours (or a plain list of titles) — anything with a title column works. */
function parseCSV(text) {
  const rows = []; let row = [], cell = "", quoted = false;
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (quoted) { if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else quoted = false; } else cell += c; }
    else if (c === '"') quoted = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r") cell += c; }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function readImport(text) {
  const rows = parseCSV(text); if (rows.length < 2) return { kind:null, items:[] };
  const head = rows[0].map(h => lc(h.trim()));
  const col = (...names) => { for (const n of names) { const i = head.indexOf(n); if (i >= 0) return i; } return -1; };
  const iTitle = col("name","title","game","book title"), iYear = col("year","original publication year","first published"),
        iRating = col("rating","my rating","score"), iDate = col("date","date read","watched date","date added"), iAuthor = col("author","director","developer");
  if (iTitle < 0) return { kind:null, items:[] };
  const kind = col("letterboxd uri") >= 0 ? "film" : col("my rating") >= 0 || col("author") >= 0 ? "book" : col("hours") >= 0 || col("app id","appid") >= 0 ? "game" : null;
  const items = rows.slice(1).map(r => ({ title:(r[iTitle]||"").trim(), year:iYear>=0?(r[iYear]||"").trim().slice(0,4):"",
    rating:iRating>=0?parseFloat(r[iRating]):NaN, date:iDate>=0?(r[iDate]||"").trim().slice(0,10):"", author:iAuthor>=0?(r[iAuthor]||"").trim():"" }))
    .filter(x => x.title);
  return { kind, items };
}

    <div class="lbl">Cards</div><div class="chips">${[["","Auto"],["day","Day"],["night","Night"]].map(([k,l]) => `<button class="chip ${(P.cardTheme||"")===k?"on":""}" data-ct="${k}">${l}</button>`).join("")}</div>
    <p class="sub" style="margin-top:4px">Auto goes dark in the evening. The medium tints the light either way.</p>
    <div class="lbl">Settings</div><div class="card" style="margin-top:0"><div class="lbl" style="margin-top:0">Worker URL · leave empty unless you run your own</div><input id="workerUrl" placeholder="${esc(WORKER)}" value="${esc(P.workerUrl)}"><div class="lbl">Or a TMDB key for film and TV</div><input id="tmdbKey" value="${esc(P.tmdbKey)}" autocomplete="off">
      <p class="sub" style="margin-top:8px">Film and TV data from <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>.
      This product uses the TMDB API but is not endorsed or certified by TMDB. Books from Open Library, games from IGDB.</p></div>
    ${sb.__local ? "" : `<div class="lbl">Password</div><div class="card" style="margin-top:0">
      <div class="lbl" style="margin-top:0">Set one, and you can sign in without waiting for an email</div>
      <input id="newPw" type="password" autocomplete="new-password" placeholder="at least eight characters">
      <div class="stack"><button class="btn" id="savePw">Save the password</button></div><p class="msg" id="pwMsg"></p></div>`}
    <div class="stack"><button class="btn ghost" id="paidBtn">What paying would get you</button>
      <button class="btn ghost" id="importBtn">Import from Letterboxd, Goodreads, Steam</button>
      ${sb.__local?``:`<button class="btn ghost" id="takeout">Download everything</button>`}${sb.__local?`<button class="btn ghost" id="backup">Back up the log</button><button class="btn quiet" id="restore">Restore from a backup</button><input type="file" id="restoreFile" accept="application/json" hidden>`:""}<button class="btn quiet" id="signOut">${sb.__local?"Close the log":"Sign out"}</button><button class="btn quiet" id="sClose">Done</button></div><p class="msg" id="sMsg"></p>`);
  /* the shape picker */
  let av = Object.assign({}, avFor(me));
  const paintAv = () => {
    $("#avPreview").innerHTML = avSVG(av);
    $("#avNote").textContent = me.avatar ? "yours, chosen" : "made from your handle";
    $("#avShapes").innerHTML = AV_NAMES.map(n =>
      `<button class="${n === av.shape ? "on" : ""}" data-avs="${n}">${avSVG({ shape:n, col:av.col, eyes:av.eyes, tilt:0 })}</button>`).join("");
    $("#avEyes").innerHTML = AV_EYE_NAMES.map(n =>
      `<button class="${n === av.eyes ? "on" : ""}" data-ave="${n}">${avSVG({ shape:av.shape, col:av.col, eyes:n, tilt:0 })}</button>`).join("");
    $("#avCols").innerHTML = AV_COLS.map((c,i) =>
      `<button class="sw ${i === av.col ? "on" : ""}" data-avc="${i}" style="background:${c}"></button>`).join("");
    $$("[data-avs]").forEach(b => b.onclick = () => { av.shape = b.dataset.avs; paintAv(); });
    $$("[data-ave]").forEach(b => b.onclick = () => { av.eyes = b.dataset.ave; paintAv(); });
    $$("[data-avc]").forEach(b => b.onclick = () => { av.col = +b.dataset.avc; paintAv(); }); };
  paintAv();
  $("#avShuffle").onclick = () => { av = { shape:AV_NAMES[Math.floor(Math.random()*AV_NAMES.length)],
    col:Math.floor(Math.random()*AV_COLS.length), eyes:AV_EYE_NAMES[Math.floor(Math.random()*AV_EYE_NAMES.length)],
    tilt:Math.floor(Math.random()*9)-4 }; paintAv(); };
  $("#avReset").onclick = async () => { me.avatar = null; av = Object.assign({}, avFor(me));
    try { if (sb.__local) { sb.__db.profile.avatar = null; sb.__save(); } else await q(sb.from("profiles").update({ avatar:null }).eq("id", me.id)); }
    catch (err) { oops(err, "Couldn't reset your shape"); }
    paintAv(); paintMeAv(); refresh(); };

  $("#ySave").onclick = async () => { const h = lc($("#yHandle").value.trim()), bio = $("#yBio").value.trim(); if (!/^[a-z0-9_]{2,24}$/.test(h)) { $("#yMsg").textContent = "two to twenty-four, lowercase, no spaces"; return; }
    try { if (sb.__local) { Object.assign(sb.__db.profile, { handle:h, bio, avatar:av }); sb.__save(); }
      else await q(sb.from("profiles").update({ handle:h, bio:bio||null, avatar:av }).eq("id", me.id));
      me.handle = h; me.bio = bio; me.avatar = av; $("#meName").textContent = h; paintMeAv();
      $("#yMsg").textContent = "Saved"; refresh(); } catch (e) { $("#yMsg").textContent = e.message; } };
  const sp = $("#savePw"); if (sp) sp.onclick = async () => { const pw = $("#newPw").value;
    if (pw.length < 8) { $("#pwMsg").textContent = "at least eight characters"; return; }
    sp.disabled = true; $("#pwMsg").textContent = "saving";
    try { await q(sb.auth.updateUser({ password:pw }));
      $("#newPw").value = ""; $("#pwMsg").textContent = "Saved. That's your password on this email now."; }
    catch (e) { $("#pwMsg").textContent = e.message; }
    finally { sp.disabled = false; } };
  $("#workerUrl").onchange = e => { P.workerUrl = e.target.value.trim(); saveP(); upcoming = null; }; $("#tmdbKey").onchange = e => { P.tmdbKey = e.target.value.trim(); saveP(); upcoming = null; };
  $$("[data-ct]").forEach(b => b.onclick = () => { P.cardTheme = b.dataset.ct; saveP(); $$("[data-ct]").forEach(x => x.classList.toggle("on", x === b)); });
  $("#importBtn").onclick = openImport;
  const pb = $("#paidBtn"); if (pb) pb.onclick = openPaid;
  $("#sClose").onclick = closeSheet; $("#signOut").onclick = async () => { await sb.auth.signOut(); location.reload(); };
  const tk = $("#takeout"); if (tk) tk.onclick = async () => { tk.disabled = true; const was = tk.textContent; tk.textContent = "Gathering…";
    try { const all = await exportEverything();
      downloadJSON(all, `rooms-${me.handle}-${today()}.json`);
      say(`${all.entries.length} ${all.entries.length === 1 ? "entry" : "entries"} downloaded`, "good"); }
    catch (e) { oops(e, "Couldn't build the file"); }
    finally { tk.textContent = was; tk.disabled = false; } };
  const bk = $("#backup"); if (bk) bk.onclick = () => { const blob = new Blob([localStorage.getItem("rooms.db")||"{}"], { type:"application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `rooms-${me.handle}-${today()}.json`; a.click(); };
  const rs = $("#restore"); if (rs) rs.onclick = () => $("#restoreFile").click(); const rf = $("#restoreFile"); if (rf) rf.onchange = async () => { const f = rf.files[0]; if (!f) return; try { const j = JSON.parse(await f.text()); if (!j.entries || !j.works) throw new Error("That isn't a Rooms backup"); if (!confirm(`Replace this log with the backup? ${j.entries.length} entries.`)) return; localStorage.setItem("rooms.db", JSON.stringify(j)); location.reload(); } catch (e) { $("#sMsg").textContent = e.message; } }; }

/* ---------- everything you have ever put in, in one file ----------
   backup was gated to local mode, so a hosted account had no way out at all. This
   builds the same shape the local store uses, which means the file you download
   restores into an offline log — the data is yours in a form that opens. */
async function exportEverything() {
  const grab = async (t, sel, col) => { try { return await q(sb.from(t).select(sel).eq(col, me.id)); } catch { return []; } };
  const [entries, myReplies, myReactions, myFollows] = await Promise.all([
    grab("entries", "*", "user_id"),
    grab("replies", "*", "user_id"),
    grab("reactions", "*", "user_id"),
    grab("follows", "*", "follower"),
  ]);
  const usedWorks = {};
  for (const id of new Set([...entries.map(e => e.work_id), ...lists.flatMap(l => l.items)]))
    if (works[id]) usedWorks[id] = works[id];
  return {
    exported_at: new Date().toISOString(), from: location.origin + location.pathname,
    profile: { id:me.id, handle:me.handle, bio:me.bio || "", avatar:me.avatar || null },
    signedOut: false, profiles: [],
    works: usedWorks,
    entries: entries.map(e => { const { works:_w, profiles:_p, ...row } = e; return row; }),
    lists: lists.map(l => ({ id:l.id, owner:me.id, name:l.name, created_at:null })),
    list_items: lists.flatMap(l => l.items.map((id, i) => ({ list_id:l.id, work_id:id, added_at:null, position:l.arranged ? i : null }))),
    rooms: rooms.map(r => ({ id:r.id, name:r.name, code:r.code })),
    room_members: rooms.flatMap(r => r.members.map(m => ({ room_id:r.id, user_id:m.id }))),
    clubs: [], club_members: [], club_votes: [],
    reactions: myReactions, replies: myReplies,
    top_lists: [], top_list_items: [],
    follows: myFollows,
  };
}
function downloadJSON(obj, name) {
  const url = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type:"application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* a small hook so the card renderers can be exercised by the test harness */
window.__rooms = { paintLog, wireLog, openWholeLog, AV_SHAPES, AV_EYES, AV_COLS, avSVG, avFor, get me(){return me}, get entries(){return myEntries}, get works(){return works}, get rooms(){return rooms},
  CUTS, openCuts, spanData, tasteOf, reviewData, yearOf, roomPalmares, tagStats, agreement, activeRoom, q, sb: () => sb, remember,
  joinRoomChannel, leaveRoomChannel, paintHere, onLiveEntry, paintDay, get hereNow(){return hereNow},
  say, oops, markLive, takeInvite, dropInvite, inviteLink, useInvite, exportEverything,
  drawDeck, resetDeck, pickMode, candidates, get deckItems(){return deckItems},
  addToShelf, __isSoon:isSoon, __list:activeList,
  marksFor, openPaid, COMET, loadFounders, get founderIds(){return founderIds} };

/* ============ boot ============ */
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
renderAuth(); sb.auth.onAuthStateChange?.(async ev => {
  if (ev === "SIGNED_IN" && !me) { if (await loadMe()) enter(); else if (pendingUser) renderClaim(); } });
if (await loadMe()) enter(); else if (pendingUser) renderClaim();
</script>
