<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FFF7EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rooms">
<title>Rooms</title>
<link rel="apple-touch-icon" href="./icons/rooms-180.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FFF7EC'/%3E%3Crect x='20' y='30.4' width='37.2' height='37.2' rx='8.9' fill='%23FFB36B'/%3E%3Crect x='36.8' y='30.4' width='37.2' height='37.2' rx='8.9' fill='%238FD3FF' opacity='.85'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1F4FE0;--ink:#151320;--cream:#FFF7EC;--cream2:#FDEFDD;--card:#FFFFFF;--line:#EFE6D8;--mute:#7A7590;
  --apricot:#FFB36B;--pink:#F5A3C7;--butter:#FFE86A;--mint:#9EF0C9;--sky:#8FD3FF;--lilac:#B9A6FF;--good:#1E9E6A;--bad:#E0407F;
  --film:var(--apricot);--tv:var(--pink);--book:var(--butter);--game:var(--mint);
  --head:Outfit,sans-serif;--body:Inter,system-ui,sans-serif}
/* the ground warms and dims across the day, so seven in the morning and ten at
   night are not the same room. Only the ground moves — cards stay white, ink stays ink. */
html[data-day="early"]    {--cream:#F6F1E8;--cream2:#EDE6DA;--line:#E7DFD2}
html[data-day="morning"]  {--cream:#FFF7EC;--cream2:#FDEFDD;--line:#EFE6D8}
html[data-day="afternoon"]{--cream:#FFFCF6;--cream2:#FCF2E6;--line:#F1EADE}
html[data-day="evening"]  {--cream:#FFEEDA;--cream2:#FBE3CA;--line:#EEDFC9}
html[data-day="late"]     {--cream:#F7E5D2;--cream2:#F0D9C2;--line:#E6D2BC}
html[data-day="night"]    {--cream:#EDE2D6;--cream2:#E4D4C5;--line:#DCCBBB}
html{transition:background-color 2.4s linear}
body{transition:background-color 2.4s linear}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;padding-bottom:calc(84px + env(safe-area-inset-bottom));overflow-x:clip}
html{overflow-x:clip}
main{overflow-x:clip}                 /* the deal-in travels 30px; keep it inside the page */
.wrap{overflow-x:clip}
.panel .in{overflow-x:clip}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:5;background:rgba(255,247,236,.92);backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--head);font-weight:900;font-size:22px;letter-spacing:-.03em}
.logo .mark{width:30px;height:30px;display:block;flex:none}
.me{font-family:var(--head);font-weight:800;font-size:13px;background:#fff;border:0;padding:8px 12px;border-radius:999px;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:8px}
.me .av{width:24px;height:24px}
main{padding:8px 0 24px}
section{display:none}section.on{display:block}

h1,h2,h3{font-family:var(--head);font-weight:900;letter-spacing:-.03em;line-height:1}
h2{font-size:28px;margin:18px 0 4px}
h3{font-size:19px}
.sub{color:var(--mute);font-weight:500;font-size:14px;margin-top:6px}
.lbl{font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
.hl{padding:0 .1em;border-radius:10px;display:inline-block;line-height:1.05}
.tag{font-family:var(--head);font-weight:800;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:999px;display:inline-block;color:var(--ink);line-height:1.2}
.tag.film{background:var(--film)}.tag.tv{background:var(--tv)}.tag.book{background:var(--book)}.tag.game{background:var(--game)}
.tag.dim{background:var(--cream2);color:var(--mute)}
.msg{color:var(--mute);font-size:13px;font-weight:600;padding:10px 0;min-height:18px}
.empty{color:var(--mute);font-weight:500;line-height:1.55;padding:22px 0;font-size:15px}
.empty b{color:var(--ink);font-family:var(--head);font-weight:800}

input,textarea{width:100%;background:#fff;border:2px solid var(--line);border-radius:14px;color:var(--ink);font-family:var(--body);font-size:16px;padding:12px 14px;outline:none;-webkit-appearance:none}
input:focus,textarea:focus{border-color:var(--ink)}
input::placeholder,textarea::placeholder{color:#B7B2C2}
textarea{min-height:76px;resize:none;line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;font-family:var(--head);font-weight:800;font-size:16px;padding:14px 18px;border-radius:999px;background:var(--ink);color:#fff;border:0;cursor:pointer}
.btn.soft{background:var(--butter);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.quiet{background:transparent;color:var(--mute)}
.btn.blue{background:var(--blue)}
.btn:disabled{opacity:.35}
.stack{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.seg{display:flex;background:var(--cream2);padding:4px;border-radius:999px;gap:2px;margin:6px 0 10px}
.seg button{flex:1;background:none;border:0;font-family:var(--head);font-weight:800;font-size:13px;padding:9px 6px;border-radius:999px;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.chip{font-family:var(--body);font-weight:700;font-size:13px;border:2px solid var(--line);background:#fff;color:var(--ink);padding:7px 11px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:baseline;gap:6px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.who{border-color:var(--lilac)}.chip.who.on{background:var(--lilac);color:var(--ink);border-color:var(--lilac)}
.chip u{text-decoration:none;font-size:10px;font-weight:800;color:var(--mute)}
.chip.on u{color:#fff;opacity:.8}
.chip.k.on{background:var(--ink)}

.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 14px 34px -26px rgba(21,19,32,.35);margin-top:12px}
.card .h{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--head);font-weight:800;font-size:15px;padding-bottom:10px;border-bottom:2px solid var(--line);margin-bottom:4px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .co{width:40px;height:58px;border-radius:9px;object-fit:cover;background:var(--cream2);flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-family:var(--head);font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:11.5px;font-weight:600;color:var(--mute);margin-top:4px}
.row .n{font-family:var(--head);font-weight:900;font-size:24px;letter-spacing:-.04em;flex:none}
.row .n small{display:block;font-size:10px;font-weight:700;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;text-align:right}
.row.done .t,.row.done .co{opacity:.45}
.rk{font-family:var(--head);font-weight:900;font-size:13px;width:18px;color:var(--mute);flex:none}
.good{color:var(--good)}.bad{color:var(--bad)}
.stars{display:flex;gap:4px}
.stars i{width:15px;height:15px;display:block;background:var(--ink);clip-path:polygon(50% 2%,62% 36%,98% 38%,70% 60%,80% 96%,50% 76%,20% 96%,30% 60%,2% 38%,38% 36%)}
.stars i.off{background:var(--line)}
.stars i.half{background:linear-gradient(90deg,var(--ink) 50%,var(--line) 50%)}
.stars.big i{width:24px;height:24px}
.stars.sm i{width:12px;height:12px}
.av{width:32px;height:32px;flex:none;display:block}
.av svg{width:100%;height:100%;display:block}
.av.big{width:84px;height:84px}
.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.picker button{background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px;cursor:pointer;transition:transform .15s}
.picker button svg{width:100%;height:auto;display:block}
.picker button.on{border-color:var(--ink);background:var(--cream2)}
.picker button:active{transform:scale(.94)}
.swatches{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:8px}
.sw{width:100%;aspect-ratio:1;border-radius:99px;border:3px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--ink)}

/* slips (feed) */
.slip{background:#fff;border-radius:22px;padding:14px 16px;margin-top:12px;box-shadow:0 14px 34px -26px rgba(21,19,32,.3)}
.slip .who{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:var(--mute)}
.slip .who b{color:var(--ink)}
.slip .ttl{display:flex;gap:10px;align-items:center;margin-top:10px;cursor:pointer}
.slip .ttl img,.slip .ttl .co{width:44px;height:64px;border-radius:9px;object-fit:cover;background:var(--cream2);flex:none}
.slip .ttl b{font-family:var(--head);font-weight:900;font-size:19px;letter-spacing:-.02em;line-height:1.05;display:block}
.slip .ttl small{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;font-weight:600;color:var(--mute);margin-top:5px}
.slip .q{font-weight:600;font-size:15px;line-height:1.45;margin-top:10px}
.slip .loved{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.slip .loved span{font-size:11.5px;font-weight:700;background:var(--cream2);padding:4px 9px;border-radius:999px}
.slip .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.acts{display:flex;gap:14px}
.acts button{background:none;border:0;font-family:var(--head);font-weight:800;font-size:13px;color:var(--mute);cursor:pointer;padding:0}
.acts button.on{color:var(--bad)}
.reply{margin-top:9px;padding-left:10px;border-left:3px solid var(--pink);font-size:14px;color:#4E4A60}
.reply b{color:var(--ink)}
.reply{position:relative;padding-right:22px}
.unreply{position:absolute;right:0;top:-1px;background:none;border:0;padding:0 4px;cursor:pointer;
  font-size:16px;line-height:1;color:var(--line)}
.unreply:hover,.unreply:focus-visible{color:var(--bad)}

/* tiles + grid */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{border-radius:18px;padding:14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;color:var(--ink);transform:rotate(var(--r,0deg))}
.tile b{font-family:var(--head);font-weight:900;font-size:17px;letter-spacing:-.02em}
.tile small{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;margin-top:8px}
.po{aspect-ratio:2/3;border-radius:14px;background:var(--cream2);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:8px;cursor:pointer;box-shadow:0 10px 24px -18px rgba(21,19,32,.4)}
.po img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.po b{position:relative;font-family:var(--head);font-weight:800;font-size:12px;line-height:1.15;color:var(--ink)}
.po:has(img.ok) b{display:none}
.po .tag{position:absolute;top:6px;left:6px;z-index:2}
.po .tick{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:#fff;border:0;z-index:2;cursor:pointer}
.po .tick.done{background:var(--ink)}
.po .tick.done:after{content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(40deg)}
.po.done{opacity:.45}
.po.soon{opacity:.72}
.po{-webkit-touch-callout:none}
.po .rm{position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:18px;line-height:1;padding:0;z-index:4;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px -2px rgba(21,19,32,.5)}
.grid.editing .po{animation:jiggle .34s ease-in-out infinite alternate}
.grid.editing .cell:nth-child(3n+2) .po{animation-duration:.3s}
.grid.editing .cell:nth-child(3n+3) .po{animation-duration:.38s}
.grid.editing .po .tick,.grid.editing .po .tag{display:none}
.grid .cell.dragging{position:relative;z-index:5}
.grid .cell.dragging .po{animation:none;transform:scale(1.07);box-shadow:0 18px 30px -14px rgba(21,19,32,.55)}
@keyframes jiggle{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
@keyframes cellOut{to{transform:scale(.55);opacity:0}}
.cell.going{animation:cellOut .2s cubic-bezier(.4,0,.9,.35) forwards;pointer-events:none}

/* 03 — the medium's colour floods the screen once, then clears */
.wash{position:fixed;inset:0;z-index:11;pointer-events:none;background:var(--k,var(--mint));
  animation:washOver .85s cubic-bezier(.4,.85,.3,1) both}
@keyframes washOver{0%{clip-path:circle(0% at 50% 88%);opacity:.92}
  52%{clip-path:circle(150% at 50% 88%);opacity:.92}100%{clip-path:circle(150% at 50% 88%);opacity:0}}

/* 05 — the cuts tip down into place, like cards set on a table */
.cuts button{transform-origin:50% 100%}
.sheet.on .cuts button{animation:seal .58s cubic-bezier(.25,1.2,.4,1) both}
.sheet.on .cuts button:nth-child(2){animation-delay:.08s}
.sheet.on .cuts button:nth-child(3){animation-delay:.16s}
@keyframes seal{0%{transform:perspective(700px) rotateX(68deg) translateY(-18px);opacity:0}
  62%{transform:perspective(700px) rotateX(-6deg) translateY(0);opacity:1}100%{transform:none;opacity:1}}

/* 06 — a newly added title deals onto the shelf */
@keyframes dealIn{0%{transform:translate(-70px,58px) rotate(-22deg) scale(.82);opacity:0}100%{transform:none;opacity:1}}
.cell.dealt{animation:dealIn .56s cubic-bezier(.2,1.15,.35,1) both}

/* 07 — the check draws itself when something is logged off the shelf */
@keyframes tickThump{0%{transform:scale(.7)}52%{transform:scale(1.2)}100%{transform:none}}
@keyframes tickDraw{0%{width:0;height:0;opacity:0}34%{width:6px;height:0;opacity:1}100%{width:6px;height:11px;opacity:1}}
.po .tick.swept{animation:tickThump .44s cubic-bezier(.3,1.5,.5,1)}
.po .tick.swept:after{animation:tickDraw .4s cubic-bezier(.5,0,.2,1) .06s both}

/* 08 — a dropped tile lands with weight and its neighbours flinch */
@keyframes landed{0%{transform:translateY(-11px) scale(1.11)}56%{transform:scale(.97)}100%{transform:none}}
@keyframes shoved{0%,14%{transform:none}46%{transform:translateX(var(--sh,5px))}100%{transform:none}}
.cell.landed .po{animation:landed .5s cubic-bezier(.3,1.5,.45,1)}
.cell.shoved .po{animation:shoved .45s cubic-bezier(.3,1.3,.45,1)}

/* 10 — an empty shelf fans its four mediums out on arrival */
@keyframes bloom{0%{transform:translateY(16px) rotate(0) scale(.72);opacity:0}
  100%{transform:rotate(var(--r,0deg)) scale(1);opacity:1}}
.tiles .tile{animation:bloom .58s cubic-bezier(.25,1.4,.4,1) both}
.tiles .tile:nth-child(2){animation-delay:.07s}
.tiles .tile:nth-child(3){animation-delay:.14s}
.tiles .tile:nth-child(4){animation-delay:.21s}

/* 12 — the reaction squashes, springs, and throws a halo */
@keyframes heartPop{0%{transform:scale(1)}28%{transform:scale(.82)}62%{transform:scale(1.3)}100%{transform:none}}
@keyframes halo{0%{transform:translate(-50%,-50%) scale(.5);opacity:.4}
  100%{transform:translate(-50%,-50%) scale(2.1);opacity:0}}
[data-same].popped{animation:heartPop .5s cubic-bezier(.3,1.7,.5,1);position:relative}
[data-same].popped:before{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;border-radius:50%;
  background:var(--bad);animation:halo .5s ease-out both;pointer-events:none}

/* 13 — a profile's avatar builds itself piece by piece */
@keyframes asm{0%{transform:scale(0) rotate(-62deg);opacity:0}100%{transform:none;opacity:1}}
/* a face you have not seen this session assembles once, then settles into idling */
.av.new svg > g > *{transform-origin:50% 54%;animation:asm .42s cubic-bezier(.3,1.5,.5,1) both}
.av.new svg > g > *:nth-child(2){animation-delay:.08s}
.av.new svg > g > *:nth-child(3){animation-delay:.15s}
.av.new .eyes{animation:asm .42s cubic-bezier(.3,1.5,.5,1) both, avBlink 6.4s ease-in-out infinite;
  animation-delay:.15s, calc(2.4s + var(--bd,0s))}

/* blinking, on each person's own clock */
.av .eyes{transform-box:fill-box;transform-origin:50% 50%;
  animation:avBlink 6.4s ease-in-out infinite;animation-delay:calc(2s + var(--bd,0s))}
@keyframes avBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}

/* the shape decides the temperament. the idle waits out the card's own arrival first. */
.av:not(#meAv) svg{transform-origin:50% 62%;animation-delay:calc(1.4s + var(--id,0s));
  animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.av:not(#meAv) svg[data-shape="ball"]{animation-name:avBreathe;animation-duration:4.4s}
.av:not(#meAv) svg[data-shape="box"]{animation-name:avNod;animation-duration:5.2s}
.av:not(#meAv) svg[data-shape="cube"]{animation-name:avSettle;animation-duration:6.8s}
.av:not(#meAv) svg[data-shape="can"]{animation-name:avSway;animation-duration:5.6s}
.av:not(#meAv) svg[data-shape="cone"]{animation-name:avTeeter;animation-duration:3.9s}
.av:not(#meAv) svg[data-shape="pill"]{animation-name:avBob;animation-duration:4.1s}
.av:not(#meAv) svg[data-shape="arch"]{animation-name:avSway;animation-duration:7.4s}
.av:not(#meAv) svg[data-shape="step"]{animation-name:avShift;animation-duration:6.1s;animation-timing-function:steps(2,end)}
@keyframes avBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes avNod{0%,100%{transform:translateY(0)}50%{transform:translateY(4%)}}
@keyframes avSettle{0%,100%{transform:rotate(0)}40%{transform:rotate(2deg)}72%{transform:rotate(-1.4deg)}}
@keyframes avSway{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
@keyframes avTeeter{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes avBob{0%,100%{transform:translateY(0)}42%{transform:translateY(-6%)}68%{transform:translateY(2%)}}
@keyframes avShift{0%,48%{transform:translateX(-2%)}52%,100%{transform:translateX(2%)}}
/* the eyes keep their own pace per shape too */
.av svg[data-shape="cone"] .eyes{animation-duration:4.2s}
.av svg[data-shape="ball"] .eyes{animation-duration:5.1s}
.av svg[data-shape="cube"] .eyes{animation-duration:8.3s}
.av svg[data-shape="step"] .eyes{animation-duration:9.1s}

.sheet.on .av.meet svg > g > *,.sheet.on .av.big svg > g > *{transform-origin:50% 54%;
  animation:asm .46s cubic-bezier(.3,1.5,.5,1) both}
.sheet.on .av.meet svg > g > *:nth-child(2),.sheet.on .av.big svg > g > *:nth-child(2){animation-delay:.1s}
.sheet.on .av.meet svg > g > *:nth-child(3),.sheet.on .av.big svg > g > *:nth-child(3){animation-delay:.18s}

/* 14 — the line between old and new draws outward from its label */
@keyframes sweepIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes labelUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.newline{animation:labelUp .4s cubic-bezier(.3,1.4,.5,1) .14s both}
.newline:before{transform-origin:right;animation:sweepIn .5s cubic-bezier(.3,.9,.3,1) both}
.newline:after{transform-origin:left;animation:sweepIn .5s cubic-bezier(.3,.9,.3,1) both}

/* 16 — scores roll into place a digit at a time */
.trio b.odo,b.odo,.odo{--oh:1.25em;display:inline-flex;align-items:flex-start;line-height:var(--oh)}
/* the reels are spans inside .trio, where `.trio span` is the small caps label style */
.odo .reel,.odo .fix,.odo .strip{font:inherit;letter-spacing:inherit;text-transform:none;color:inherit;margin:0}
.odo .reel{height:var(--oh);overflow:hidden;display:inline-block}
.odo .reel .strip{display:block;transition:transform .8s cubic-bezier(.22,.9,.24,1)}
.odo .reel .strip b{display:flex;align-items:center;justify-content:center;height:var(--oh);line-height:1;
  font-weight:inherit;font-variant-numeric:tabular-nums}
.odo .fix{display:flex;align-items:center;height:var(--oh);line-height:1}

/* 17 — agreement sweeps around an arc rather than sitting flat */
.trio > div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:76px}
.trio .gauge{position:relative;display:grid;place-items:center;width:58px;height:58px;margin:0}
.trio .agree .ring{position:absolute;inset:0;width:58px;height:58px;transform:rotate(-90deg)}
.trio .agree .ring circle{fill:none;stroke-width:4.5;stroke-linecap:round}
.trio .agree .ring .track{stroke:var(--cream2)}
.trio .agree .ring .val{stroke:var(--good);stroke-dasharray:113;stroke-dashoffset:113;
  transition:stroke-dashoffset 1s cubic-bezier(.2,.9,.25,1)}
.trio .agree.low .ring .val{stroke:var(--bad)}
.trio .agree b{position:relative;z-index:2;font-size:19px;color:var(--ink)}

/* 18 — your ten grow in rank order */
.bar:nth-child(2) .tr i{animation-delay:.07s}
.bar:nth-child(3) .tr i{animation-delay:.14s}
.bar:nth-child(4) .tr i{animation-delay:.21s}
.bar:nth-child(5) .tr i{animation-delay:.28s}
.bar:nth-child(n+6) .tr i{animation-delay:.35s}

/* 19 — the active pill travels between tabs */
nav .in{position:relative}
.navpill{position:absolute;top:9px;bottom:9px;border-radius:99px;background:var(--ink);z-index:0;
  left:0;width:0;opacity:0;transition:left .34s cubic-bezier(.3,1.25,.4,1),width .34s cubic-bezier(.3,1.25,.4,1)}

@media (prefers-reduced-motion:reduce){.grid.editing .po{animation:none;outline:2px dashed var(--ink);outline-offset:2px}}

.shelfbar{display:flex;gap:8px;align-items:center;margin-top:12px}
.shelfbar .btn{width:auto;flex:1;padding:12px 16px;font-size:15px}
.cap{font-size:11px;font-weight:600;color:var(--mute);margin-top:5px;display:flex;justify-content:space-between}

/* bars */
.bar{display:grid;grid-template-columns:104px 1fr 38px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bar:last-child{border-bottom:0}
.bar .n{font-weight:700;font-size:13px}
.bar .tr{height:11px;border-radius:99px;background:var(--cream2);overflow:hidden;display:flex;gap:2px}
.bar .tr i{display:block;height:100%}
.bar .p{font-weight:800;font-size:12px;color:var(--mute);text-align:right}
.say{font-family:var(--head);font-weight:900;font-size:24px;letter-spacing:-.03em;line-height:1.1;margin:10px 0 6px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 0 12px;border-bottom:2px solid var(--line)}
.trio b{font-family:var(--head);font-weight:900;font-size:30px;letter-spacing:-.04em;display:block;line-height:1}
.trio span{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);display:block;margin-top:4px}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.four .po{border-radius:10px;padding:6px}
.four .po b{font-size:10px}
.tally{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;font-weight:700;color:var(--mute)}
.tally b{color:var(--ink);font-family:var(--head);font-weight:900;font-size:15px;margin-right:3px}

/* rating */
.rate{display:flex;gap:6px;padding:8px 0 2px;touch-action:manipulation}
.rate button{width:44px;height:44px;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;transition:transform .12s}
.rate button svg{width:44px;height:44px;display:block;pointer-events:none}
.rate button.holding{transform:scale(1.15)}
.hint{font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;margin-top:6px}
.ticks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tk{font-family:var(--body);font-weight:700;font-size:12.5px;border:2px solid var(--line);background:#fff;padding:7px 11px;border-radius:999px;cursor:pointer}
.tk.on{background:var(--butter);border-color:var(--butter)}
.custom{display:flex;gap:8px;align-items:center;margin-top:10px}
.custom button{flex:none;font-family:var(--head);font-weight:800;font-size:13px;background:var(--cream2);border:0;border-radius:999px;padding:12px 16px;cursor:pointer}
.tagrow{display:flex;justify-content:space-between;align-items:baseline}
.tagrow .cnt{font-size:11px;font-weight:700;color:var(--mute)}

/* clubs */
.club{background:#fff;border-radius:20px;padding:16px;margin-top:12px;cursor:pointer;box-shadow:0 14px 34px -26px rgba(21,19,32,.3)}
.club .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.club b{font-family:var(--head);font-weight:900;font-size:19px;letter-spacing:-.02em;display:block;margin-top:8px}
.club .tr{height:8px;border-radius:99px;background:var(--cream2);margin-top:10px;overflow:hidden}
.club .tr i{display:block;height:100%;background:var(--ink);border-radius:99px}
.club .pr{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--mute);margin-top:8px}
.club .who{display:flex;gap:-6px;align-items:center;margin-top:10px}
.club .who .av{width:26px;height:26px;margin-right:-6px}
.club .who span.more{font-size:11.5px;font-weight:700;color:var(--mute);margin-left:12px}
.club.open{border:2px solid var(--lilac)}
.deadline{font-family:var(--head);font-weight:900;font-size:13px}
.deadline.soon{color:var(--bad)}
.deadline.done{color:var(--good)}
.pal{background:var(--ink);color:var(--cream);border-radius:22px;padding:18px;margin-top:12px}
.pal .h{display:flex;justify-content:space-between;align-items:center;font-family:var(--head);font-weight:900;font-size:17px;
  padding-bottom:12px;border-bottom:2px solid #3A3650;margin-bottom:4px}
.pal .row{border-color:#3A3650}
.pal .row .t small{color:#A9A3BC}
.pal .win{font-family:var(--head);font-weight:900;font-size:26px;letter-spacing:-.03em;line-height:1.05;margin:10px 0 2px}
.pal .win span{color:var(--butter)}
.ballot .row{cursor:pointer}
.ballot .pick{width:26px;height:26px;border-radius:99px;border:2px solid var(--line);display:grid;place-items:center;
  font-family:var(--head);font-weight:900;font-size:12px;flex:none}
.ballot .pick.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sealed{background:var(--ink);color:var(--cream);border-radius:22px;padding:22px;margin-top:12px;text-align:center}
.sealed .ic{width:54px;height:54px;border-radius:18px;background:#3A3650;display:grid;place-items:center;margin:0 auto 12px;
  font-family:var(--head);font-weight:900;font-size:20px;color:var(--butter)}
.sealed h3{font-size:19px}
.sealed p{color:#A9A3BC;font-size:14px;margin-top:6px;line-height:1.5}
.sealed .count{font-family:var(--head);font-weight:900;font-size:40px;letter-spacing:-.04em;margin-top:14px;display:block}
.sealed .count small{display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#A9A3BC;margin-top:4px}
.sealed .stack{margin-top:16px}
.cuts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.cuts button{background:none;border:2px solid var(--line);border-radius:16px;padding:6px;cursor:pointer;overflow:hidden}
.cuts button.on{border-color:var(--ink)}
.cuts canvas{width:100%;height:auto;display:block;border-radius:10px}
.cuts b{display:block;font-family:var(--head);font-weight:800;font-size:11px;margin-top:6px;color:var(--mute)}
.cuts button.on b{color:var(--ink)}
.avgs{display:flex;gap:14px;flex:none;text-align:right}
.avgs div{min-width:44px}
.avgs b{font-family:var(--head);font-weight:900;font-size:19px;letter-spacing:-.03em;display:block;line-height:1}
.avgs span{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);display:block;margin-top:3px}
.avgs .club b{color:var(--ink)}
.avgs .all b{color:var(--mute)}
.drift{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;margin-top:5px}
.drift.up{background:var(--mint)}.drift.down{background:var(--pink)}.drift.same{background:var(--cream2);color:var(--mute)}
.verdict{background:var(--butter);border-radius:18px;padding:14px 16px;margin-top:12px;font-weight:600;font-size:14.5px;line-height:1.45}
.verdict b{font-family:var(--head);font-weight:900}

/* wheel */
.wheelwrap{position:relative;width:min(100%,280px);margin:10px auto 0}
.pointer{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:16px solid var(--ink);z-index:2}
#wheel{width:100%;display:block}
#wheelG{transform-box:fill-box;transform-origin:center;transition:transform 4.4s cubic-bezier(.12,.74,.06,1)}
.result{margin-top:14px;background:var(--butter);border-radius:20px;padding:16px}
.result small{font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.result b{font-family:var(--head);font-weight:900;font-size:24px;letter-spacing:-.03em;display:block;margin-top:4px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,247,236,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);display:none}
nav.on{display:block}
nav .in{max-width:560px;margin:0 auto;padding:9px 12px 9px;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;gap:4px;align-items:center}
nav .gap{pointer-events:none}
nav button{background:none;border:0;padding:12px 4px;border-radius:99px;font-family:var(--head);font-weight:800;font-size:13px;
  letter-spacing:-.01em;color:var(--mute);cursor:pointer;white-space:nowrap;transition:background .18s,color .18s,transform .14s}
nav button i{display:none}
nav button.on{background:var(--ink);color:var(--cream)}
@keyframes tabPop{0%{transform:scale(.92)}55%{transform:scale(1.05)}100%{transform:scale(1)}}
nav button:active{transform:scale(.95)}
#add{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:8;
  width:64px;height:64px;border-radius:50%;border:0;background:var(--ink);color:var(--cream);cursor:pointer;display:none;
  box-shadow:0 14px 30px -12px rgba(21,19,32,.55);transition:transform .16s cubic-bezier(.3,1.4,.5,1)}
#add.on{display:grid;place-items:center}
#add:active{transform:translateX(-50%) scale(.93)}
#add svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
#add.busy{animation:pop .32s cubic-bezier(.3,1.4,.5,1)}

/* sheets */
.sheet{position:fixed;inset:0;background:rgba(21,19,32,.45);display:none;align-items:flex-end;z-index:10}
.sheet.on{display:flex}
.panel{background:var(--cream);border-radius:26px 26px 0 0;width:100%;max-height:94dvh;overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;padding:14px 18px calc(24px + env(safe-area-inset-bottom))}
.panel .in{max-width:560px;margin:0 auto}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.head{display:flex;gap:14px;align-items:flex-start}
.head .hh{flex:1;min-width:0}
.head h3{font-size:26px;letter-spacing:-.03em}
.head .co{width:64px;height:94px;border-radius:12px;object-fit:cover;background:var(--cream2);flex:none}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span{font-weight:700;color:var(--mute)}
.numbers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.numbers div{background:#fff;border-radius:14px;padding:10px 8px;text-align:center}
.numbers b{font-family:var(--head);font-weight:900;font-size:22px;letter-spacing:-.03em;display:block;line-height:1}
.numbers span{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);display:block;margin-top:4px}
.twin{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.twin:last-child{border-bottom:0}
.twin .t{flex:1;min-width:0}
.twin .t b{display:block;font-family:var(--head);font-weight:800;font-size:15px}
.twin .t small{font-size:11.5px;font-weight:600;color:var(--mute)}
.ring{font-family:var(--head);font-weight:900;font-size:13px;border:3px solid var(--mint);border-radius:999px;padding:5px 9px;flex:none}
.auth{padding:12vh 0 0}
.auth h1{font-size:44px;letter-spacing:-.04em;line-height:.95}
.auth h1 span{color:var(--blue)}
.auth p{color:var(--mute);font-weight:500;line-height:1.55;margin-top:14px;font-size:15px}
/* ---- motion: only where it explains something ---- */
@keyframes sheetUp{from{transform:translateY(26px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes sheetDown{from{transform:translateY(0);opacity:1}to{transform:translateY(30px);opacity:0}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translate(var(--slide,0px),12px) scale(.985);opacity:0}
  62%{transform:translate(0,-2px) scale(1.004);opacity:1}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes chipPop{0%{transform:scale(1)}45%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes grow{from{width:0}}
@keyframes dot{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes saved{0%{transform:translateY(-8px) scale(.9);opacity:0}25%{transform:translateY(0) scale(1);opacity:1}80%{opacity:1}100%{opacity:1}}
.sheet.on{animation:fadeIn .18s ease}
.sheet.on .panel{animation:sheetUp .26s cubic-bezier(.2,.9,.25,1)}
/* on its way out it stops taking taps, so the next thing you touch is the page */
.sheet.out{animation:fadeOut .2s ease both;pointer-events:none}
.sheet.out .panel{animation:sheetDown .2s cubic-bezier(.4,0,.9,.35) both}
section.on > div > *{animation:rise .38s cubic-bezier(.2,1.2,.38,1) both}
/* cards that arrive as you scroll: they lift into place once, then stay put */
.reveal{opacity:0;transform:translateX(30px) scale(.965) rotate(1.2deg);
  transition:opacity .34s cubic-bezier(.2,.9,.25,1),transform .58s cubic-bezier(.2,1.22,.36,1);will-change:transform,opacity}
.reveal.in{opacity:1;transform:none;will-change:auto}
/* who is in the room right now */
.here{display:flex;align-items:center;gap:8px;margin-top:10px;min-height:30px}
.here .faces{display:flex}
.here .face{margin-left:-7px;border-radius:50%;background:var(--card);box-shadow:0 0 0 2.5px var(--card);line-height:0}
.here .face:first-child{margin-left:0}
.here .face .av svg{width:28px;height:28px;display:block}
.here small{font-size:11.5px;font-weight:700;color:var(--mute)}
.alone{margin-top:12px;background:var(--cream2);border-radius:16px;padding:14px 15px;display:grid;gap:7px}
.alone b{font-family:var(--head);font-weight:800;font-size:14.5px}
.alone span{font-size:13px;line-height:1.5;color:var(--mute)}
.alone .btn{margin-top:4px}
@keyframes cometTurn{to{transform:rotate(360deg)}}
svg .comet{transform-box:fill-box;transform-origin:center;animation:cometTurn 4.2s linear infinite}
.tier{border:1.5px solid var(--line);border-radius:22px;padding:16px 18px;margin-top:12px}
.tier.paid{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.tier .h{font-family:var(--head);font-weight:900;font-size:16px;letter-spacing:-.02em}
.tier.paid .h{color:var(--cream)}
.tier .price{font-family:var(--head);font-weight:900;font-size:30px;letter-spacing:-.04em;display:block;margin-top:4px}
.tier ul{margin:12px 0 0 17px;font-size:13px;line-height:1.75;color:var(--mute)}
.tier.paid ul{color:#D9D2E4}
.tier .note{font-size:11.5px;line-height:1.5;color:var(--mute);margin-top:12px;padding-top:10px;
  border-top:1px solid var(--line)}
.tier.paid .note{color:#B9B1C9;border-color:#332C42}
/* the deck: the top card square on, the next two peeking behind it */
.deck{position:relative;height:266px;display:flex;align-items:center;justify-content:center;margin-top:16px}
.dk{position:absolute;width:172px;aspect-ratio:2/3;border-radius:16px;overflow:hidden;
  background:var(--cream2);box-shadow:0 18px 34px -20px rgba(21,19,32,.6);
  transform:translate(calc(var(--o) * 15px), calc(var(--o) * -11px)) scale(calc(1 - var(--o) * .07));
  opacity:calc(1 - var(--o) * .3);
  transition:transform .38s cubic-bezier(.2,1.1,.35,1),opacity .3s ease}
.dk .dkco{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s}
.dk .dkco.ok{opacity:1}
.dkname{text-align:center;margin-top:14px}
.dkname b{font-family:var(--head);font-weight:900;font-size:21px;letter-spacing:-.03em;display:block}
.dkname small{color:var(--mute);font-size:12.5px;font-weight:600;display:block;margin-top:3px}
.dkbar{margin-top:14px}
@media (prefers-reduced-motion:reduce){ .dk{transition:none} }
.markrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mk{display:block;border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--cream)}
.mk b{font-family:var(--head);font-weight:800;font-size:13px;display:block}
.mk small{font-size:10.5px;color:var(--mute);font-weight:600;display:block;margin-top:1px}
.mk-founder{border-color:var(--bad);background:#FFF1F6}
.mk-founder b{color:var(--bad)}
.mk-argument,.mk-stillhere{border-color:var(--ink)}
.here .dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none;
  animation:hereBeat 2.6s ease-in-out infinite}
@keyframes hereBeat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}
@keyframes faceIn{0%{transform:scale(0) translateY(6px);opacity:0}62%{transform:scale(1.18)}100%{transform:none;opacity:1}}
.here .face.came{animation:faceIn .52s cubic-bezier(.2,1.4,.4,1) both}
.here .face.went{animation:faceIn .24s cubic-bezier(.4,0,.9,.4) reverse both}
/* an entry that landed while you were looking, warm until it cools */
.slip.landedNow{animation:landIn .44s cubic-bezier(.2,.9,.25,1) both}
@keyframes landIn{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
.slip.warm{background:#FFF1D6;border-color:#F3D9A8;transition:background 2.4s ease,border-color 2.4s ease}
/* what your rating did to the room */
.conseq{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--mute);
  padding:9px 0 2px;animation:rise .42s cubic-bezier(.2,1.2,.38,1) both}
.conseq b{font-family:var(--head);font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.conseq .up{color:var(--good)}.conseq .down{color:var(--bad)}
@keyframes starIn{from{transform:scale(.35) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.reveal.in .stars i{animation:starIn .36s cubic-bezier(.3,1.5,.5,1) both;animation-delay:.1s}
.reveal.in .stars i:nth-child(2){animation-delay:.15s}
.reveal.in .stars i:nth-child(3){animation-delay:.2s}
.reveal.in .stars i:nth-child(4){animation-delay:.25s}
.reveal.in .stars i:nth-child(5){animation-delay:.3s}
section.on > div > *:nth-child(2){animation-delay:.03s}
section.on > div > *:nth-child(3){animation-delay:.06s}
section.on > div > *:nth-child(4){animation-delay:.09s}
section.on > div > *:nth-child(n+5){animation-delay:.12s}
/* covers load at their own pace, so they fade up as each one lands */
img.co,.po img,.slot.full img,.ttl img{opacity:0;transform:scale(1.03);
  transition:opacity .42s ease,transform .55s cubic-bezier(.2,.9,.25,1)}
img.ok{opacity:1;transform:none}
@keyframes starLand{0%{transform:scale(.5) rotate(-26deg)}55%{transform:scale(1.3) rotate(7deg)}100%{transform:none}}
.rate button.pop svg{animation:starLand .4s cubic-bezier(.3,1.6,.5,1)}
.chip.bump{animation:chipPop .22s cubic-bezier(.3,1.4,.5,1)}
.bar .tr i{animation:grow .5s cubic-bezier(.2,.9,.25,1) both}

.newline{display:flex;align-items:center;gap:10px;margin:18px 0 2px;font-family:var(--head);font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--bad)}
.newline:before,.newline:after{content:"";height:2px;background:var(--bad);opacity:.35;flex:1}
.together{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;background:var(--mint);color:var(--ink);padding:4px 9px;border-radius:999px}
.onb .picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.onb .slot{aspect-ratio:2/3;border-radius:14px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--mute);font-weight:800;font-size:22px;background:#fff}
.onb .slot.full{border-style:solid;border-color:transparent;padding:0;overflow:hidden;position:relative}
.review{border-radius:22px;padding:20px;background:var(--blue);color:#fff;margin-top:12px}
.review h3{font-size:26px}
.review .big{font-family:var(--head);font-weight:900;font-size:52px;letter-spacing:-.04em;line-height:1;margin-top:10px}
.review .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.review .grid4 div{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 8px;text-align:center}
.review .grid4 b{font-family:var(--head);font-weight:900;font-size:20px;display:block}
.review .grid4 span{font-size:10px;font-weight:700;text-transform:uppercase;opacity:.8}
.review .line{margin-top:14px;font-weight:600;font-size:15px;opacity:.95}
.prog{height:8px;border-radius:99px;background:var(--cream2);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s}
.blank{background:#fff;border-radius:22px;padding:22px;margin-top:12px;text-align:center}
.blank .ic{width:56px;height:56px;border-radius:18px;margin:0 auto 12px;display:grid;place-items:center;font-family:var(--head);font-weight:900;font-size:22px}
.blank h3{font-size:20px}
.blank p{color:var(--mute);font-weight:500;font-size:14.5px;margin-top:6px;line-height:1.5}
.blank .stack{margin-top:14px}
@keyframes shim{from{background-position:-260px 0}to{background-position:260px 0}}
.skel{border-radius:22px;background:#fff;padding:16px;margin-top:12px}
.skel i{display:block;height:14px;border-radius:7px;margin:8px 0;

.skel i.t{height:22px;width:60%}.skel i.s{width:40%}

.arc i{width:6px;border-radius:2px;background:var(--ink);opacity:.25}
.arc i.last{opacity:1}
.offline{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:9;display:none;
  background:var(--ink);color:var(--cream);font-weight:700;font-size:13px;padding:10px 16px;border-radius:999px}
.offline.on{display:block}

.searchlog{margin-top:10px}
.slip .q.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{background:none;border:0;padding:4px 0 0;font-family:var(--head);font-weight:800;font-size:13px;color:var(--mute);cursor:pointer}
@keyframes thump{0%{transform:scale(1)}30%{transform:scale(1.04)}60%{transform:scale(.985)}100%{transform:scale(1)}}
.result.landed{animation:thump .42s cubic-bezier(.3,1.3,.5,1)}
.wheelwrap.landed{animation:thump .34s cubic-bezier(.3,1.3,.5,1)}
.savedchip{animation:saved 1.6s ease both}
@media(prefers-reduced-motion:reduce){#wheelG{transition-duration:.5s}
  .sheet.on,.sheet.on .panel,.sheet.out,.sheet.out .panel,section.on > div > *,.rate button.pop svg,.chip.bump,
  .bar .tr i,.savedchip,nav button.on,.reveal.in .stars i,.cell.going,

  html,body{transition:none}
  img.co,.po img,.slot.full img,.ttl img{opacity:1;transform:none;transition:none}
  .wash,.sheet.on .cuts button,.cell.dealt,.po .tick.swept,.po .tick.swept:after,.cell.landed .po,
  .cell.shoved .po,.tiles .tile,[data-same].popped,[data-same].popped:before,
  .sheet.on .av.meet svg > g > *,.sheet.on .av.big svg > g > *,.av.new svg > g > *,.av.new .eyes,.av .eyes,

  .navpill,.odo .reel .strip,.trio .agree .ring .val{transition:none}

  .tile,.po,.club,.slip,.btn{transition:none}

<body>

<header><div class="wrap">
  <div class="logo"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="14" width="34" height="34" rx="8" fill="var(--apricot)"/><rect x="22" y="14" width="34" height="34" rx="8" fill="var(--sky)" opacity=".85"/></svg>Rooms</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true"><div class="panel"><div class="in" id="sheetBody"></div></div></div>

<script type="module">
/* ============ Rooms — one log for film, tv, books and games ============
   scores are half-stars 1..10 (10 = five). work ids: film:496243 · tv:1396 · book:OL27448W · game:1942 */
const SUPABASE_URL = "https://caaxycmobhssxclrakim.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_zvZhatlvUg6F_CDzTmxX9A_Vlv0n3PX";

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  if (d === new Date(y - y.getTimezoneOffset()*6e4).toISOString().slice(0,10)) return "yesterday"; const [,m,day] = String(d).split("-"); return `${+day} ${MON[+m-1]}`; };
const STAR = "M12 2.6l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.6 6.1 20.8l1.2-6.6L2.5 9.6l6.6-.9z";
let gid = 0;
function starPath(f) {
  if (f >= 1) return `<path d="${STAR}" fill="#151320"/>`;
  if (f <= 0) return `<path d="${STAR}" fill="#EFE6D8"/>`;
  const g = "g" + (++gid);
  return `<defs><linearGradient id="${g}"><stop offset="50%" stop-color="#151320"/><stop offset="50%" stop-color="#EFE6D8"/></linearGradient></defs><path d="${STAR}" fill="url(#${g})"/>`;
}
const stars = (half, cls = "") => `<div class="stars ${cls}">${[0,1,2,3,4].map(i => { const f = half/2 - i;
  return `<i class="${f >= 1 ? "" : f > 0 ? "half" : "off"}"></i>`; }).join("")}</div>`;
/* ---------- avatars: a soft solid, lit from above ----------
   the handle picks a shape, a colour and a tilt; anyone can override all three. */
/* nine, one row: the three near-duplicates (a second coral, a second mint, a second violet) are out */
const AV_COLS = ["#FFB36B","#FF8E6E","#F5A3C7","#FFE86A","#9EF0C9","#8FD3FF","#B9A6FF","#7A7590","#151320"];
const AV_SHAPES = {
  cube: c => `<path d="M22 34h56a10 10 0 0 1 10 10v30a10 10 0 0 1-10 10H22a10 10 0 0 1-10-10V44a10 10 0 0 1 10-10z" fill="${c.base}"/>
    <path d="M22 34h56a10 10 0 0 1 10 10H12a10 10 0 0 1 10-10z" fill="${c.light}"/>`,
  box: c => `<path d="M50 12l34 18v40L50 88 16 70V30z" fill="${c.base}"/>
    <path d="M50 12l34 18-34 18-34-18z" fill="${c.light}"/><path d="M84 30v40L50 88V48z" fill="${c.dark}"/>`,
  ball: c => `<circle cx="50" cy="54" r="36" fill="${c.base}"/>
    <path d="M14 54a36 36 0 0 1 72 0c0-14-16-22-36-22S14 40 14 54z" fill="${c.light}"/>
    <path d="M50 90a36 36 0 0 0 34-24c-6 10-19 16-34 16s-28-6-34-16a36 36 0 0 0 34 24z" fill="${c.dark}"/>`,
  can: c => `<path d="M18 34h64v40c0 9-14 14-32 14s-32-5-32-14z" fill="${c.base}"/>
    <ellipse cx="50" cy="34" rx="32" ry="13" fill="${c.light}"/>
    <path d="M82 34v40c0 6-6 10-16 12 6-4 8-8 8-14V38z" fill="${c.dark}"/>`,
  cone: c => `<path d="M50 14l30 58c0 9-13 14-30 14s-30-5-30-14z" fill="${c.base}"/>
    <path d="M50 14l14 27c-4-2-9-3-14-3s-10 1-14 3z" fill="${c.light}"/>
    <path d="M80 72c0 9-13 14-30 14 10-2 16-7 16-14l-6-40z" fill="${c.dark}"/>`,
  pill: c => `<rect x="26" y="14" width="48" height="74" rx="24" fill="${c.base}"/>
    <path d="M50 14a24 24 0 0 1 24 24H26a24 24 0 0 1 24-24z" fill="${c.light}"/>
    <path d="M74 38v26a24 24 0 0 1-16 22c8-6 8-12 8-22V38z" fill="${c.dark}"/>`,
  arch: c => `<path d="M18 88V46a32 32 0 0 1 64 0v42z" fill="${c.base}"/>
    <path d="M50 14a32 32 0 0 1 32 32H18a32 32 0 0 1 32-32z" fill="${c.light}"/>
    <path d="M82 46v42H64V46a14 14 0 0 0-8-13 32 32 0 0 1 26 13z" fill="${c.dark}"/>`,
  step: c => `<path d="M14 88V56h30V30h42v58z" fill="${c.base}"/>
    <path d="M44 30h42v10H44zM14 56h30v10H14z" fill="${c.light}"/>
    <path d="M86 30v58H62V30z" fill="${c.dark}"/>`
};
const AV_NAMES = Object.keys(AV_SHAPES);
function avShade(hex, amt) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (amt > 0) { r += (255-r)*amt; g += (255-g)*amt; b += (255-b)*amt; } else { r *= (1+amt); g *= (1+amt); b *= (1+amt); }
  return "#" + [r,g,b].map(v => Math.round(v).toString(16).padStart(2,"0")).join(""); }
function avHash(s) { let h = 2166136261; for (const ch of String(s || "?")) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return Math.abs(h); }
function avFor(p) {
  const a = p?.avatar;
  const founder = !!p?.founder || founderIds.has(p?.id);
  if (a && AV_SHAPES[a.shape] && AV_COLS[a.col] !== undefined)
    return { shape:a.shape, col:a.col, eyes:AV_EYES[a.eyes] ? a.eyes : "pair", tilt:a.tilt ?? 0, founder };
  const h = avHash(p?.handle);
  return { shape:AV_NAMES[h % AV_NAMES.length], col:(h >> 3) % AV_COLS.length,
    eyes:AV_EYE_NAMES[(h >> 11) % AV_EYE_NAMES.length], tilt:((h >> 7) % 9) - 4, founder }; }
/* the same capsule, arranged four ways — nothing changes but the spacing and the height */
const AV_EYES = {
  pair:  `<rect x="40" y="46" width="7" height="20" rx="3.5"/><rect x="55" y="44" width="7" height="22" rx="3.5"/>`,
  short: `<rect x="41" y="48" width="7" height="13" rx="3.5"/><rect x="54" y="47" width="7" height="14" rx="3.5"/>`,
  wide:  `<rect x="34" y="46" width="7" height="19" rx="3.5"/><rect x="61" y="45" width="7" height="21" rx="3.5"/>`,
  tall:  `<rect x="41" y="41" width="6.5" height="27" rx="3.2"/><rect x="54" y="40" width="6.5" height="28" rx="3.2"/>`
};
const AV_EYE_NAMES = Object.keys(AV_EYES);
/* ---------- the founder's ring ----------
   One person has this. It is drawn inside the 100x100 viewBox rather than as a CSS ring,
   so it scales with the avatar wherever it appears — 24px in a chip, 84 on a profile —
   without a single size being written down twice. A conic gradient can't live in SVG, so
   the tail is six arcs of rising opacity, which is also cheaper to paint. */
const COMET = (() => {
  /* the shapes are not centred on the viewBox — a ball sits at 50,54 and a cube runs
     34 to 84 — so the ring is centred on the art, not on the box, and sized to clear
     its own stroke inside 100 units */
  const R = 42, CX = 50, CY = 54, W = 5, TAIL = 252, N = 14;
  const pt = d => { const r = (d - 90) * Math.PI / 180;
    return [(CX + R * Math.cos(r)).toFixed(2), (CY + R * Math.sin(r)).toFixed(2)]; };
  /* one long sweep in many short pieces: enough of them that the fade reads as a
     gradient rather than as steps, butt-capped so the joins don't bobble */
  let d = "";
  for (let i = 0; i < N; i++) {
    const a = (i / N) * TAIL, b = ((i + 1) / N) * TAIL;
    const [x1,y1] = pt(a), [x2,y2] = pt(b);
    const o = Math.pow((i + 1) / N, 1.7);          /* dark at the head, gone at the tail */
    d += `<path d="M${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2}" fill="none" stroke="#E0407F"
      stroke-opacity="${o.toFixed(3)}" stroke-width="${W}" stroke-linecap="${i === 0 ? "round" : "butt"}"/>`;
  }
  const [hx,hy] = pt(TAIL);
  return `<g class="comet">${d}
    <circle cx="${hx}" cy="${hy}" r="${W/2 + 1.6}" fill="#E0407F"/>
    <circle cx="${hx}" cy="${hy}" r="1.7" fill="#FFF7EC"/></g>`;
})();

function avSVG(a) {
  const base = AV_COLS[a.col] || AV_COLS[0], dark = base === "#151320";
  const c = { base, light: dark ? "#3A3650" : avShade(base, .30), dark: dark ? "#0B0A12" : avShade(base, -.18) };
  const eyes = AV_EYES[a.eyes] || AV_EYES.pair;
  return `<svg viewBox="0 0 100 100" data-shape="${a.shape}" aria-hidden="true"><g transform="rotate(${a.tilt||0} 50 54)">${AV_SHAPES[a.shape](c)}
    <g class="eyes" fill="${dark ? "#FFF7EC" : "#151320"}">${eyes}</g></g>${a.founder ? COMET : ""}</svg>`; }
/* a face is new until you've seen it this session; the seed keeps two people
   who share a shape from blinking in lockstep */
const metFaces = new Set();
const avSeed = who => { let h = 0; for (let i = 0; i < who.length; i++) h = (h * 31 + who.charCodeAt(i)) | 0; return Math.abs(h); };
const avatar = (p, cls = "") => { const who = String(p?.id || p?.handle || "");
  const fresh = who && !metFaces.has(who); if (fresh) metFaces.add(who);
  const n = avSeed(who);
  return `<span class="av ${cls}${fresh ? " new" : ""}" style="--bd:${(n % 61) / 10}s;--id:${(n % 37) / 10}s">${avSVG(avFor(p))}</span>`; };

/* ============ the four rooms ============ */
const KINDS = {
  film: { label:"Film", room:"Film", plural:"Films", colour:"var(--film)", verb:"watched", creatorLabel:"Directed by", lengthLabel:"Runtime", unit:" min",
    craft:["the directing","the writing","the acting","the look","the editing","the music","the sets","the ending","the atmosphere","the pacing","the dialogue"],
    ticks:[["first","First watch","Rewatch"],["where","At the cinema","At home"]] },
  tv: { label:"TV", room:"TV", plural:"TV", colour:"var(--tv)", verb:"watched", creatorLabel:"Made by", lengthLabel:"Episodes", unit:" eps",
    craft:["the writing","the acting","the look","the season","the cast","the music","the ending","the world","the pacing","the dialogue"],
    ticks:[["first","First watch","Rewatch"],["where","Finished it","Part way"]] },
  book: { label:"Book", room:"Books", plural:"Books", colour:"var(--book)", verb:"read", creatorLabel:"Written by", lengthLabel:"Pages", unit:" pp",
    craft:["the writing","the structure","the characters","the ideas","the voice","the world","the ending","the pacing","the dialogue"],
    ticks:[["first","First read","Reread"],["where","Paper","Audio"]] },
  game: { label:"Game", room:"Games", plural:"Games", colour:"var(--game)", verb:"played", creatorLabel:"Made by", lengthLabel:"Hours", unit:" h",
    craft:["how it plays","the controls","the art","the sound","the story","the world","the levels","the ending","the pacing"],
    ticks:[["first","First play","Replay"],["where","Finished it","Dropped it"]] }
};
const K = k => KINDS[k] || KINDS.film;
const kindOf = id => String(id).split(":")[0];
const tag = k => `<span class="tag ${k}">${K(k).label}</span>`;
const cover = (w, cls = "co") => w?.cover ? `<img class="${cls}" src="${esc(w.cover)}" alt="" onload="this.classList.add('ok')" onerror="this.remove()">` : `<div class="${cls}"></div>`;

/* ============ prefs + sources ============ */
const WORKER = "https://rooms.jordandf1.workers.dev";
const proxy = () => (P.workerUrl || WORKER).replace(/\/+$/, "");
const P = Object.assign({ workerUrl:"", tmdbKey:"", activeList:null, activeRoom:null, picked:null, kinds:["film","tv","book","game"], shelfFilter:"", feed:"room" },
  JSON.parse(localStorage.getItem("rooms.prefs") || "{}"));
const saveP = () => localStorage.setItem("rooms.prefs", JSON.stringify(P));
async function tmdb(path, params = {}) {
  const direct = !proxy(); if (direct && !P.tmdbKey) throw new Error("needs a TMDB key or the worker");
  const u = new URL((direct ? "https://api.themoviedb.org" : proxy()) + "/3/" + path);
  Object.entries(params).forEach(([k,v]) => u.searchParams.set(k,v)); if (direct) u.searchParams.set("api_key", P.tmdbKey);
  const r = await fetch(u); if (!r.ok) throw new Error("TMDB " + r.status); return r.json(); }

  const r = await fetch(proxy() + "/igdb/" + endpoint, { method:"POST", headers:{ "Content-Type":"text/plain" }, body });
  if (!r.ok) throw new Error("IGDB " + r.status); return r.json(); }
async function ol(path, params = {}) { const base = proxy() ? proxy() + "/ol" : "https://openlibrary.org";
  const u = new URL(base + path); Object.entries(params).forEach(([k,v]) => u.searchParams.set(k,v));
  const r = await fetch(u); if (!r.ok) throw new Error("Open Library " + r.status); return r.json(); }
const TMDB_IMG = p => p ? "https://image.tmdb.org/t/p/w342" + p : "";
const SOURCES = {
  async film(t) { const d = await tmdb("search/movie", { query:t, include_adult:"false" });
    return (d.results||[]).slice(0,6).map(r => ({ id:"film:"+r.id, kind:"film", title:r.title, year:(r.release_date||"").slice(0,4), cover:TMDB_IMG(r.poster_path) })); },
  async tv(t) { const d = await tmdb("search/tv", { query:t, include_adult:"false" });
    return (d.results||[]).slice(0,6).map(r => ({ id:"tv:"+r.id, kind:"tv", title:r.name, year:(r.first_air_date||"").slice(0,4), cover:TMDB_IMG(r.poster_path) })); },
  async book(t) { const d = await ol("/search.json", { q:t, limit:"6", fields:"key,title,author_name,first_publish_year,cover_i,number_of_pages_median" });
    return (d.docs||[]).map(b => ({ id:"book:"+String(b.key).replace("/works/",""), kind:"book", title:b.title, year:String(b.first_publish_year||""),

  return per.map(f => Object.assign(f, { w:(f.n*f.avg + KW*mean)/(f.n+KW) })).sort((a,b) => b.w - a.w || b.n - a.n).slice(0, limit); }
function tasteOf(entries) { const craft = {}, people = {}, kinds = {}; for (const e of entries) { const w = works[e.work_id]; if (!w) continue; kinds[w.kind] = (kinds[w.kind]||0)+1;
    for (const l of (e.loved||[])) { if (l.startsWith("person:")) { people[l.slice(7)] = (people[l.slice(7)]||0)+1; continue; } const c = craft[l] ||= { total:0, by:{} }; c.total += e.score/10; c.by[w.kind] = (c.by[w.kind]||0) + e.score/10; } }
  return { craft:Object.entries(craft).sort((a,b)=>b[1].total-a[1].total), people:Object.entries(people).sort((a,b)=>b[1]-a[1]), kinds, tagged:entries.filter(e=>e.loved?.length).length, n:entries.length }; }
function tasteMatch(a, b) { const va = {}, vb = {}; a.craft.forEach(([k,v]) => va[k] = v.total); b.craft.forEach(([k,v]) => vb[k] = v.total);
  const keys = new Set([...Object.keys(va), ...Object.keys(vb)]); let dot = 0, na = 0, nb = 0;
  for (const k of keys) { const x = va[k]||0, y = vb[k]||0; dot += x*y; na += x*x; nb += y*y; }
  if (!na || !nb) return null; return Math.round(100 * dot / Math.sqrt(na*nb)); }
const tagCache = {};
async function tagStats(workId) { if (tagCache[workId]) return tagCache[workId];
  let rows = []; try { rows = await q(sb.from("entries").select("loved,user_id").eq("work_id", workId).limit(400)); }
  catch (err) { oops(err, "Couldn't load the tags"); }
  /* by person, not by entry — a rewatch shouldn't let one person outvote the room */
  const by = {}, people = new Set();
  for (const r of rows) { people.add(r.user_id);
    for (const k of new Set(r.loved || [])) (by[k] = by[k] || new Set()).add(r.user_id); }
  const n = people.size, counts = {};
  for (const k in by) counts[k] = by[k].size;
  const share = k => n ? Math.round((counts[k]||0)/n*100) : 0;
  /* share alone can't tell agreement from a small sample: on one entry every tag reads 100%.
     so a tag counts as popular only on a work people have actually turned up to. */
  const hot = k => n >= 5 && (counts[k]||0) >= 3 && share(k) >= 25;
  return (tagCache[workId] = { n, counts, share, hot }); }

  for (const e of myEntries) for (const k of (e.loved||[])) if (!k.startsWith("person:") && !known.has(k)) counts[k] = (counts[k]||0)+1;
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).slice(0,8); }

/* ---------- ordering entries on a work page ----------
   never ranks people, only posts. popular = who nodded; momentum = who nodded lately;
   like you = whoever singled out what you tend to single out. */
const SORTS = { popular:"Popular", momentum:"Momentum", similar:"Like you", recent:"Recent" };
const daysAgo = d => Math.max(0, (Date.now() - new Date(d + "T12:00:00Z")) / 864e5);
function sortEntries(es, how, myTaste) {
  const sames = e => (e.reactions||[]).length, talk = e => (e.replies||[]).length;
  const said = e => (e.note ? 2 : 0) + Math.min(2, (e.loved||[]).length ? 1 : 0);
  const weight = {}; (myTaste?.craft || []).forEach(([k,v],i) => weight[k] = v.total);
  const maxW = Math.max(1e-6, ...Object.values(weight));
  const like = e => { const ls = (e.loved||[]).filter(k => !k.startsWith("person:")); if (!ls.length) return 0;
    return ls.reduce((a,k) => a + (weight[k]||0)/maxW, 0) / Math.sqrt(ls.length); };
  const by = {
    popular: e => sames(e)*3 + talk(e)*2 + said(e),
    momentum: e => (sames(e)*3 + talk(e)*2 + said(e) + 1) / Math.pow(daysAgo(e.rated_on) + 2, .7),
    similar: e => like(e)*6 + sames(e)*.5 + said(e)*.25,
    recent: e => -daysAgo(e.rated_on)
  }[how] || (() => 0);
  return es.slice().sort((a,b) => by(b) - by(a) || String(b.created_at||"").localeCompare(String(a.created_at||"")));
}

/* ---------- reveal cards as they scroll in ---------- */
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
/* whatever is actually scrolling — the window, or a frame that wraps us */
function scroller() {
  let el = document.scrollingElement || document.documentElement;
  if (el.scrollHeight > el.clientHeight + 4) return null;   // window scrolls: observer default root
  for (let n = document.body; n; n = n.parentElement) { const st = getComputedStyle(n);
    if (/(auto|scroll)/.test(st.overflowY) && n.scrollHeight > n.clientHeight + 4) return n; }
  return null;
}
let revealObs = null, revealRoot = undefined, watching = new Set();
function makeObs() { const root = scroller();
  if (revealObs && revealRoot === root) return revealObs;
  revealRoot = root; if (revealObs) revealObs.disconnect();
  revealObs = new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting) { e.target.classList.add("in"); revealObs.unobserve(e.target); watching.delete(e.target); } },
    { root, rootMargin: "0px 0px -12% 0px", threshold: .02 });
  watching.forEach(el => revealObs.observe(el)); return revealObs; }
/* a plain scroll fallback, in case the observer's root guess is wrong (frames, embeds) */
function sweep() { if (!watching.size) return;
  const box = revealRoot ? revealRoot.getBoundingClientRect() : { top:0, bottom:window.innerHeight, height:window.innerHeight };
  const line = box.top + box.height * .88;                     /* fires as the card reaches the lower edge, in view */
  for (const el of [...watching]) { const b = el.getBoundingClientRect();
    if (b.top < line && b.bottom > box.top) { el.classList.add("in"); revealObs?.unobserve(el); watching.delete(el); } } }
addEventListener("scroll", sweep, { passive:true, capture:true });
addEventListener("resize", () => { makeObs(); sweep(); });
/* embedded in a frame we can't hear scroll from: poll cheaply while anything is still hidden,
   and never leave a card invisible for more than a few seconds */
let sweepTimer = null;
function keepSweeping() { if (sweepTimer) return;
  sweepTimer = setInterval(() => { if (!watching.size) { clearInterval(sweepTimer); sweepTimer = null; return; } sweep(); }, 250); }
function revealIn(root) {
  if (!root || REDUCED) return; const obs = makeObs();
  const rbox = revealRoot ? revealRoot.getBoundingClientRect() : { top:0, bottom:window.innerHeight, height:window.innerHeight };
  const fold = rbox.top + rbox.height * .88;
  $$(":scope > .slip, :scope > .card, :scope > .club, :scope > .twin", root).forEach((el, i) => {
    if (el.dataset.revealed) return; el.dataset.revealed = "1"; el.classList.add("reveal");
    if (el.getBoundingClientRect().top < fold) setTimeout(() => el.classList.add("in"), Math.min(i, 6) * 45);
    else { watching.add(el); obs.observe(el); }
  });
  setTimeout(sweep, 60); keepSweeping();
  setTimeout(() => { for (const el of [...watching]) { el.classList.add("in"); revealObs?.unobserve(el); watching.delete(el); } }, 6000);
}

/* ---------- an invite you can tap ----------
   the code still works, but a link is what people actually send each other. The code
   is held through sign-up, because a new person has to make an account before there
   is anyone to put in a room. */
const INVITE_KEY = "rooms.invite";
function takeInvite() {                       /* read it off the URL once, then tidy up */
  const m = /[#?&]join=([A-Za-z0-9]{4,12})/.exec(location.hash + location.search);
  if (m) { try { localStorage.setItem(INVITE_KEY, m[1].toUpperCase()); } catch {}
    history.replaceState(null, "", location.pathname + location.search.replace(/[?&]join=[^&]*/, "")); }
  try { return localStorage.getItem(INVITE_KEY); } catch { return null; }
}
const dropInvite = () => { try { localStorage.removeItem(INVITE_KEY); } catch {} };
const inviteLink = code => `${location.origin}${location.pathname}#join=${code}`;
/* called once you are through the door, whether that took ten seconds or a sign-up */
async function useInvite() {
  const code = takeInvite(); if (!code || sb.__local) return false;
  if (rooms.some(r => r.code === code)) { dropInvite(); return false; }
  try {
    const r = await q(sb.rpc("join_room", { p_code:code }));
    dropInvite(); await loadRooms();
    if (r?.id) { P.activeRoom = r.id; P.feed = "room"; saveP(); }
    await loadClubs();
    say(`You're in ${rooms.find(x => x.id === r?.id)?.name || "the room"}`, "good");
    return true;
  } catch (e) { dropInvite(); oops(e, "That invite didn't work"); return false; }
}

/* ---------- the day moves through it ----------
   one clock, six grounds. Re-checked every ten minutes and whenever the tab
   comes back, so a phone left open overnight is not still showing the morning. */
const DAY_BANDS = [[5,"early"],[7,"morning"],[12,"afternoon"],[17,"evening"],[20,"late"],[23,"night"]];
function paintDay() {
  const h = new Date().getHours();
  let band = "night"; for (const [from, name] of DAY_BANDS) if (h >= from) band = name;
  if (document.documentElement.dataset.day !== band) document.documentElement.dataset.day = band;
}
paintDay(); setInterval(paintDay, 6e5);
document.addEventListener("visibilitychange", () => { if (!document.hidden) paintDay(); });

/* ---------- who is in the room, and what lands while you are looking ----------
   one channel per room carries both: presence for the faces, postgres_changes for
   the entries. Opened when the room feed renders, closed when you leave it. */
let roomCh = null, roomChId = null, hereNow = [];
function leaveRoomChannel() { if (roomCh) { try { sb.removeChannel(roomCh); } catch {} }
  roomCh = null; roomChId = null; hereNow = []; }
function paintHere() {
  const el = $("#hereRow"); if (!el) return;
  const others = hereNow.filter(p => p.id !== me.id);
  const seen = new Set([...el.querySelectorAll(".face")].map(f => f.dataset.who));
  el.innerHTML = others.length
    ? `<span class="dot"></span><span class="faces">${others.map(p =>
        `<span class="face${seen.size && !seen.has(p.id) ? " came" : ""}" data-who="${esc(p.id)}"
          data-prof="${esc(p.id)}" style="cursor:pointer" title="${esc(p.handle)}">${avatar(p)}</span>`).join("")}</span>
       <small>${others.length === 1 ? esc(others[0].handle) + " is in here now" : others.length + " in here now"}</small>`
    : `<small>Nobody else in here right now</small>`;
  $$("[data-prof]", el).forEach(x => x.onclick = () => openProfile(x.dataset.prof));
}
function joinRoomChannel(R) {
  if (!R || sb.__local || !sb.channel) return;          /* local mode has no sockets */
  if (roomChId === R.id && roomCh) { paintHere(); return; }
  leaveRoomChannel(); roomChId = R.id;
  const memberIds = new Set(R.members.map(m => m.id));
  const ch = sb.channel(`room:${R.id}`, { config: { presence: { key: me.id } } });
  ch.on("presence", { event: "sync" }, () => {
    const st = ch.presenceState(); const out = [];
    for (const k in st) { const m = st[k][0]; if (m) out.push({ id: m.id || k, handle: m.handle, avatar: m.avatar }); }
    hereNow = out; paintHere();
  });
  ch.on("postgres_changes", { event: "INSERT", schema: "public", table: "entries" },
    p => onLiveEntry(p.new, memberIds));
  ch.subscribe(st => { if (st === "SUBSCRIBED")
    ch.track({ id: me.id, handle: me.handle, avatar: me.avatar }).catch(() => {}); });
  roomCh = ch;
}
/* an entry someone in this room just made, dropped in above the talk */
async function onLiveEntry(row, memberIds) {
  if (!row || row.user_id === me.id || !memberIds.has(row.user_id)) return;
  if ($(`[data-slip="${CSS.escape(row.id)}"]`)) return;   /* already on screen */
  let full; try { full = (await q(sb.from("entries").select(ENTRY_SEL).eq("id", row.id).limit(1)))[0]; } catch { return; }
  if (!full) return;
  const anchor = $("#talkTop"); if (!anchor) return;
  remember(full.works);
  const node = document.createElement("div"); node.innerHTML = slipHTML(full, { talk:true });
  const slip = node.firstElementChild; if (!slip) return;
  slip.classList.add("landedNow", "warm"); slip.dataset.revealed = "1";
  anchor.after(slip); wireSlips(slip, [full]);
  setTimeout(() => slip.classList.remove("warm"), 2600);
}

/* ---------- what's happened since you were last here ---------- */
let unseen = { entries:[], replies:[], followers:0 };
const lastSeen = () => P.lastSeen || new Date(Date.now() - 3*864e5).toISOString();
async function checkNew() {
  const since = lastSeen(); const R = activeRoom();
  try {
    if (R) { const ids = R.members.map(m => m.id).filter(i => i !== me.id);
      if (ids.length) { const es = await q(sb.from("entries").select("id,user_id,created_at,work_id,profiles!entries_user_id_fkey(handle)").in("user_id", ids).limit(100));
        unseen.entries = es.filter(e => String(e.created_at) > since); } }
    const mineIds = new Set(myEntries.map(e => e.id));
    const reps = await q(sb.from("replies").select("id,entry_id,user_id,created_at,profiles(handle)").limit(200));
    unseen.replies = reps.filter(r => mineIds.has(r.entry_id) && r.user_id !== me.id && String(r.created_at) > since);
    const fol = await q(sb.from("follows").select("follower,created_at").eq("followee", me.id));
    unseen.followers = fol.filter(f => String(f.created_at || "") > since).length;
  } catch {}
  paintDot();
}
function paintDot() {
  const n = unseen.entries.length + unseen.replies.length + unseen.followers;
  const btn = $("nav button[data-tab='doors']"); if (!btn) return;
  $(".dot", btn)?.remove();
  if (n > 0 && currentTab() !== "home") btn.insertAdjacentHTML("beforeend", `<span class="dot">${n > 9 ? "9+" : n}</span>`);
}
function markSeen() { P.lastSeen = new Date().toISOString(); saveP(); unseen = { entries:[], replies:[], followers:0 }; paintDot(); }

/* ---------- you were both there ---------- */
function together(e, all) {
  if (e.user_id === me.id) return null;
  const mine = myEntries.find(m => m.work_id === e.work_id);
  if (!mine) return null;
  const gap = Math.abs(new Date(mine.rated_on) - new Date(e.rated_on)) / 864e5;
  if (gap > 1.5) return null;
  const withMe = (e.context?.with || "").toLowerCase().includes(lc(me.handle)) || (mine.context?.with || "").toLowerCase().includes(lc(e.profiles?.handle || ""));
  return withMe ? "You were there" : "You both did this";
}

/* ============ auth ============ */
function renderAuth() {
  const b = $("#authBody");
  if (sb.__local) { const prev = sb.__db.profile;
    b.innerHTML = `<h1>Every room<br>you've <span>been in.</span></h1>
      <p>One log for film, TV, books and games — and the friends you argue with about them. It lives on this device until there's a backend.</p>
      ${prev ? `<div class="stack"><button class="btn blue" id="cont">Continue as ${esc(prev.handle)}</button></div>` : `
      <div class="lbl">Pick a handle</div><input id="handle" maxlength="24" autocapitalize="none" autocorrect="off" placeholder="handle">
      <div class="stack"><button class="btn blue" id="startLocal">Open my rooms</button></div>`}<p class="msg" id="authMsg"></p>`;
    const go = h => { sb.auth._localStart(h); loadMe().then(m => m && enter()); };
    if (prev) $("#cont").onclick = () => go(prev.handle); else $("#startLocal").onclick = () => { const h = lc($("#handle").value.trim());
      if (!/^[a-z0-9_]{2,24}$/.test(h)) { $("#authMsg").textContent = "two to twenty-four, lowercase, no spaces"; return; } go(h); }; return; }
  const invited = takeInvite();
  b.innerHTML = `<h1>Every room<br>you've <span>been in.</span></h1>
    ${invited ? `<p><b>Someone's put you on the list.</b> Make an account and you'll go straight into their room — the invite waits for you.</p>`
              : `<p>Sign in, or make an account.</p>`}
    <div class="lbl">Email</div><input id="email" type="email" inputmode="email" autocapitalize="none" autocorrect="off" placeholder="you@somewhere">
    <div class="lbl">Password</div><input id="pw" type="password" autocomplete="current-password" placeholder="at least eight characters">
    <div class="stack"><button class="btn blue" id="signIn">Sign in</button><button class="btn ghost" id="signUp">Make an account</button></div>
    <div class="stack"><button class="btn quiet" id="send">Email me a code instead</button></div>
    <div id="codeStep"></div><p class="msg" id="authMsg"></p>`;

  /* the code matters on a home screen app: a link opens in the browser, which keeps its own
     storage, so the session would land somewhere the installed app can never read */
  const askCode = email => { $("#codeStep").innerHTML = `<div class="lbl">The six digits we emailed you</div>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
      <div class="stack"><button class="btn blue" id="verify">Sign in</button><button class="btn quiet" id="again">Send another</button></div>`;
    const go = async () => { const token = $("#code").value.replace(/\D/g, "");
      if (token.length !== 6) { $("#authMsg").textContent = "six digits"; return; }
      $("#verify").disabled = true; $("#authMsg").textContent = "checking";
      try { await q(sb.auth.verifyOtp({ email, token, type:"email" }));
        $("#authMsg").textContent = ""; await landed(); }
      catch (e) { $("#authMsg").textContent = /expired|invalid/i.test(e.message) ? "that code didn't work — try another" : e.message;
        $("#verify").disabled = false; } };
    $("#verify").onclick = go;
    $("#code").onkeydown = e => { if (e.key === "Enter") go(); };
    $("#again").onclick = () => { $("#codeStep").innerHTML = ""; $("#send").click(); };
    $("#code").focus(); };

  const landed = async () => { if (await loadMe()) enter(); else if (pendingUser) renderClaim(); };
  const said = e => /invalid login/i.test(e.message) ? "that email and password don't match"
    : /already registered/i.test(e.message) ? "there's already an account on that email — sign in instead"
    : /not confirmed/i.test(e.message) ? "confirm the account from your email first"
    : e.message;

  const withPassword = async make => { const email = $("#email").value.trim(), password = $("#pw").value;
    if (!email) { $("#authMsg").textContent = "your email first"; return; }

    $("#signIn").disabled = $("#signUp").disabled = true; $("#authMsg").textContent = make ? "making it" : "signing in";
    try { const r = await q(make ? sb.auth.signUp({ email, password }) : sb.auth.signInWithPassword({ email, password }));
      /* signUp returns no session while Supabase is set to confirm addresses by email */
      if (make && !r?.session) { $("#authMsg").textContent = "Check your email to confirm the account, then sign in."; return; }
      $("#authMsg").textContent = ""; await landed(); }
    catch (e) { $("#authMsg").textContent = said(e); }
    finally { const a = $("#signIn"), b = $("#signUp"); if (a) a.disabled = false; if (b) b.disabled = false; } };

  $("#signIn").onclick = () => withPassword(false);
  $("#signUp").onclick = () => withPassword(true);
  $("#pw").onkeydown = e => { if (e.key === "Enter") withPassword(false); };

  $("#send").onclick = async () => { const email = $("#email").value.trim(); if (!email) return;
    $("#send").disabled = true; $("#authMsg").textContent = "sending";
    try { await q(sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin + location.pathname } }));
      $("#authMsg").textContent = "Sent. Enter the code below, or tap the link if you're in a browser.";
      askCode(email); }
    catch (e) { $("#authMsg").textContent = e.message; }
    finally { $("#send").disabled = false; } };
}
/* signed in, but no profile row yet — the id waiting for a handle */
let pendingUser = null;
function renderClaim() { const b = $("#authBody");

    <p>Pick the handle your room will know you by. Lowercase, no spaces.</p>
    <div class="lbl">Handle</div><input id="handle" maxlength="24" autocapitalize="none" autocorrect="off" placeholder="handle">
    <div class="stack"><button class="btn blue" id="claim">Open my rooms</button></div><p class="msg" id="authMsg"></p>`;
  const claim = async () => { const h = lc($("#handle").value.trim());

/* ---------- pick a cut, then save it ---------- */

  openSheet(`<h3>${esc(title || set.label)}</h3><p class="sub">Three cuts of the same thing. Pick one.</p>
    <div class="cuts" id="cutRow">${set.cuts.map(([name],i) =>
      `<button data-cut="${i}" class="${i===chosen?"on":""}"><canvas id="cut-${i}" width="216" height="270"></canvas><b>Cut ${i+1} · ${esc(name)}</b></button>`).join("")}</div>
    <div class="stack"><button class="btn blue" id="cutSave">Save it</button><button class="btn quiet" id="cutClose">Not now</button></div>
    <p class="msg" id="cutMsg"></p>`);

/* what a week or a month looks like as data */
function spanData(days, label) {
  const from = new Date(Date.now() - days*864e5).toISOString().slice(0,10);
  const entries = myEntries.filter(e => String(e.rated_on) >= from);
  const kinds = {}; entries.forEach(e => kinds[kindOf(e.work_id)] = (kinds[kindOf(e.work_id)]||0)+1);
  const t = tasteOf(entries), best = entries.slice().sort((a,b) => b.score - a.score)[0];
  const top = t.craft.slice(0,3).map(c => c[0]);
  return { label, n:entries.length, entries, kinds, t, best,
    line: top.length ? `You went for ${top.join(", ")}.` : "A quiet stretch.",
    range: `${stampDate(from)} — ${stampDate(today())}` }; }

/* the room's year keeps its own cut, and so does the year in review */
/* ---------- the room's year ---------- */
function roomPalmares(es) {
  const per = competition(es, 200);
  if (!per.length) return null;
  const enough = per.filter(f => f.n >= 2);
  const byKind = {}; for (const f of per) { const k = kindOf(f.id); if (!byKind[k] || f.w > byKind[k].w) byKind[k] = f; }
  const agreed = enough.slice().sort((a,b) => (b.agree||0) - (a.agree||0))[0];
  const split = enough.slice().sort((a,b) => (a.agree||100) - (b.agree||100))[0];
  const counts = {}; es.forEach(e => counts[e.user_id] = (counts[e.user_id]||0)+1);
  const busiest = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  return { best:per[0], byKind, agreed, split, busiest, n:es.length };
}

function logBlock(id, opts = {}) {
  return `${opts.label !== false ? `<div class="lbl">${opts.label || `Your log · ${myEntries.length}`}</div>` : ""}

      <div id="${id}"></div>` : ""}`; }
function wireLog(id, limit) {
  paintLog(id, limit);
  const q2 = $(`#${id}-q`); if (q2) { let t; q2.oninput = ev => { clearTimeout(t); P.logQ = ev.target.value; t = setTimeout(() => { saveP(); paintLog(id, limit); }, 200); }; } }
function paintLog(id = "logRows", limit = 0) {
  const el = $("#" + id); if (!el) return;
  const qtext = lc(P.logQ || "").trim(); const groups = {};
