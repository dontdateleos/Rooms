<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FFF7EC">
<meta name="color-scheme" content="light dark">
<script>/* before anything paints: a dark app that flashes cream first is worse than no
  dark app. Classic, inline and synchronous on purpose — the app's own script is a
  deferred module and runs far too late for this. */
(function(){try{var p=JSON.parse(localStorage.getItem("rooms.prefs")||"{}"),t=p.theme;
  if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t;
  if(t==="dark")document.querySelector('meta[name="theme-color"]').content="#16131C";}catch(e){}})();</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rooms">
<title>Rooms</title>
<link rel="apple-touch-icon" href="./icons/rooms-180.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FFF7EC'/%3E%3Crect x='20' y='30.4' width='37.2' height='37.2' rx='8.9' fill='%23FFB36B'/%3E%3Crect x='36.8' y='30.4' width='37.2' height='37.2' rx='8.9' fill='%238FD3FF' opacity='.85'/%3E%3C/svg%3E">
<!-- the type is served from here. Fetching it from Google handed fonts.gstatic.com an
     IP address every time somebody opened the app, which bought us nothing and cost a
     paragraph of the privacy policy. Same files, same subsets. -->
<link href="vendor/type.css" rel="stylesheet">
<style>
:root{--blue:#1F4FE0;--ink:#151320;--cream:#FFF7EC;--cream2:#FDEFDD;--card:#FFFFFF;--line:#EFE6D8;--mute:#7A7590;
  /* --onAccent is the one colour that never flips: it is the ink that sits ON a pastel,
     and a pastel is a pastel at midnight. --cream doubles as the light that reads on
     --ink, which is why a dark theme gets both right by swapping two values.
     --veil is the ground behind the blurred header and nav. */
  --onAccent:#151320;--veil:rgba(255,247,236,.92);
  --apricot:#FFB36B;--pink:#F5A3C7;--butter:#FFE86A;--mint:#9EF0C9;--sky:#8FD3FF;--lilac:#B9A6FF;--good:#1E9E6A;--bad:#E0407F;
  --film:var(--apricot);--tv:var(--pink);--book:var(--butter);--game:var(--mint);
  --head:Outfit,sans-serif;--body:Inter,system-ui,sans-serif}
/* the ground warms and dims across the day, so seven in the morning and ten at
   night are not the same room. Only the ground moves — cards stay white, ink stays ink. */
html[data-day="early"]    {--cream:#F6F1E8;--cream2:#EDE6DA;--line:#E7DFD2}
html[data-day="morning"]  {--cream:#FFF7EC;--cream2:#FDEFDD;--line:#EFE6D8}
html[data-day="afternoon"]{--cream:#FFFCF6;--cream2:#FCF2E6;--line:#F1EADE}
html[data-day="evening"]  {--cream:#FFEEDA;--cream2:#FBE3CA;--line:#EEDFC9}
html[data-day="late"]     {--cream:#F7E5D2;--cream2:#F0D9C2;--line:#E6D2BC}
html[data-day="night"]    {--cream:#EDE2D6;--cream2:#E4D4C5;--line:#DCCBBB}
/* ---- the same room with the lights off ----
   Two swaps do almost all of it: --ink becomes the light and --cream becomes the dark,
   so everything built as "ink on cream" or "cream on ink" turns over by itself. Cards
   sit a shade above the ground rather than relying on a shadow nobody can see at night,
   and the pastels keep their dark ink because they are still pastels. */
html[data-theme="dark"]{color-scheme:dark;
  --ink:#F4EDE2;--cream:#16131C;--cream2:#1D1A25;--card:#242030;--line:#2B2733;--mute:#A099B4;
  --veil:rgba(22,19,28,.92);--blue:#3E68F0;--good:#35C08C}
html[data-theme="light"]{color-scheme:light}
/* the ground still moves across the day; it moves between darks instead */
html[data-theme="dark"][data-day="early"]    {--cream:#141119;--cream2:#1B1822;--line:#29252F}
html[data-theme="dark"][data-day="morning"]  {--cream:#16131C;--cream2:#1D1A25;--line:#2B2733}
html[data-theme="dark"][data-day="afternoon"]{--cream:#191620;--cream2:#201D29;--line:#2F2B37}
html[data-theme="dark"][data-day="evening"]  {--cream:#1C1621;--cream2:#231D29;--line:#332B39}
html[data-theme="dark"][data-day="late"]     {--cream:#181319;--cream2:#1F1A21;--line:#2D272F}
html[data-theme="dark"][data-day="night"]    {--cream:#110F15;--cream2:#18151E;--line:#252230}
/* a card's edge does the work a shadow did in the light */
html[data-theme="dark"] .slip,
html[data-theme="dark"] .club,
html[data-theme="dark"] .card,
html[data-theme="dark"] .blank{box-shadow:0 0 0 1px var(--line)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;padding-bottom:calc(108px + env(safe-area-inset-bottom));overflow-x:clip}
html{overflow-x:clip}
main{overflow-x:clip}                 /* the deal-in travels 30px; keep it inside the page */
.wrap{overflow-x:clip}
.panel .in{overflow-x:clip}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
@media (min-width:760px){.wrap{max-width:720px;padding-left:28px;padding-right:28px}}
header{position:sticky;top:0;z-index:5;background:var(--veil);backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--head);font-weight:900;font-size:22px;letter-spacing:-.03em}
.logo .mark{width:30px;height:30px;display:block;flex:none}
.me{font-family:var(--head);font-weight:800;font-size:13px;background:var(--card);border:0;padding:8px 12px;border-radius:999px;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:8px}
.hr{display:flex;align-items:center;gap:8px}
/* settings used to be two taps down, behind your own profile; a cog is the one place
   people already look for it */
.cog{width:38px;height:38px;border-radius:50%;border:0;background:var(--card);color:var(--ink);cursor:pointer;
  display:none;place-items:center;padding:0;transition:transform .18s cubic-bezier(.3,1.4,.5,1)}
.cog:not([hidden]){display:grid}
.cog svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.cog:active{transform:rotate(38deg) scale(.94)}
.me .av{width:24px;height:24px}
/* the bell. A count of things that happened TO you — not a count of things to read,
   which is what the Rooms tab already says. Those are different feelings and they were
   sharing one number. */
.bell{position:relative;width:38px;height:38px;border-radius:50%;border:0;background:var(--card);color:var(--ink);cursor:pointer;
  display:none;place-items:center;padding:0;transition:transform .18s cubic-bezier(.3,1.4,.5,1)}
.bell:not([hidden]){display:grid}
.bell svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bell:active{transform:scale(.92)}
/* far enough out of the corner that it does not sit on the bell's dome — a count that
   eats the icon it belongs to leaves you looking at neither */
.bell .dot{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:99px;background:var(--bad);color:#fff;
  font-family:var(--head);font-weight:800;font-size:10px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--cream);box-sizing:content-box}
/* not .ring — that is the taste-twin match pill, and sharing the name put its mint
   border round the bell. Every class in here is global; this one is the bell's alone. */
.bell.jolt svg{animation:bellRing 1.1s cubic-bezier(.36,.07,.19,.97)}
@keyframes bellRing{0%,100%{transform:rotate(0)}12%{transform:rotate(13deg)}26%{transform:rotate(-11deg)}
  40%{transform:rotate(8deg)}54%{transform:rotate(-6deg)}68%{transform:rotate(3deg)}82%{transform:rotate(-2deg)}}
/* one row per thing that happened. Same shape as .twin so the app keeps one idea of
   what a person in a list looks like. */
/* the new-mark hangs to the left of the row, so the row is inset far enough to hold it:
   .panel .in clips overflow, and a dot at a negative offset is a dot nobody ever sees */
.note{display:flex;align-items:center;gap:12px;padding:12px 0 12px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.note:last-child{border-bottom:0}
.note.fresh{position:relative}
.note.fresh::before{content:"";position:absolute;left:1px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--bad)}
.note .t{flex:1;min-width:0}
.note .t b{font-family:var(--head);font-weight:800;font-size:14.5px}
.note .t p{font-size:13.5px;font-weight:500;line-height:1.35;margin:0}
.note .t small{display:block;font-size:11px;font-weight:600;color:var(--mute);margin-top:2px}
.note .acts{display:flex;gap:6px;flex:none}
/* who liked it, under the foot rather than inside the button: it is a sentence and it
   grows, and a button that grows moves everything beside it */
.acts button.lk{display:grid;place-items:center;padding:2px 0}
.hrt{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
/* at rest it was disappearing into the rule above it */
.acts button.lk{color:var(--mute2,#9a94ad)}
.acts button.lk.on{color:var(--bad)}
.likes{font-size:12.5px;font-weight:600;color:var(--mute);margin-top:8px}
/* ---- ten moments that used to snap ---- */
/* 01 the theme wipes rather than inverting between two frames */
::view-transition-old(root){animation:none}
::view-transition-new(root){animation:themeWipe .62s cubic-bezier(.65,0,.35,1)}
@keyframes themeWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.themeveil{position:fixed;inset:0;z-index:40;pointer-events:none;background:var(--cream);
  clip-path:inset(0 100% 0 0);animation:themeWipe .62s cubic-bezier(.65,0,.35,1) forwards}
/* 02 the feed leaves the way you came from */
.feedOut{animation:feedOut .3s cubic-bezier(.4,0,1,1) forwards}
.feedIn{animation:feedIn .38s cubic-bezier(0,0,.2,1) both}
@keyframes feedOut{to{opacity:0;transform:translateX(var(--fx,-26px))}}
@keyframes feedIn{from{opacity:0;transform:translateX(calc(var(--fx,-26px) * -1))}to{opacity:1;transform:none}}
/* 03 the line of names rolls over */
.likes{position:relative;min-height:16px}
.likes.rolling{overflow:hidden}
.likes .was{position:absolute;inset:0;animation:lineDown .32s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
.likes.rolling>span:not(.was){animation:lineUp .4s .06s cubic-bezier(.16,1,.3,1) both}
@keyframes lineDown{to{opacity:0;transform:translateY(14px)}}
@keyframes lineUp{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
/* 04 numbers that change count to the new one */
.ticking{font-variant-numeric:tabular-nums}
/* 05 a progress bar travels from where it was */
.club .tr i{transition:width .8s cubic-bezier(.16,1,.3,1)}
/* 06 something handed to you goes somewhere you can find it */
.flyer{position:fixed;z-index:30;border-radius:6px;pointer-events:none;
  box-shadow:0 8px 20px -8px rgba(21,19,32,.5);background:var(--cream2);overflow:hidden}
.flyer img{width:100%;height:100%;object-fit:cover;display:block}
.folding{overflow:hidden;animation:foldUp .44s cubic-bezier(.6,0,.4,1) forwards}
@keyframes foldUp{to{height:0;opacity:0;padding-top:0;padding-bottom:0;margin-top:0;margin-bottom:0}}
/* 07 four things that happened are four events, not a wall */
.dealt-in{animation:dealDown .42s cubic-bezier(.16,1,.3,1) both}
@keyframes dealDown{from{opacity:0;transform:translateY(-12px) scale(.97)}to{opacity:1;transform:none}}
/* 08 following somebody is something you did */
.chip.filling{position:relative;overflow:hidden;isolation:isolate}
.chip.filling>span{position:relative;z-index:1}
.chip.filling:before{content:"";position:absolute;inset:0;background:var(--ink);z-index:0;
  transform:scaleX(0);transform-origin:left;animation:sweepFill .42s cubic-bezier(.65,0,.35,1) forwards}
@keyframes sweepFill{to{transform:scaleX(1)}}
/* 09 a deleted entry leaves rather than vanishing */
.leaving{overflow:hidden;animation:leaveOut .5s cubic-bezier(.6,0,.35,1) forwards;pointer-events:none}
@keyframes leaveOut{
  0%{transform:none;opacity:1}
  28%{transform:scale(.975) rotate(-.7deg);opacity:.85}
  100%{transform:scale(.9) rotate(-1.4deg);opacity:0;height:0;padding-top:0;padding-bottom:0;margin-top:0}}
/* 32 how close the two of you end up IS the match, so the number needs no legend */
.twin.pairing .av{transition:transform .7s cubic-bezier(.16,1,.3,1)}
.twin.pairing .ring{transition:opacity .4s .45s,transform .4s .45s;opacity:0;transform:translateX(10px)}
.twin.pairing.drawn .ring{opacity:1;transform:none}
/* 34 giving one is the same gesture as taking one, in reverse */
.twin.given{animation:givenPop .34s cubic-bezier(.3,1.5,.5,1)}
@keyframes givenPop{0%{transform:none}45%{transform:scale(1.06)}100%{transform:none}}
/* 37 an export becomes a reveal */
.cuts button.drawing{opacity:0}
.cuts button.drawn{animation:cutIn .5s cubic-bezier(.16,1,.3,1) both}
@keyframes cutIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
/* 39 an empty room should look empty */
.chips .chip.seat{animation:seatIn .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes seatIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}

/* ---- ten you drive ---- */
/* 21 the fill is under your finger, so it cannot lag behind it */
.rate{touch-action:none}
.rate button{position:relative}
.rate .fill{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.rate .fill svg path{fill:var(--ink)}
/* 22 a sheet you can push away */
.panel.dragging{transition:none;cursor:grabbing}
.panel.springing{transition:transform .34s cubic-bezier(.16,1.1,.3,1)}
/* 23 the rows move rather than the list being redrawn */
.comprow{transition:transform .45s cubic-bezier(.16,1,.3,1)}
.comprow.rose{box-shadow:inset 0 0 0 2px var(--good)}
.comprow.fell{box-shadow:inset 0 0 0 2px var(--line)}
/* 24 the pill is attached to your finger */
.navpill.tracking{transition:none}
/* 26 a poster you can pick up */
.po{transition:transform .3s cubic-bezier(.2,.9,.25,1),box-shadow .3s}
.po.lifted{transform:scale(1.12) translateY(-5px);box-shadow:0 18px 30px -14px rgba(21,19,32,.55);z-index:4}
/* 28 the header gives the feed twenty pixels back once you have left the top */
header .wrap{transition:height .24s cubic-bezier(.2,.9,.25,1)}
header .logo{transition:font-size .24s,gap .24s}
header .logo .mark{transition:width .24s,height .24s}
header.tight .wrap{height:44px}
header.tight .logo{font-size:17px;gap:7px}
header.tight .logo .mark{width:23px;height:23px}
header.tight{box-shadow:0 1px 0 var(--line)}
/* 29 the chip says how long you have to change your mind */
.undoclock{width:18px;height:18px;flex:none;display:block}
.undoclock circle{fill:none;stroke-width:3;stroke-linecap:round}
.undoclock .t{stroke:currentColor;opacity:.28}
.undoclock .v{stroke:currentColor;stroke-dasharray:47;stroke-dashoffset:0;
  transform:rotate(-90deg);transform-origin:50% 50%;animation:drain var(--for,5s) linear forwards}
@keyframes drain{to{stroke-dashoffset:47}}
/* 30 you saw it break, so you see it mend */
.offline{transition:transform .42s cubic-bezier(.16,1.1,.3,1),background .3s}
.offline.good{background:var(--good)}

/* 12 a sentence somebody wrote arrives a few words at a time. Memories and reviews only —
   in a feed it would be a gimmick; here, slowing you down is the point. */
.saying .w{display:inline-block;animation:wordUp .46s cubic-bezier(.16,1,.3,1) both}
@keyframes wordUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* 13 arriving and leaving must not look the same */
.here .face.went{animation:faceGo .26s ease-in forwards}
@keyframes faceGo{to{opacity:0;transform:scale(.7)}}
/* 14 the sheet arrives with weight instead of being positioned */
@keyframes sheetUp2{0%{transform:translateY(26px);opacity:0}72%{transform:translateY(-6px);opacity:1}
  100%{transform:translateY(0);opacity:1}}
/* 15 the grid is one thing that moved, not a new grid */
.grid .cell{transition:transform .4s cubic-bezier(.16,1,.3,1)}
.grid.settling .cell{will-change:transform}
/* 16 an answer arriving, rather than a flash */
.settled{animation:resIn .34s cubic-bezier(.16,1,.3,1) both}
@keyframes resIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
/* 17 the agreement number is a measurement, so let it resolve */
.trio i.meter{display:block;height:5px;border-radius:99px;background:var(--good);width:0;margin-top:6px;
  transition:width .9s cubic-bezier(.16,1,.3,1)}
/* 18 a ring is the one thing in here that cannot be bought, so it gets drawn in front of you */
.struck{position:relative}
.struck svg.strike{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);z-index:3;
  pointer-events:none}
.struck svg.strike circle{fill:none;stroke-width:5;stroke-linecap:round;
  stroke-dasharray:var(--c);stroke-dashoffset:var(--c);animation:strike .8s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes strike{to{stroke-dashoffset:0}}
/* 19 the room changes while you are sitting in it */
html,body,header,nav{transition:background-color 90s linear,border-color 90s linear}
.po,.seg,.tag.dim,.skel{transition:background-color 90s linear}
/* 20 you have seen everything, rather than the app running out */
.endline{text-align:center;font-family:var(--head);font-weight:800;font-size:12.5px;color:var(--mute);
  padding:20px 0 4px;animation:endUp .6s cubic-bezier(.16,1,.3,1) both}
@keyframes endUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* 10 the room assembles, once a session */
.booting>*{animation:bootIn .46s cubic-bezier(.16,1,.3,1) both}
@keyframes bootIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.likes:empty{display:none}
/* the two fields almost nobody needs, folded away rather than deleted */
.fold{margin-top:18px;border-top:1px solid var(--line);padding-top:6px}
.fold>summary{list-style:none;cursor:pointer;font-weight:700;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--mute);padding:10px 0;display:flex;align-items:center;gap:7px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"";width:6px;height:6px;border-right:2px solid currentColor;
  border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .18s;flex:none}
.fold[open]>summary::before{transform:rotate(45deg)}
.peek{position:relative}
.peek input{padding-right:64px}
.peek button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;
  font-family:var(--body);font-weight:700;font-size:12px;color:var(--mute);cursor:pointer;padding:4px}
main{padding:8px 0 24px}
section{display:none}section.on{display:block}

h1,h2,h3{font-family:var(--head);font-weight:900;letter-spacing:-.03em;line-height:1}
h2{font-size:28px;margin:18px 0 4px}
h3{font-size:19px}
.sub{color:var(--mute);font-weight:500;font-size:14px;margin-top:6px}
.lbl{font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
.hl{padding:0 .1em;border-radius:10px;display:inline-block;line-height:1.05}
.tag{font-family:var(--head);font-weight:800;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:999px;display:inline-block;color:var(--onAccent);line-height:1.2}
.tag.film{background:var(--film)}.tag.tv{background:var(--tv)}.tag.book{background:var(--book)}.tag.game{background:var(--game)}
.tag.dim{background:var(--cream2);color:var(--mute)}
.msg{color:var(--mute);font-size:13px;font-weight:600;padding:10px 0;min-height:18px}
.empty{color:var(--mute);font-weight:500;line-height:1.55;padding:22px 0;font-size:15px}
.empty b{color:var(--ink);font-family:var(--head);font-weight:800}

input,textarea{width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;color:var(--ink);font-family:var(--body);font-size:16px;padding:12px 14px;outline:none;-webkit-appearance:none}
input:focus,textarea:focus{border-color:var(--ink)}
input::placeholder,textarea::placeholder{color:#B7B2C2}
textarea{min-height:76px;resize:none;line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;font-family:var(--head);font-weight:800;font-size:16px;padding:14px 18px;border-radius:999px;background:var(--ink);color:var(--cream);border:0;cursor:pointer}
.btn.soft{background:var(--butter);color:var(--onAccent)}
.btn.bad{background:var(--bad);color:#fff}
/* the quietest thing on a sheet, because it should be findable and never inviting */
.linky{background:none;border:0;padding:0;font:inherit;font-weight:700;font-size:13px;
  color:var(--mute);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linky:hover{color:var(--ink)}
.btn.bad:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.quiet{background:transparent;color:var(--mute)}
.btn.blue{background:var(--blue)}
.btn:disabled{opacity:.35}
button:focus-visible,.linky:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.stack{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.seg{display:flex;background:var(--cream2);padding:4px;border-radius:999px;gap:2px;margin:6px 0 10px}
.seg button{flex:1;background:none;border:0;font-family:var(--head);font-weight:800;font-size:13px;padding:9px 6px;border-radius:999px;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--cream)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.chip{font-family:var(--body);font-weight:700;font-size:13px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:7px 11px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:baseline;gap:6px}
.chip.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.chip.who{border-color:var(--lilac)}.chip.who.on{background:var(--lilac);color:var(--onAccent);border-color:var(--lilac)}
/* a chip carrying a face centres on it rather than on the baseline of its text, and the
   picture eats the padding on that side so the chip doesn't grow a lopsided gap */
.chip.hasface{align-items:center;padding-left:4px;gap:7px}
.face{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none;
  background:var(--lilac);display:grid;place-items:center;
  font-family:var(--head);font-weight:800;font-size:10px;color:var(--ink);letter-spacing:.02em}
.chip.on .face{box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.chip u{text-decoration:none;font-size:10px;font-weight:800;color:var(--mute)}
.chip.on u{color:var(--cream);opacity:.8}
.chip.k.on{background:var(--ink)}

.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 14px 34px -26px rgba(21,19,32,.35);margin-top:12px}
.card .h{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--head);font-weight:800;font-size:15px;padding-bottom:10px;border-bottom:2px solid var(--line);margin-bottom:4px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
/* the empty-cover placeholder is cream2, and so is an opened pick — without an edge of
   its own it vanishes into the row it is sitting on */
.row .co{width:40px;height:58px;border-radius:9px;object-fit:cover;background:var(--cream2);flex:none;
  box-shadow:inset 0 0 0 1px rgba(21,19,32,.09)}
.row .t{flex:1;min-width:0}
/* ---------- choosing what a result is ----------
   Three chips on the row left 55 pixels for the title on a small phone: "Silen…",
   "The …", "Here…". Nine readable buttons and not one readable name, which is the
   wrong way round — you cannot pick what to do with a thing you cannot identify.
   So the row is only the thing, and the three states open underneath the one you tap. */
.pick .row{border-bottom:1px solid var(--line)}
.pick.open{background:var(--cream2);border-radius:14px;margin:4px 0}
.pick.open .row{border-bottom:0;padding-left:10px}
.pick .acts{display:none}
.pick.open .acts{display:flex;gap:8px;padding:0 10px 11px}
.pick .acts button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  font-family:var(--head);font-weight:800;font-size:13.5px;padding:11px 6px;border-radius:99px;cursor:pointer}
.pick .acts button:first-child{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.row .t b{display:block;font-family:var(--head);font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:11.5px;font-weight:600;color:var(--mute);margin-top:4px}
.row .n{font-family:var(--head);font-weight:900;font-size:24px;letter-spacing:-.04em;flex:none}
.row .n small{display:block;font-size:10px;font-weight:700;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;text-align:right}
.row.done .t,.row.done .co{opacity:.45}
.rk{font-family:var(--head);font-weight:900;font-size:13px;width:18px;color:var(--mute);flex:none}
.good{color:var(--good)}.bad{color:var(--bad)}
.stars{display:flex;gap:4px}
.stars i{width:15px;height:15px;display:block;background:var(--ink);clip-path:polygon(50% 2%,62% 36%,98% 38%,70% 60%,80% 96%,50% 76%,20% 96%,30% 60%,2% 38%,38% 36%)}
.stars i.off{background:var(--line)}
.stars i.half{background:linear-gradient(90deg,var(--ink) 50%,var(--line) 50%)}
.stars.big i{width:24px;height:24px}
.stars.sm i{width:12px;height:12px}
.av{width:32px;height:32px;flex:none;display:block}
.av svg{width:100%;height:100%;display:block}
.av.big{width:84px;height:84px}
.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.picker button{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:6px;cursor:pointer;transition:transform .15s}
.picker button svg{width:100%;height:auto;display:block}
.picker button.on{border-color:var(--ink);background:var(--cream2)}
.picker button:active{transform:scale(.94)}
.swatches{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:8px}
.sw{width:100%;aspect-ratio:1;border-radius:99px;border:3px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--ink)}

/* slips (feed) */
.slip{background:var(--card);border-radius:22px;padding:14px 16px;margin-top:12px;box-shadow:0 14px 34px -26px rgba(21,19,32,.3)}
.slip .who{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:var(--mute)}
.slip .who b{color:var(--ink)}
.slip .ttl{display:flex;gap:10px;align-items:center;margin-top:10px;cursor:pointer}
.slip .ttl img,.slip .ttl .co{width:44px;height:64px;border-radius:9px;object-fit:cover;background:var(--cream2);flex:none}
.slip .ttl b{font-family:var(--head);font-weight:900;font-size:19px;letter-spacing:-.02em;line-height:1.05;display:block}
.slip .ttl small{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;font-weight:600;color:var(--mute);margin-top:5px}
.slip .q{font-weight:600;font-size:15px;line-height:1.45;margin-top:10px}
.slip .loved{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.slip .loved span{font-size:11.5px;font-weight:700;background:var(--cream2);padding:4px 9px;border-radius:999px}
.slip .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.acts{display:flex;gap:14px}
.acts button{background:none;border:0;font-family:var(--head);font-weight:800;font-size:13px;color:var(--mute);cursor:pointer;padding:0}
.acts button.on{color:var(--bad)}

/* tiles + grid */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{border-radius:18px;padding:14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;color:var(--ink);transform:rotate(var(--r,0deg))}
.tile b{font-family:var(--head);font-weight:900;font-size:17px;letter-spacing:-.02em}
.tile small{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;margin-top:8px}
.po{aspect-ratio:2/3;border-radius:14px;background:var(--cream2);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:8px;cursor:pointer;box-shadow:0 10px 24px -18px rgba(21,19,32,.4)}
.po img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.po b{position:relative;font-family:var(--head);font-weight:800;font-size:12px;line-height:1.15;color:var(--ink)}
.po:has(img.ok) b{display:none}
.po .tag{position:absolute;top:6px;left:6px;z-index:2}
.po .tick{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--card);border:0;z-index:2;cursor:pointer}
.po .tick.done{background:var(--ink)}
.po .tick.done:after{content:"";position:absolute;left:8px;top:4px;width:6px;height:11px;border-right:2px solid var(--cream);border-bottom:2px solid var(--cream);transform:rotate(40deg)}
.po.done{opacity:.45}
.po.soon{opacity:.72}
/* what you are on now is the one thing on the shelf that is already moving */
.po.onit{box-shadow:0 0 0 2px var(--ink)}
.cell .po.onit + .cap span:first-child{color:var(--ink);font-weight:600}
.po{-webkit-touch-callout:none}
/* ---------- the cabinet ----------
   A thing you have finished, as a thing: a box standing on a plinth. The poster is the
   front, the spine is the left edge, the plinth is tinted by medium so a row says what
   it is without a word of label. The shelf is what you have not got to; this is what you
   have. Both live in the Library.

   Nothing moves on its own. A grid of spinning cases is a grid where a quarter of them
   are edge-on and therefore gone at any moment, which looks like an app with holes in
   it. The turn belongs to the one you are touching — the same thing the memory card did,
   and it gives the motion a job. */
.tray{margin-top:18px}
.tray>.lbl{margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.tray>.lbl em{font-family:var(--body);font-style:normal;font-weight:600;font-size:11px;
  letter-spacing:0;text-transform:none;color:var(--mute)}
.run{display:flex;align-items:flex-end;gap:10px;overflow-x:auto;padding:2px 2px 6px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.run::-webkit-scrollbar{display:none}
.tok{position:relative;flex:none;background:none;border:0;padding:0;cursor:pointer;
  perspective:620px;scroll-snap-align:start;color:var(--ink);-webkit-tap-highlight-color:transparent;
  transition:transform .28s cubic-bezier(.2,.9,.25,1)}
/* They turn. I had them still, on the grounds that a case is nearly flat and a quarter
   of every rotation is an edge — which is true, and the answer to it is a spine with
   real width rather than no motion at all. Slowly, each from its own starting point, and
   only while it is on the screen: a hundred of these turning behind a scroll is a warm
   phone for nothing. */
.tok .ob{position:absolute;transform-style:preserve-3d;transform:rotateY(-14deg);
  animation:tokSpin 22s linear infinite;animation-delay:calc(var(--t, 0s) * -1);
  animation-play-state:paused;will-change:transform;filter:drop-shadow(0 8px 7px rgba(21,19,32,.16));
  transition:filter .28s ease}
.tok.live .ob{animation-play-state:running}
.tok.picked{transform:translateY(-3px) scale(1.035)}
.tok.picked .ob{animation-duration:2.4s;filter:drop-shadow(0 13px 9px rgba(21,19,32,.24))}
@keyframes tokSpin{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
.tok .fc{position:absolute;overflow:hidden;backface-visibility:hidden;background:var(--cream2)}
.tok .fc img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s}
.tok .fc img.ok{opacity:1}
.tok .fc svg{display:block;width:100%;height:100%}
.tok .plinth{position:absolute;border-radius:50%;opacity:.72;
  box-shadow:inset 0 2px 2px rgba(255,255,255,.42),0 7px 12px -7px rgba(21,19,32,.48);
  transition:opacity .28s ease,transform .28s cubic-bezier(.2,.9,.25,1),box-shadow .28s ease}
.tok .halo{position:absolute;border-radius:50%;border:2px solid var(--ink);opacity:.38}
.tok .nm{position:absolute;left:0;right:0;bottom:0;height:15px;line-height:15px;font-size:9.5px;font-weight:600;color:var(--mute);
  text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:12px}
.tok:focus-visible .plinth,.tok.picked .plinth{opacity:1}
@media (hover:hover){
  .tok:hover{transform:translateY(-3px) scale(1.025)}
  .tok:hover .ob{animation-duration:9s;filter:drop-shadow(0 13px 9px rgba(21,19,32,.22))}
  .tok:hover .plinth{opacity:.92;transform:scale(1.05);box-shadow:inset 0 2px 2px rgba(255,255,255,.5),0 9px 14px -7px rgba(21,19,32,.52)}
}
@media (prefers-reduced-motion:reduce){
  .tok,.tok .plinth{transition:none}
  .tok .ob{animation:none;transform:rotateY(-14deg);transition:none}
  .tok:hover,.tok.picked{transform:none}
}
.cabempty{text-align:center;padding:30px 0 10px}
/* seasons and episodes. Deliberately quieter than anything else on the page: the show
   is the thing, and this is the thing's shape. A shelf of posters here would make a
   five-season run look like five things you had watched. */
.seas{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sr{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--line);
  border-radius:14px;background:var(--card);cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.sr .n{flex:1;min-width:0;font-family:var(--head);font-weight:800;font-size:14px}
.sr .n small{display:block;font-family:var(--body);font-weight:600;font-size:11.5px;color:var(--mute);margin-top:2px}
.sr .sc{font-family:var(--head);font-weight:900;font-size:15px;flex:none}
.sr .sc.calc{color:var(--mute);font-weight:800}
.sr .caret{flex:none;color:var(--mute);font-size:11px;transition:transform .22s}
.sr[aria-expanded="true"] .caret{transform:rotate(90deg)}
.eps{display:flex;flex-direction:column;margin:2px 0 8px 14px;padding-left:12px;border-left:2px solid var(--line)}
.er{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px}
.er .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.er .t i{font-style:normal;color:var(--mute);font-weight:700;margin-right:6px}
.er.seen .t{color:var(--mute)}
.er .es{background:none;border:0;font-family:var(--head);font-weight:900;font-size:13px;color:var(--mute);cursor:pointer;padding:2px 4px;flex:none}
.er .es.has{color:var(--ink)}
.tick{width:22px;height:22px;border-radius:999px;border:2px solid var(--line);background:none;flex:none;
  cursor:pointer;display:grid;place-items:center;padding:0;transition:background .18s,border-color .18s}
.tick.on{background:var(--mint);border-color:var(--mint)}
.tick svg{width:12px;height:12px;opacity:0;transition:opacity .18s;stroke:var(--onAccent);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tick.on svg{opacity:1}
.po .rm{position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:var(--cream);font-size:18px;line-height:1;padding:0;z-index:4;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px -2px rgba(21,19,32,.5)}
.grid.editing .po{animation:jiggle .34s ease-in-out infinite alternate}
.grid.editing .cell:nth-child(3n+2) .po{animation-duration:.3s}
.grid.editing .cell:nth-child(3n+3) .po{animation-duration:.38s}
.grid.editing .po .tick,.grid.editing .po .tag{display:none}
.grid .cell.dragging{position:relative;z-index:5}
.grid .cell.dragging .po{animation:none;transform:scale(1.07);box-shadow:0 18px 30px -14px rgba(21,19,32,.55)}
@keyframes jiggle{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
@keyframes cellOut{to{transform:scale(.55);opacity:0}}
.cell.going{animation:cellOut .2s cubic-bezier(.4,0,.9,.35) forwards;pointer-events:none}

/* 03 — the medium's colour floods the screen once, then clears */
.wash{position:fixed;inset:0;z-index:11;pointer-events:none;background:var(--k,var(--mint));
  animation:washOver .85s cubic-bezier(.4,.85,.3,1) both}
@keyframes washOver{0%{clip-path:circle(0% at 50% 88%);opacity:.92}
  52%{clip-path:circle(150% at 50% 88%);opacity:.92}100%{clip-path:circle(150% at 50% 88%);opacity:0}}

/* 05 — the cuts tip down into place, like cards set on a table */
.cuts button{transform-origin:50% 100%}
.sheet.on .cuts button{animation:seal .58s cubic-bezier(.25,1.2,.4,1) both}
.sheet.on .cuts button:nth-child(2){animation-delay:.08s}
.sheet.on .cuts button:nth-child(3){animation-delay:.16s}
@keyframes seal{0%{transform:perspective(700px) rotateX(68deg) translateY(-18px);opacity:0}
  62%{transform:perspective(700px) rotateX(-6deg) translateY(0);opacity:1}100%{transform:none;opacity:1}}

/* 06 — a newly added title deals onto the shelf */
@keyframes dealIn{0%{transform:translate(-70px,58px) rotate(-22deg) scale(.82);opacity:0}100%{transform:none;opacity:1}}
.cell.dealt{animation:dealIn .56s cubic-bezier(.2,1.15,.35,1) both}

/* 07 — the check draws itself when something is logged off the shelf */
@keyframes tickThump{0%{transform:scale(.7)}52%{transform:scale(1.2)}100%{transform:none}}
@keyframes tickDraw{0%{width:0;height:0;opacity:0}34%{width:6px;height:0;opacity:1}100%{width:6px;height:11px;opacity:1}}
.po .tick.swept{animation:tickThump .44s cubic-bezier(.3,1.5,.5,1)}
.po .tick.swept:after{animation:tickDraw .4s cubic-bezier(.5,0,.2,1) .06s both}

/* 08 — a dropped tile lands with weight and its neighbours flinch */
@keyframes landed{0%{transform:translateY(-11px) scale(1.11)}56%{transform:scale(.97)}100%{transform:none}}
@keyframes shoved{0%,14%{transform:none}46%{transform:translateX(var(--sh,5px))}100%{transform:none}}
.cell.landed .po{animation:landed .5s cubic-bezier(.3,1.5,.45,1)}
.cell.shoved .po{animation:shoved .45s cubic-bezier(.3,1.3,.45,1)}

/* 10 — an empty shelf fans its four mediums out on arrival */
@keyframes bloom{0%{transform:translateY(16px) rotate(0) scale(.72);opacity:0}
  100%{transform:rotate(var(--r,0deg)) scale(1);opacity:1}}
.tiles .tile{animation:bloom .58s cubic-bezier(.25,1.4,.4,1) both}
.tiles .tile:nth-child(2){animation-delay:.07s}
.tiles .tile:nth-child(3){animation-delay:.14s}
.tiles .tile:nth-child(4){animation-delay:.21s}

/* 12 — the reaction squashes, springs, and throws a halo */
@keyframes heartPop{0%{transform:scale(1)}28%{transform:scale(.82)}62%{transform:scale(1.3)}100%{transform:none}}
@keyframes halo{0%{transform:translate(-50%,-50%) scale(.5);opacity:.4}
  100%{transform:translate(-50%,-50%) scale(2.1);opacity:0}}
[data-like].popped{animation:heartPop .5s cubic-bezier(.3,1.7,.5,1);position:relative}
[data-like].popped:before{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;border-radius:50%;
  background:var(--bad);animation:halo .5s ease-out both;pointer-events:none}

/* 13 — a profile's avatar builds itself piece by piece */
@keyframes asm{0%{transform:scale(0) rotate(-62deg);opacity:0}100%{transform:none;opacity:1}}
/* a face you have not seen this session assembles once, then settles into idling */
.av.new svg > g > *{transform-origin:50% 54%;animation:asm .42s cubic-bezier(.3,1.5,.5,1) both}
.av.new svg > g > *:nth-child(2){animation-delay:.08s}
.av.new svg > g > *:nth-child(3){animation-delay:.15s}
.av.new .eyes{animation:asm .42s cubic-bezier(.3,1.5,.5,1) both, avBlink 6.4s ease-in-out infinite;
  animation-delay:.15s, calc(2.4s + var(--bd,0s))}

/* blinking, on each person's own clock */
.av .eyes{transform-box:fill-box;transform-origin:50% 50%;
  animation:avBlink 6.4s ease-in-out infinite;animation-delay:calc(2s + var(--bd,0s))}
@keyframes avBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}

/* the shape decides the temperament. the idle waits out the card's own arrival first. */
.av:not(#meAv) svg{transform-origin:50% 62%;animation-delay:calc(1.4s + var(--id,0s));
  animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.av:not(#meAv) svg[data-shape="ball"]{animation-name:avBreathe;animation-duration:4.4s}
.av:not(#meAv) svg[data-shape="box"]{animation-name:avNod;animation-duration:5.2s}
.av:not(#meAv) svg[data-shape="cube"]{animation-name:avSettle;animation-duration:6.8s}
.av:not(#meAv) svg[data-shape="can"]{animation-name:avSway;animation-duration:5.6s}
.av:not(#meAv) svg[data-shape="cone"]{animation-name:avTeeter;animation-duration:3.9s}
.av:not(#meAv) svg[data-shape="pill"]{animation-name:avBob;animation-duration:4.1s}
.av:not(#meAv) svg[data-shape="arch"]{animation-name:avSway;animation-duration:7.4s}
.av:not(#meAv) svg[data-shape="step"]{animation-name:avShift;animation-duration:6.1s;animation-timing-function:steps(2,end)}
@keyframes avBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes avNod{0%,100%{transform:translateY(0)}50%{transform:translateY(4%)}}
@keyframes avSettle{0%,100%{transform:rotate(0)}40%{transform:rotate(2deg)}72%{transform:rotate(-1.4deg)}}
@keyframes avSway{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
@keyframes avTeeter{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes avBob{0%,100%{transform:translateY(0)}42%{transform:translateY(-6%)}68%{transform:translateY(2%)}}
@keyframes avShift{0%,48%{transform:translateX(-2%)}52%,100%{transform:translateX(2%)}}
/* the eyes keep their own pace per shape too */
.av svg[data-shape="cone"] .eyes{animation-duration:4.2s}
.av svg[data-shape="ball"] .eyes{animation-duration:5.1s}
.av svg[data-shape="cube"] .eyes{animation-duration:8.3s}
.av svg[data-shape="step"] .eyes{animation-duration:9.1s}

.sheet.on .av.meet svg > g > *,.sheet.on .av.big svg > g > *{transform-origin:50% 54%;
  animation:asm .46s cubic-bezier(.3,1.5,.5,1) both}
.sheet.on .av.meet svg > g > *:nth-child(2),.sheet.on .av.big svg > g > *:nth-child(2){animation-delay:.1s}
.sheet.on .av.meet svg > g > *:nth-child(3),.sheet.on .av.big svg > g > *:nth-child(3){animation-delay:.18s}

/* 14 — the line between old and new draws outward from its label */
@keyframes sweepIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes labelUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.newline{animation:labelUp .4s cubic-bezier(.3,1.4,.5,1) .14s both}
.newline:before{transform-origin:right;animation:sweepIn .5s cubic-bezier(.3,.9,.3,1) both}
.newline:after{transform-origin:left;animation:sweepIn .5s cubic-bezier(.3,.9,.3,1) both}

/* 16 — scores roll into place a digit at a time */
.trio b.odo,b.odo,.odo{--oh:1.25em;display:inline-flex;align-items:flex-start;line-height:var(--oh)}
/* the reels are spans inside .trio, where `.trio span` is the small caps label style */
.odo .reel,.odo .fix,.odo .strip{font:inherit;letter-spacing:inherit;text-transform:none;color:inherit;margin:0}
.odo .reel{height:var(--oh);overflow:hidden;display:inline-block}
.odo .reel .strip{display:block;transition:transform .8s cubic-bezier(.22,.9,.24,1)}
.odo .reel .strip b{display:flex;align-items:center;justify-content:center;height:var(--oh);line-height:1;
  font-weight:inherit;font-variant-numeric:tabular-nums}
.odo .fix{display:flex;align-items:center;height:var(--oh);line-height:1}

/* 17 — agreement sweeps around an arc rather than sitting flat */
.trio > div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:76px}
.trio .gauge{position:relative;display:grid;place-items:center;width:58px;height:58px;margin:0}
.trio .agree .ring{position:absolute;inset:0;width:58px;height:58px;transform:rotate(-90deg)}
.trio .agree .ring circle{fill:none;stroke-width:4.5;stroke-linecap:round}
.trio .agree .ring .track{stroke:var(--cream2)}
.trio .agree .ring .val{stroke:var(--good);stroke-dasharray:113;stroke-dashoffset:113;
  transition:stroke-dashoffset 1s cubic-bezier(.2,.9,.25,1)}
.trio .agree.low .ring .val{stroke:var(--bad)}
.trio .agree b{position:relative;z-index:2;font-size:19px;color:var(--ink)}

/* 18 — your ten grow in rank order */
.bar:nth-child(2) .tr i{animation-delay:.07s}
.bar:nth-child(3) .tr i{animation-delay:.14s}
.bar:nth-child(4) .tr i{animation-delay:.21s}
.bar:nth-child(5) .tr i{animation-delay:.28s}
.bar:nth-child(n+6) .tr i{animation-delay:.35s}

/* 19 — the active pill travels between tabs */
nav .in{position:relative}
.navpill{position:absolute;top:9px;bottom:9px;border-radius:99px;background:var(--ink);z-index:0;
  left:0;width:0;opacity:0;transition:left .34s cubic-bezier(.3,1.25,.4,1),width .34s cubic-bezier(.3,1.25,.4,1)}
.navpill.set{opacity:1}
nav button{z-index:1}
nav .in:has(.navpill.set) button.on{background:none}
@media (prefers-reduced-motion:reduce){.grid.editing .po{animation:none;outline:2px dashed var(--ink);outline-offset:2px}}
.po .soon-tag{position:absolute;bottom:6px;left:6px;right:6px;z-index:2;background:var(--veil);color:var(--ink);
  font-family:var(--head);font-weight:800;font-size:10px;letter-spacing:.03em;text-transform:uppercase;padding:4px 6px;border-radius:8px;text-align:center}
.shelfbar{display:flex;gap:8px;align-items:center;margin-top:12px}
.shelfbar .btn{width:auto;flex:1;padding:12px 16px;font-size:15px}
.cap{font-size:11px;font-weight:600;color:var(--mute);margin-top:5px;display:flex;justify-content:space-between}

/* bars */
.bar{display:grid;grid-template-columns:104px 1fr 38px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bar:last-child{border-bottom:0}
.bar .n{font-weight:700;font-size:13px}
.bar .tr{height:11px;border-radius:99px;background:var(--cream2);overflow:hidden;display:flex;gap:2px}
.bar .tr i{display:block;height:100%}
.bar .p{font-weight:800;font-size:12px;color:var(--mute);text-align:right}
.say{font-family:var(--head);font-weight:900;font-size:24px;letter-spacing:-.03em;line-height:1.1;margin:10px 0 6px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 0 12px;border-bottom:2px solid var(--line)}
.trio b{font-family:var(--head);font-weight:900;font-size:30px;letter-spacing:-.04em;display:block;line-height:1}
.trio span{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);display:block;margin-top:4px}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.four .po{border-radius:10px;padding:6px}
.four .po b{font-size:10px}
.tally{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;font-weight:700;color:var(--mute)}
.tally b{color:var(--ink);font-family:var(--head);font-weight:900;font-size:15px;margin-right:3px}

/* rating */
.rate{display:flex;gap:6px;padding:8px 0 2px;touch-action:manipulation}
.rate button{width:44px;height:44px;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;transition:transform .12s}
.rate button svg{width:44px;height:44px;display:block;pointer-events:none}
.rate button.holding{transform:scale(1.15)}
.hint{font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;margin-top:6px}
.ticks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tk{font-family:var(--body);font-weight:700;font-size:12.5px;border:2px solid var(--line);background:var(--card);padding:7px 11px;border-radius:999px;cursor:pointer}
.tk.on{background:var(--butter);border-color:var(--butter)}
.custom{display:flex;gap:8px;align-items:center;margin-top:10px}
.custom button{flex:none;font-family:var(--head);font-weight:800;font-size:13px;background:var(--cream2);border:0;border-radius:999px;padding:12px 16px;cursor:pointer}
.tagrow{display:flex;justify-content:space-between;align-items:baseline}
.tagrow .cnt{font-size:11px;font-weight:700;color:var(--mute)}

/* clubs */
.club{background:var(--card);border-radius:20px;padding:16px;margin-top:12px;cursor:pointer;box-shadow:0 14px 34px -26px rgba(21,19,32,.3)}
.club .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.club b{font-family:var(--head);font-weight:900;font-size:19px;letter-spacing:-.02em;display:block;margin-top:8px}
.club .tr{height:8px;border-radius:99px;background:var(--cream2);margin-top:10px;overflow:hidden}
.club .tr i{display:block;height:100%;background:var(--ink);border-radius:99px}
.club .pr{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--mute);margin-top:8px}
.club .who{display:flex;gap:-6px;align-items:center;margin-top:10px}
.club .who .av{width:26px;height:26px;margin-right:-6px}
.club .who span.more{font-size:11.5px;font-weight:700;color:var(--mute);margin-left:12px}
.club.open{border:2px solid var(--lilac)}
.deadline{font-family:var(--head);font-weight:900;font-size:13px}
.deadline.soon{color:var(--bad)}
.deadline.done{color:var(--good)}
/* seasons — the public programme has a different job from a friends' club.  It is a
   short-lived event with flexible progress, so the little objects belong to the things
   that counted as well as to the season itself. */
.season-hero{background:#24162D;color:#FFF7EC;border-radius:24px;padding:20px;margin-top:12px;overflow:hidden;position:relative}
.season-hero:after{content:'◉ ◉';position:absolute;right:14px;top:2px;font-family:var(--head);font-size:76px;letter-spacing:-22px;color:#FFB36B;opacity:.24;line-height:1;transform:rotate(-8deg)}
.season-hero>*{position:relative;z-index:1}.season-hero .tag{background:var(--apricot);color:var(--onAccent)}
.season-hero h3{font-family:var(--head);font-size:28px;line-height:.95;letter-spacing:-.04em;margin-top:10px;max-width:260px}
.season-hero p{font-size:13px;font-weight:650;line-height:1.4;color:#E7D8ED;margin-top:9px;max-width:290px}
.season-challenge{background:var(--card);border-radius:20px;padding:16px;margin-top:12px;display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;box-shadow:0 14px 34px -26px rgba(21,19,32,.3)}
.season-object,.season-stamp{display:grid;place-items:center;font-family:var(--head);font-weight:900;color:var(--onAccent);background:var(--cream2);border:2px solid var(--line)}
.season-object{width:48px;height:48px;border-radius:16px;font-size:22px}.season-object.film{background:var(--apricot)}.season-object.tv{background:var(--pink)}.season-object.book{background:var(--butter)}.season-object.game{background:var(--mint)}
.season-challenge h3{font-family:var(--head);font-size:17px;letter-spacing:-.02em}.season-challenge p{font-size:12px;font-weight:650;color:var(--mute);margin-top:3px}
.season-progress{height:8px;background:var(--cream2);border-radius:99px;overflow:hidden;margin-top:10px}.season-progress i{display:block;height:100%;background:var(--ink);border-radius:inherit;transition:width .55s cubic-bezier(.2,.9,.25,1)}
.season-tier{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:11px;font-weight:800;color:var(--mute)}.season-tier b{color:var(--ink)}
.season-haul{display:flex;gap:7px;margin-top:10px}.season-haul span{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--cream2);border:1px solid var(--line);font-size:13px;filter:grayscale(1);opacity:.42}.season-haul span.on{filter:none;opacity:1}.season-haul span.bronze{background:#F1B37A}.season-haul span.silver{background:#D6D7DD}.season-haul span.gold{background:#FFE86A}.season-haul span.platinum{background:#D5C4FF}
.season-picks{background:var(--cream2);border-radius:20px;padding:16px;margin-top:12px}.season-picks .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.season-picks .row{cursor:pointer}.season-picks .row:hover{transform:translateX(2px)}.season-picks button.row{width:100%;border:0;background:transparent;text-align:left;font:inherit;padding-left:0;padding-right:0}
.taste-hero{background:var(--ink);color:var(--cream);border-radius:24px;padding:19px 20px;margin-top:10px;position:relative;overflow:hidden}.taste-hero:after{content:"◒  ◉";position:absolute;right:18px;top:8px;color:var(--butter);font-family:var(--head);font-size:54px;opacity:.22;transform:rotate(10deg)}.taste-hero>*{position:relative;z-index:1}.taste-hero h2{font-size:25px;letter-spacing:-.04em}.taste-hero p{color:#C9C4D4;font-size:13px;font-weight:650;line-height:1.42;margin-top:6px;max-width:280px}.taste-hero .tag{background:var(--butter);color:var(--onAccent);margin-top:11px}
.season-rank{background:var(--mint);border-radius:18px;padding:14px 16px;margin-top:12px;font-size:13px;font-weight:700;line-height:1.4}.season-rank b{font-family:var(--head);font-size:16px}
.season-cover{position:relative;width:44px;height:64px;display:block;flex:none}.season-cover>img,.season-cover>.co{width:44px!important;height:64px!important}.season-stamp{position:absolute;right:-7px;top:-7px;width:22px;height:22px;border-radius:8px;font-size:11px;box-shadow:0 2px 0 rgba(21,19,32,.18);z-index:2}.season-stamp.bronze{background:#F1B37A}.season-stamp.silver{background:#D6D7DD}.season-stamp.gold{background:#FFE86A}.season-stamp.platinum{background:#D5C4FF}
.pal{background:var(--ink);color:var(--cream);border-radius:22px;padding:18px;margin-top:12px}
.pal .h{display:flex;justify-content:space-between;align-items:center;font-family:var(--head);font-weight:900;font-size:17px;
  padding-bottom:12px;border-bottom:2px solid #3A3650;margin-bottom:4px}
.pal .row{border-color:#3A3650}
.pal .row .t small{color:#A9A3BC}
.pal .win{font-family:var(--head);font-weight:900;font-size:26px;letter-spacing:-.03em;line-height:1.05;margin:10px 0 2px}
.pal .win span{color:var(--butter)}
.ballot .row{cursor:pointer}
.ballot .pick{width:26px;height:26px;border-radius:99px;border:2px solid var(--line);display:grid;place-items:center;
  font-family:var(--head);font-weight:900;font-size:12px;flex:none}
.ballot .pick.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.sealed{background:var(--ink);color:var(--cream);border-radius:22px;padding:22px;margin-top:12px;text-align:center}
.sealed .ic{width:54px;height:54px;border-radius:18px;background:#3A3650;display:grid;place-items:center;margin:0 auto 12px;
  font-family:var(--head);font-weight:900;font-size:20px;color:var(--butter)}
.sealed h3{font-size:19px}
.sealed p{color:#A9A3BC;font-size:14px;margin-top:6px;line-height:1.5}
.sealed .count{font-family:var(--head);font-weight:900;font-size:40px;letter-spacing:-.04em;margin-top:14px;display:block}
.sealed .count small{display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#A9A3BC;margin-top:4px}
.sealed .stack{margin-top:16px}
.cuts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.cuts button{background:none;border:2px solid var(--line);border-radius:16px;padding:6px;cursor:pointer;overflow:hidden}
.cuts button.on{border-color:var(--ink)}
.cuts canvas{width:100%;height:auto;display:block;border-radius:10px}
.cuts b{display:block;font-family:var(--head);font-weight:800;font-size:11px;margin-top:6px;color:var(--mute)}
.cuts button.on b{color:var(--ink)}
.avgs{display:flex;gap:14px;flex:none;text-align:right}
.avgs div{min-width:44px}
.avgs b{font-family:var(--head);font-weight:900;font-size:19px;letter-spacing:-.03em;display:block;line-height:1}
.avgs span{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);display:block;margin-top:3px}
.avgs .club b{color:var(--ink)}
.avgs .all b{color:var(--mute)}
.drift{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;margin-top:5px}
.drift.up{background:var(--mint)}.drift.down{background:var(--pink)}.drift.same{background:var(--cream2);color:var(--mute)}
.verdict{background:var(--butter);border-radius:18px;padding:14px 16px;margin-top:12px;font-weight:600;font-size:14.5px;line-height:1.45}
.verdict b{font-family:var(--head);font-weight:900}

/* wheel */
/* ---------- the reel ----------
   It was a wheel with names printed round the rim: fat cream spokes, a black triangle,
   every title outlined and half of them upside down. All of that is fairground. This is
   the same act of chance done as a reel — posters upright at their own shape, sliding
   under a fixed mark — so nothing rotates, nothing is inverted, nothing needs an outline
   to survive its own background, and the title is set once, in one place, at any count. */
.wheelwrap{position:relative;width:100%;margin:14px auto 0}
.pointer{position:absolute;top:-6px;bottom:-6px;left:50%;width:2px;transform:translateX(-50%);
  background:linear-gradient(180deg,var(--ink) 0 14px,transparent 14px calc(100% - 14px),var(--ink) calc(100% - 14px) 100%);
  z-index:3;pointer-events:none}
#wheel{position:relative;overflow:hidden;padding:10px 0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
#wheelG{display:flex;gap:var(--rgap);will-change:transform;
  transition:transform 4.4s cubic-bezier(.12,.74,.06,1)}
#wheelG.jump{transition:none}
.rc{position:relative;flex:none;width:var(--rw);height:var(--rh);border-radius:8px;overflow:hidden;
  background:var(--cream2);box-shadow:0 0 0 1px rgba(21,19,32,.14) inset;
  opacity:.4;transform:scale(.88);transform-origin:center bottom;
  transition:opacity .22s ease,transform .22s ease}
.rc img{width:100%;height:100%;object-fit:cover;display:block}
.rc.on{opacity:1;transform:scale(1);box-shadow:0 0 0 1.5px rgba(21,19,32,.55) inset,0 6px 16px -8px rgba(21,19,32,.5)}
.rc i{position:absolute;inset:auto 0 0 0;padding:6px 5px;font-style:normal;font-family:var(--head);
  font-weight:800;font-size:9.5px;line-height:1.15;color:var(--cream);text-align:center;
  background:linear-gradient(180deg,transparent,rgba(21,19,32,.82));overflow:hidden;max-height:2.4em}
.reelnow{text-align:center;margin-top:16px;min-height:44px}
.reelnow b{display:block;font-family:var(--head);font-weight:900;font-size:20px;letter-spacing:-.02em;
  line-height:1.15}
.reelnow small{color:var(--mute);font-size:12.5px;font-weight:600}
.result{margin-top:14px;background:var(--butter);border-radius:20px;padding:16px}
.result small{font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.result b{font-family:var(--head);font-weight:900;font-size:24px;letter-spacing:-.03em;display:block;margin-top:4px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--veil);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);display:none}
nav.on{display:block}
nav .in{max-width:560px;margin:0 auto;padding:9px 12px 9px;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;gap:4px;align-items:center}
nav{overflow:visible}
nav button{background:none;border:0;padding:12px 4px;border-radius:99px;font-family:var(--head);font-weight:800;font-size:13px;
  letter-spacing:-.01em;color:var(--mute);cursor:pointer;white-space:nowrap;transition:background .18s,color .18s,transform .14s}
nav button i{display:none}
nav button.on{background:var(--ink);color:var(--cream)}
@keyframes tabPop{0%{transform:scale(.92)}55%{transform:scale(1.05)}100%{transform:scale(1)}}
nav button:active{transform:scale(.95)}
#add{grid-column:3;justify-self:center;margin-top:-24px;z-index:2;
  width:58px;height:58px;padding:0;border-radius:50%;border:3px solid var(--cream);background:var(--ink);color:var(--cream);cursor:pointer;display:none;
  box-shadow:0 10px 22px -10px rgba(21,19,32,.55);transition:transform .16s cubic-bezier(.3,1.4,.5,1)}
#add.live{display:grid;place-items:center}
#add:active{transform:scale(.93)}
#add svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
#add.busy{animation:pop .32s cubic-bezier(.3,1.4,.5,1)}

/* what you're in the middle of, in the room and on your own shelf */
.nowcard input{width:100%;margin-top:10px}
.nowrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.nowpill{display:inline-flex;align-items:center;gap:7px;background:var(--cream2);
  border-radius:99px;padding:5px 12px 5px 6px;font-size:12.5px;max-width:100%}
.nowpill .av{width:22px;height:22px;flex:none}
.nowpill b{font-family:var(--head);font-weight:800}
.nowpill span{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* the adaptive review: prose, so it is set like prose and not like another stat.
   Its own name — `.verdict` was taken by the butter callout above. */
.sumup{margin:14px 0 2px;font-size:15.5px;line-height:1.5;font-weight:400;color:var(--ink);
  background:none;padding:2px 0 2px 13px;border-left:3px solid var(--line)}
.sumup b{font-family:var(--head);font-weight:800;font-variant-numeric:tabular-nums}

/* your own history with a thing, set apart from the room's view of it */
.sumup.mine{border-left-color:var(--sky)}
.dkname .waited{color:var(--bad);font-weight:700}
.chip.up{background:var(--mint);color:var(--ink)}
.chip.down{background:var(--cream2);color:var(--mute)}

/* card skins: the swatch is the label, the name is the caption */
.skins{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.skins button{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:5px;width:62px;font-family:var(--head)}
.skins .sw{width:46px;height:58px;border-radius:12px;display:block;
  outline:2px solid transparent;outline-offset:2px;transition:outline-color .16s,transform .16s}
.skins button.on .sw{outline-color:var(--ink)}
.skins button:active .sw{transform:scale(.94)}
.skins b{font-size:11px;font-weight:800;color:var(--mute)}
.skins button.on b{color:var(--ink)}
.skins i{font-style:normal;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink);background:var(--butter);border-radius:99px;padding:1px 6px;margin-top:-2px}
.skins button:focus-visible .sw{outline-color:var(--blue)}
.skinnote{margin-top:8px;font-size:12.5px}

/* sheets */
.sheet{position:fixed;inset:0;background:rgba(21,19,32,.45);display:none;align-items:flex-end;z-index:10}
/* Above the sheet rather than instead of it. There is one sheet and no stack, so asking
   a question by opening another one would throw away whatever was being filled in —
   which is exactly what happens when you ask "who with?" halfway through an entry. */
.bigcode{font-family:var(--head);font-weight:900;font-size:40px;letter-spacing:.16em;
  line-height:1.1;padding:6px 0 2px;user-select:all;-webkit-user-select:all}

    out += why(`, and $ ${isAre} what its admirers point to.`, `, and it's $ its admirers point to.`);
  } else if (k === "mixed") {
    out = settled
      ? one([`Solid rather than special. ${Cap(B(said(n)))} people put it at ${B(a1)} and few of them argue`,
             `Perfectly fine, and nobody pretends otherwise — ${B(a1)} across ${B(said(n))} people`])
      : one([`Hard to pin down. The ${B(a1)} sits in the middle because opinions are scattered, not because anyone agrees`,
             `${B(a1)}, but that average is doing a lot of work — the range behind it is wide`]);
    out += why(`, with $ the part that gets mentioned.`, `, though it's $ people mention.`);
  } else {
    out = settled
      ? one([`There's broad agreement this one doesn't work: ${B(a1)} from ${B(said(n))} people`,
             `${Cap(B(said(n)))} people, and they're of one mind about it — ${B(a1)}`])
      : one([`It scores badly at ${B(a1)}, and even that isn't settled`,
             `${B(a1)}, and the people who dislike it don't dislike it for the same reasons`]);
    out += who ? `. ${Cap(B(nm(who[0])))} is the name that keeps coming up anyway.`
      : craft.length ? `. ${Cap(join(craft))} ${isAre} the one thing anybody still credits.` : `.`;
  }

  if (yours != null && n > 1) {
    const top1 = Math.max(...people), bot = Math.min(...people);
    const alone = v => people.filter(x => x === v).length === 1;
    if (yours === top1 && top1 > bot && alone(top1)) out += ` You rate it higher than anyone else who's logged it.`;
    else if (yours === bot && top1 > bot && alone(bot)) out += ` Nobody's been harder on it than you.`;
    else if (Math.abs(yours / 2 - avg) >= 1) out += yours / 2 > avg
      ? ` You liked it considerably more than most.` : ` You thought a good deal less of it than most.`;
  }
  return out; }

/* ---------- ordering entries on a work page ----------
   never ranks people, only posts. popular = who nodded; momentum = who nodded lately;
   like you = whoever singled out what you tend to single out. */
/* A feed is a list of things people just did, so newest means most recently posted —
   not most recently watched. Somebody catching up on a film from 2011 has done
   something now, and burying it under an entry logged last week because that film is
   newer gets the feed backwards.
   rated_on breaks the tie, and the id breaks that, so the order is total: two entries
   written in the same second must not swap places between one render and the next. */
const newestFirst = (a, b) =>
  String(b.created_at || "").localeCompare(String(a.created_at || ""))
  || String(b.rated_on || "").localeCompare(String(a.rated_on || ""))
  || String(b.id || "").localeCompare(String(a.id || ""));
const SORTS = { popular:"Popular", momentum:"Momentum", similar:"Like you", recent:"Recent" };
const daysAgo = d => Math.max(0, (Date.now() - new Date(d + "T12:00:00Z")) / 864e5);
function sortEntries(es, how, myTaste) {
  const sames = e => (e.reactions||[]).length;
  const said = e => (e.note ? 2 : 0) + Math.min(2, (e.loved||[]).length ? 1 : 0);
  const weight = {}; (myTaste?.craft || []).forEach(([k,v],i) => weight[k] = v.total);
  const maxW = Math.max(1e-6, ...Object.values(weight));
  const like = e => { const ls = (e.loved||[]).filter(k => !k.startsWith("person:")); if (!ls.length) return 0;
    return ls.reduce((a,k) => a + (weight[k]||0)/maxW, 0) / Math.sqrt(ls.length); };
  const by = {
    popular: e => sames(e)*3 + said(e),
    momentum: e => (sames(e)*3 + said(e) + 1) / Math.pow(daysAgo(e.rated_on) + 2, .7),
    similar: e => like(e)*6 + sames(e)*.5 + said(e)*.25,
    /* was -daysAgo(e.rated_on), which made this the only list in the app where
       "recent" meant recently watched rather than recently posted */
    recent: () => 0
  }[how] || (() => 0);
  return es.slice().sort((a,b) => by(b) - by(a) || newestFirst(a, b));
}

/* ---------- reveal cards as they scroll in ---------- */
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
/* whatever is actually scrolling — the window, or a frame that wraps us */
function scroller() {
  let el = document.scrollingElement || document.documentElement;
  if (el.scrollHeight > el.clientHeight + 4) return null;   // window scrolls: observer default root
  for (let n = document.body; n; n = n.parentElement) { const st = getComputedStyle(n);
    if (/(auto|scroll)/.test(st.overflowY) && n.scrollHeight > n.clientHeight + 4) return n; }
  return null;
}
let revealObs = null, revealRoot = undefined, watching = new Set();
function makeObs() { const root = scroller();
  if (revealObs && revealRoot === root) return revealObs;
  revealRoot = root; if (revealObs) revealObs.disconnect();
  revealObs = new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting) { e.target.classList.add("in"); revealObs.unobserve(e.target); watching.delete(e.target); } },
    { root, rootMargin: "0px 0px -12% 0px", threshold: .02 });
  watching.forEach(el => revealObs.observe(el)); return revealObs; }
/* a plain scroll fallback, in case the observer's root guess is wrong (frames, embeds) */
function sweep() { if (!watching.size) return;
  const box = revealRoot ? revealRoot.getBoundingClientRect() : { top:0, bottom:window.innerHeight, height:window.innerHeight };
  const line = box.top + box.height * .88;                     /* fires as the card reaches the lower edge, in view */
  for (const el of [...watching]) { const b = el.getBoundingClientRect();
    if (b.top < line && b.bottom > box.top) { el.classList.add("in"); revealObs?.unobserve(el); watching.delete(el); } } }
addEventListener("scroll", sweep, { passive:true, capture:true });
addEventListener("resize", () => { makeObs(); sweep(); });
/* embedded in a frame we can't hear scroll from: poll cheaply while anything is still hidden,
   and never leave a card invisible for more than a few seconds */
let sweepTimer = null;
function keepSweeping() { if (sweepTimer) return;
  sweepTimer = setInterval(() => { if (!watching.size) { clearInterval(sweepTimer); sweepTimer = null; return; } sweep(); }, 250); }
function revealIn(root) {
  if (!root || REDUCED) return; const obs = makeObs();
  const rbox = revealRoot ? revealRoot.getBoundingClientRect() : { top:0, bottom:window.innerHeight, height:window.innerHeight };
  const fold = rbox.top + rbox.height * .88;
  $$(":scope > .slip, :scope > .card, :scope > .club, :scope > .twin", root).forEach((el, i) => {
    if (el.dataset.revealed) return; el.dataset.revealed = "1"; el.classList.add("reveal");
    if (el.getBoundingClientRect().top < fold) setTimeout(() => el.classList.add("in"), Math.min(i, 6) * 45);
    else { watching.add(el); obs.observe(el); }
  });
  setTimeout(sweep, 60); keepSweeping();
  setTimeout(() => { for (const el of [...watching]) { el.classList.add("in"); revealObs?.unobserve(el); watching.delete(el); } }, 6000);
}

/* ---------- an invite you can tap ----------
   the code still works, but a link is what people actually send each other. The code
   is held through sign-up, because a new person has to make an account before there
   is anyone to put in a room. */
const INVITE_KEY = "rooms.invite";
function takeInvite() {                       /* read it off the URL once, then tidy up */
  const m = /[#?&]join=([A-Za-z0-9]{4,12})/.exec(location.hash + location.search);
  if (m) { try { localStorage.setItem(INVITE_KEY, m[1].toUpperCase()); } catch {}
    history.replaceState(null, "", location.pathname + location.search.replace(/[?&]join=[^&]*/, "")); }
  try { return localStorage.getItem(INVITE_KEY); } catch { return null; }
}
const dropInvite = () => { try { localStorage.removeItem(INVITE_KEY); } catch {} };
const inviteLink = code => `${location.origin}${location.pathname}#join=${code}`;
/* called once you are through the door, whether that took ten seconds or a sign-up */
async function useInvite() {
  const code = takeInvite(); if (!code || sb.__local) return false;
  if (rooms.some(r => r.code === code)) { dropInvite(); return false; }
  try {
    if (rooms.length >= ROOM_LIMIT) throw new Error("Leave a room to join another. You can be in up to three rooms.");
    const r = await q(sb.rpc("join_room", { p_code:code }));
    dropInvite(); await loadRooms();
    if (r?.id) { P.activeRoom = r.id; P.feed = "room"; P.feedPicked = true; saveP(); }
    await loadClubs();
    say(`You're in ${rooms.find(x => x.id === r?.id)?.name || "the room"}`, "good");
    return true;
  } catch (e) { dropInvite(); oops(e, "That invite didn't work"); return false; }
}

/* ---------- the day moves through it ----------
   one clock, six grounds. Re-checked every ten minutes and whenever the tab
   comes back, so a phone left open overnight is not still showing the morning. */
const DAY_BANDS = [[5,"early"],[7,"morning"],[12,"afternoon"],[17,"evening"],[20,"late"],[23,"night"]];
function paintDay() {
  const h = new Date().getHours();
  let band = "night"; for (const [from, name] of DAY_BANDS) if (h >= from) band = name;
  if (document.documentElement.dataset.day !== band) document.documentElement.dataset.day = band;
}
/* the header was the same height at the top and four hundred entries down. One step, at
   24px, gives the feed twenty pixels back and says you have left the top without a
   scrollbar — a continuous shrink would just be something moving while you read. */
(() => { const h = $("header"); if (!h) return;
  let tight = false;
  addEventListener("scroll", () => { const want = window.scrollY > 24;
    if (want !== tight) { tight = want; h.classList.toggle("tight", want); movePill(true); } },
    { passive:true }); })();
paintDay(); setInterval(paintDay, 6e5);
document.addEventListener("visibilitychange", () => { if (!document.hidden) paintDay(); });

let feedTurn = 0;
/* what each club's bar was at the last time you looked, so it has somewhere to travel from */
const clubWas = {}, clubDone = {};
/* how many were in each room the last time you drew it */
const roomSeen = {};
let booting = false;
/* ---------- the four small tools the ten moments share ----------
   A number that changes in place, a row that is dealt rather than dropped, a thing that
   flies to where it has gone, and a thing that leaves rather than vanishing. */
function tickTo(el, to, suffix = "") {
  if (!el) return;
  const from = parseFloat(String(el.textContent).replace(/[^\d.-]/g, "")) || 0;
  if (REDUCED || from === to) { el.textContent = to + suffix; return; }
  el.classList.add("ticking");
  const t0 = performance.now(), ms = 700;
  const step = t => { const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * e) + suffix;
    if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step); }

/* 70ms apart: far enough to read as four things, close enough that the fourth is not a wait */
function dealIn(rows, gap = 70) {
  if (REDUCED) return;
  rows.forEach((r, i) => { r.style.animationDelay = (i * gap) + "ms"; r.classList.add("dealt-in"); }); }

/* the cover leaves the row it was in and lands on the tab that now holds it, so you learn
   where the thing went rather than being told */
function flyTo(fromEl, toEl, src) {
  if (REDUCED || !fromEl || !toEl) return;
  const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
  if (!a.width || !b.width) return;
  const f = document.createElement("div"); f.className = "flyer";
  f.style.cssText += `left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px`;
  if (src) f.innerHTML = `<img src="${esc(src)}" alt="">`;
  document.body.appendChild(f);
  const dx = b.left + b.width/2 - a.left - a.width/2, dy = b.top + b.height/2 - a.top - a.height/2;
  const anim = f.animate([{ transform:"none", opacity:1 },
    { transform:`translate(${dx}px,${dy}px) scale(.26)`, opacity:0 }],
    { duration:520, easing:"cubic-bezier(.6,0,.35,1)" });
  anim.onfinish = () => { f.remove();
    toEl.animate([{transform:"none"},{transform:"translateY(-4px) scale(1.06)"},{transform:"none"}],
      { duration:340, easing:"cubic-bezier(.3,1.5,.5,1)" }); }; }

/* height has to be pinned before it can be animated to nothing */
function leaveOut(el, after) {
  if (!el) { after?.(); return; }
  if (REDUCED) { el.remove(); after?.(); return; }
  el.style.height = el.offsetHeight + "px";
  el.classList.add("leaving");
  setTimeout(() => { el.remove(); after?.(); }, 520); }

/* ---------- lights on, lights off ----------
   The inline script in the head has already set this before first paint. This is what
   changes it afterwards, and the one thing the head script cannot do: keep following
   the phone while you leave it on Auto. */
const DARK_Q = matchMedia("(prefers-color-scheme: dark)");
const themeNow = () => P.theme === "light" || P.theme === "dark" ? P.theme : (DARK_Q.matches ? "dark" : "light");
function paintTheme(animate) { const t = themeNow();
  if (document.documentElement.dataset.theme === t) { paintThemeColour(); return; }
  /* a wipe, not a flip. View transitions do it properly where they exist; everywhere else a
     veil of the incoming ground sweeps across and the swap happens underneath it. */
  if (animate && !REDUCED && document.startViewTransition) {
    document.startViewTransition(() => { document.documentElement.dataset.theme = t; paintThemeColour(); });
    return; }
  if (animate && !REDUCED) {
    const veil = document.createElement("div"); veil.className = "themeveil";
    document.documentElement.dataset.theme = t;
    document.body.appendChild(veil);
    setTimeout(() => veil.remove(), 640); paintThemeColour(); return; }
  document.documentElement.dataset.theme = t; paintThemeColour(); }
function paintThemeColour() {
  /* the phone paints the status bar and the URL bar from this, and a cream strip above
     a dark app is the tell that a theme was bolted on */
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) { const c = getComputedStyle(document.documentElement).getPropertyValue("--cream").trim();
    if (c) m.content = c; } }
paintTheme();
DARK_Q.addEventListener?.("change", () => { if (!P.theme) paintTheme(true); });
/* the ground colour moves with the hour, so the status bar has to be repainted with it */
const paintDayAndTheme = () => { paintDay(); paintTheme(); };
setInterval(paintDayAndTheme, 6e5);

/* ---------- who is in the room, and what lands while you are looking ----------
   one channel per room carries both: presence for the faces, postgres_changes for
   the entries. Opened when the room feed renders, closed when you leave it. */
let roomCh = null, roomChId = null, hereNow = [];
let nowPaintT = null;
function leaveRoomChannel() { if (roomCh) { try { sb.removeChannel(roomCh); } catch {} }
  clearTimeout(nowPaintT); roomCh = null; roomChId = null; hereNow = []; }
function paintHere() {
  const el = $("#hereRow"); if (!el) return;
  const others = hereNow.filter(p => p.id !== me.id);
  const seen = new Set([...el.querySelectorAll(".face")].map(f => f.dataset.who));
  /* somebody leaving used to be the same redraw as somebody arriving. It fades out where
     an arrival pops in, so you can tell which happened without looking straight at it. */
  if (!REDUCED && seen.size) {
    const here = new Set(others.map(p => p.id));
    [...el.querySelectorAll(".face")].forEach(f => {
      if (here.has(f.dataset.who)) return;
      const ghost = f.cloneNode(true); ghost.classList.add("went");
      ghost.style.position = "absolute"; ghost.style.pointerEvents = "none";
      f.after(ghost); setTimeout(() => ghost.remove(), 300); }); }
  el.innerHTML = others.length
    ? `<span class="dot"></span><span class="faces">${others.map(p =>
        `<span class="face${seen.size && !seen.has(p.id) ? " came" : ""}" data-who="${esc(p.id)}"
          data-prof="${esc(p.id)}" style="cursor:pointer" title="${esc(p.handle)}">${avatar(p)}</span>`).join("")}</span>
       <small>${others.length === 1 ? esc(others[0].handle) + " is in here now" : others.length + " in here now"}</small>`
    : `<small>Nobody else in here right now</small>`;
  $$("[data-prof]", el).forEach(x => x.onclick = () => openProfile(x.dataset.prof));
}
function joinRoomChannel(R) {
  if (sb.__demo) {                                      /* no sockets, but show the room breathing */
    hereNow = R.members.filter(m => m.id !== me.id).slice(0, 2)
      .map(p => ({ id:p.id, handle:p.handle, avatar:p.avatar }));
    paintHere(); return; }
  if (!R || sb.__local || !sb.channel) return;          /* local mode has no sockets */
  if (roomChId === R.id && roomCh) { paintHere(); return; }
  leaveRoomChannel(); roomChId = R.id;
  const memberIds = new Set(R.members.map(m => m.id));
  const ch = sb.channel(`room:${R.id}`, { config: { presence: { key: me.id } } });
  ch.on("presence", { event: "sync" }, () => {
    const st = ch.presenceState(); const out = [];
    for (const k in st) { const m = st[k][0]; if (m) out.push({ id: m.id || k, handle: m.handle, avatar: m.avatar }); }
    hereNow = out; paintHere();
  });

    p => onLiveEntry(p.new, memberIds));
