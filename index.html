     a snapshot from whenever the page last drew. Every event, because starting, moving
     on and stopping all change the row. Debounced: three people picking something up at
     once is one repaint, not three. */
  ch.on("postgres_changes", { event: "*", schema: "public", table: "nows" }, p => {
    const row = p.new || p.old; if (!row || !memberIds.has(row.user_id)) return;

    nowPaintT = setTimeout(() => { const cur = activeRoom();
      if (cur && cur.id === roomChId && $("#roomNow")) paintRoomNow(cur); }, 350); });

    ch.track({ id: me.id, handle: me.handle, avatar: me.avatar }).catch(() => {}); });
  roomCh = ch;
}
/* an entry somebody just made, dropped in under whichever heading it belongs to.
   The row a socket hands over is the bare table row, so the entry is refetched to get
   the person, the work and the likes attached. That request takes time the tab may not
   wait for, which is why the anchor is looked up again on the way back rather than
   held across the await. */
async function dropInSlip(row, anchorSel) {
  if (!row || row.user_id === me.id) return false;
  if ($(`[data-slip="${CSS.escape(row.id)}"]`)) return false;   /* already on screen */
  if (!$(anchorSel)) return false;
  let full; try { full = (await q(sb.from("entries").select(ENTRY_SEL).eq("id", row.id).limit(1)))[0]; } catch { return false; }
  const anchor = $(anchorSel); if (!full || !anchor) return false;
  if ($(`[data-slip="${CSS.escape(row.id)}"]`)) return false;
  remember(full.works);
  const node = document.createElement("div"); node.innerHTML = slipHTML(full);
  const slip = node.firstElementChild; if (!slip) return false;
  slip.classList.add("landedNow", "warm"); slip.dataset.revealed = "1";
  anchor.after(slip); wireSlips(slip, [full]);
  setTimeout(() => slip.classList.remove("warm"), 2600);
  return true;
}
/* the cover travels from the grid to where the sheet is about to put it. The sheet has
   not been drawn yet, so it aims at where the sheet's cover lands rather than measuring it,
   and gives up quietly if the sheet never arrives. */
function openCover(from) {
  if (REDUCED || !from) return;
  const a = from.getBoundingClientRect(); if (!a.width) return;
  const f = from.cloneNode(true); f.className = "flyer";
  f.style.cssText = `position:fixed;z-index:30;left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px;border-radius:14px;overflow:hidden`;
  document.body.appendChild(f);
  requestAnimationFrame(() => {
    const to = $(".panel .head .co") || $(".panel .head");
    if (!to) { f.remove(); return; }
    const b = to.getBoundingClientRect();
    f.animate([{ transform:"none", opacity:1 },
      { transform:`translate(${b.left - a.left}px,${b.top - a.top}px) scale(${b.width / a.width})`,
        opacity:0 }],
      { duration:420, easing:"cubic-bezier(.16,1,.3,1)" }).onfinish = () => f.remove();
    setTimeout(() => f.remove(), 600); }); }

/* taste twins is the best idea in here and it was a list with a number on the end. The
   two of you start apart and are pulled together by exactly as much as you share, so how
   close they finish IS the match — forty per cent barely moves, ninety nearly overlaps. */
function drawTogether(root) {
  $$(".twin.pairing", root).forEach(row => {
    const avs = $$(".av", row); if (avs.length < 2) return;
    const m = Math.max(0, Math.min(100, +row.dataset.match || 0));
    /* overlapped by the share: nothing in common sits a whole avatar apart */
    const gap = Math.round(30 * (1 - m / 100));
    avs[1].style.marginLeft = "-14px";
    if (REDUCED) { avs[0].style.transform = "none"; avs[1].style.transform = `translateX(${gap}px)`;
      row.classList.add("drawn"); return; }
    avs[0].style.transform = `translateX(-${18 + gap}px)`;
    avs[1].style.transform = `translateX(${34 + gap}px)`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      avs[0].style.transform = "none"; avs[1].style.transform = `translateX(${gap}px)`;
      row.classList.add("drawn"); })); }); }

/* every feed simply stopped. A line that rises when you reach the end says you have seen
   everything, rather than that the app ran out — and it is the natural place to say how
   far back you have got. */
function endLine(fb, es, limit) {
  if (!fb || !es.length || es.length >= limit) return;
  const last = es[es.length - 1];
  const d = String(last.rated_on || "").slice(0, 10);
  fb.insertAdjacentHTML("beforeend",
    `<div class="endline">That's everything${d ? " since " + esc(stampDate(d)) : ""}</div>`); }

/* a sentence somebody wrote, arriving a few words at a time. Only where slowing you down
   is the point — a memory, a year — never in a feed, where it would be a gimmick. */
function sayWords(el, text) {
  if (!el) return;
  if (REDUCED) { el.textContent = text; return; }
  el.classList.add("saying");
  el.innerHTML = String(text).split(/\s+/).filter(Boolean)
    .map((w, i) => `<span class="w" style="animation-delay:${i * 55}ms">${esc(w)}</span>`).join(" ");
  setTimeout(() => el.classList.remove("saying"), 600 + text.split(/\s+/).length * 55); }

/* a chip that changes word and colour in one frame looks like a glitch until you read it.
   Filled from the left, with the word turning over under the fill, it reads as something
   you did. */
function fillChip(b, on, label) {
  if (!b) return;
  if (REDUCED || !on) { b.classList.toggle("on", on); b.textContent = label; return; }
  b.innerHTML = `<span>${esc(b.textContent.trim())}</span>`;
  b.classList.add("filling");
  setTimeout(() => { const sp = $("span", b); if (sp) sp.textContent = label; }, 190);
  setTimeout(() => { b.classList.remove("filling"); b.classList.add("on"); b.textContent = label; }, 460); }

/* the sentence does not swap characters — the old one falls out and the new one rises in,
   so you can see that it was you who changed it */
function rollLine(el, text) {
  const was = el.textContent;
  if (was === text) return;
  if (REDUCED) { el.innerHTML = ""; if (text) { const n = document.createElement("span");
    n.textContent = text; el.appendChild(n); } return; }
  el.innerHTML = "";
  if (was) { const old = document.createElement("span"); old.className = "was"; old.textContent = was;
    el.appendChild(old); setTimeout(() => old.remove(), 340); }
  if (text) { const now = document.createElement("span"); now.textContent = text; el.appendChild(now); }
  el.classList.add("rolling"); setTimeout(() => el.classList.remove("rolling"), 480); }

/* A socket hands over the bare table row, part column and all. The feed queries filter
   on it, and so must these, or the one path into the feed that is not a query becomes
   the one that floods it. */
const onLiveEntry = (row, memberIds) =>
  row && !row.part && !isApart(row.user_id) && memberIds.has(row.user_id) ? dropInSlip(row, "#talkTop") : Promise.resolve(false);

/* ---------- the channel that is about you rather than a room ----------
   A room channel dies when you leave the room, which is right for presence and wrong
   for anything addressed to you personally. This one is opened once you are in and
   stays for the session.

   The handover half filters server-side on the recipient, so the only rows that cross
   the wire are the ones meant for you. The following half cannot: "whoever I follow"
   is a set, and a realtime filter that lists it can be refused for length or for the
   operator. So it asks narrowly first and, if the socket rejects that, asks broadly
   and does the filtering here — the feed works either way, it is only the amount that
   travels that differs. */
let meCh = null, meChKey = null;
const followSet = () => new Set(follows.map(f => f.followee));
function leaveMeChannel() { if (meCh) { try { sb.removeChannel(meCh); } catch {} } meCh = null; meChKey = null; }
function joinMeChannel(broad = false) {
  if (!me || sb.__local || !sb.channel) return;
  const ids = [...followSet()].filter(Boolean).sort();
  /* a filter has a length the socket will accept; past that, ask broadly */
  const narrow = !broad && ids.length > 0 && ids.length <= 40;
  const key = (narrow ? "n:" + ids.join(",") : broad ? "b" : "h") + "|" + ids.length;
  if (meCh && meChKey === key) return;
  leaveMeChannel(); meChKey = key;
  const ch = sb.channel(`me:${me.id}`);
  ch.on("postgres_changes", { event:"INSERT", schema:"public", table:"handovers",
    filter:`recipient=eq.${me.id}` }, p => onLiveHand(p.new));
  if (narrow) ch.on("postgres_changes", { event:"INSERT", schema:"public", table:"entries",
    filter:`user_id=in.(${ids.join(",")})` }, p => onFollowEntry(p.new));
  else if (ids.length) ch.on("postgres_changes", { event:"INSERT", schema:"public", table:"entries" },
    p => onFollowEntry(p.new));
  /* assigned before subscribing, not after: a client that reports its status
     synchronously would otherwise run the retry while meCh still pointed at the last
     channel, so leaveMeChannel would tidy the wrong one and the narrow channel would
     be reinstated over the broad one the moment subscribe returned. */
  meCh = ch;
  ch.subscribe(st => {
    /* the narrow filter is the one that can be refused. Losing it should cost the
       bandwidth, never the feature. */
    if ((st === "CHANNEL_ERROR" || st === "TIMED_OUT") && narrow) { leaveMeChannel(); joinMeChannel(true); } });
}
/* somebody put something in front of you. loadHand repaints the bell on its way out. */
async function onLiveHand(row) {
  if (!row || row.recipient !== me.id) return;
  if (handAll.some(h => h.id === row.id)) return;
  await loadHand();
  if (currentTab() === "shelf") renderShelf(); }
/* somebody you follow logged something. Only worth dropping in if that is the feed you
   are actually looking at; anywhere else the next render picks it up. */
function onFollowEntry(row) {
  if (!row || row.part || isApart(row.user_id) || row.user_id === me.id || !followSet().has(row.user_id)) return;
  if (currentTab() !== "doors" || feedNow() !== "following") return;
  dropInSlip(row, "#folTop"); }

/* ---------- what's happened since you were last here ----------
   Two different questions were sharing one number, and it made both of them worse.
   "There are eleven new entries in your room" is a nudge to go and read. "Mo followed
   you, and two people liked what you said about Dune" is a list of things that happened
   to you,
   each of which you might want to do something about. The first belongs on the tab
   that holds the feed. The second needs somewhere of its own, so it got the bell. */
let unseen = { entries:[], followers:[], likes:[] };
const lastSeen = () => P.lastSeen || new Date(Date.now() - 3*864e5).toISOString();
/* The bell's own mark. Unlike the feed's, this one starts at the moment you first
   arrive rather than three days back: opening a new bell to a pile of history you have
   already seen elsewhere teaches you to ignore it on day one. */
function noteSeen() {
  if (!P.noteSeen) { P.noteSeen = new Date().toISOString(); saveP(); }
  return P.noteSeen; }
async function checkNew() {
  const since = lastSeen(), mark = noteSeen(), R = activeRoom();
  const mineIds = new Set(myEntries.map(e => e.id));
  /* Three independent questions, three independent tries. They used to share one, which
     meant a database that had not run the latest migration answered none of them —
     one unknown column and the bell went dark about people as well. */
  if (R) { try { const ids = R.members.map(m => m.id).filter(i => i !== me.id);
    /* limit(100) with no order is an arbitrary hundred rows, so in a busy room the
       newest entries were the ones it could silently fail to count */
    if (ids.length) { const es = notApart(await wholeEntries(f => { let x = sb.from("entries").select("id,user_id,created_at,work_id,profiles!entries_user_id_fkey(handle)");
        if (f) x = x.eq("part", false);
        return x.in("user_id", ids).order("created_at",{ascending:false}).limit(100); }));
      unseen.entries = es.filter(e => String(e.created_at) > since); } } catch {} }
  /* a count could only ever say "somebody". Keeping who lets the row say their name
     and offer the one thing anybody wants to do about it. */
  try { const fol = await q(sb.from("follows")
      .select("follower,created_at,profiles!follows_follower_fkey(id,handle,bio,avatar)")
      .eq("followee", me.id));
    unseen.followers = fol.filter(f => String(f.created_at || "") > mark); } catch {}
  /* v17 gave reactions a clock. Before it, this select throws on the unknown column and
     agreement simply does not appear — which is the right way to be out of date. */
  if (mineIds.size) { try { const rs = await q(sb.from("reactions")
      .select("entry_id,user_id,created_at,profiles(id,handle,bio,avatar)")
      .in("entry_id", [...mineIds].slice(0, 200)).neq("user_id", me.id).limit(200));
    unseen.likes = rs.filter(r => String(r.created_at || "") > mark); } catch { unseen.likes = []; } }
  paintDot();
}
/* Handovers are not diffed against the mark. An unanswered one is not news you have
   caught up on, it is a question somebody asked you that is still sitting there, so it
   stays in the list until you answer it — and it only counts towards the badge while
   it is genuinely new. */
const newHands = () => handIn.filter(h => String(h.created_at || "") > noteSeen());
const noteCount = () => unseen.followers.length + unseen.likes.length + newHands().length;
function paintDot() {
  const btn = $("nav button[data-tab='doors']");
  if (btn) { const n = unseen.entries.length;
    $(".dot", btn)?.remove();
    if (n > 0 && currentTab() !== "home") btn.insertAdjacentHTML("beforeend", `<span class="dot">${n > 9 ? "9+" : n}</span>`); }
  const bell = $("#bellBtn");
  if (bell) { const m = noteCount(), had = !!$(".dot", bell);
    $(".dot", bell)?.remove();
    if (m > 0) { bell.insertAdjacentHTML("beforeend", `<span class="dot">${m > 9 ? "9+" : m}</span>`);
      bell.setAttribute("aria-label", `What happened · ${m} new`);
      /* it shakes when something arrives, not every time the page redraws */
      if (!had && !REDUCED) { bell.classList.remove("jolt"); void bell.offsetWidth; bell.classList.add("jolt"); } }
    else bell.setAttribute("aria-label", "What happened"); }
}
function markSeen() { P.lastSeen = new Date().toISOString(); saveP();
  unseen.entries = []; paintDot(); }
function markNotesSeen() { P.noteSeen = new Date().toISOString(); saveP();
  unseen.followers = []; unseen.likes = []; paintDot(); }

/* ---------- the bell ----------
   Everything here is somebody doing something to you, and every row offers the thing
   you would want to do back. It is one list rather than four tabs: there are never
   enough of these to need sorting, and a tab you have to check is a tab you forget. */
function noteList() {
  const out = [];
  for (const f of unseen.followers) { const p = f.profiles; if (!p) continue;
    out.push({ kind:"follow", at:f.created_at, p, id:"f" + p.id }); }
  for (const r of unseen.likes) { const p = r.profiles; if (!p) continue;
    out.push({ kind:"like", at:r.created_at, p, id:"l" + r.entry_id + r.user_id,
      entry:myEntries.find(e => e.id === r.entry_id) }); }
  const fresh = noteSeen();
  for (const h of handIn) out.push({ kind:"hand", at:h.created_at, p:h.sender_p, id:"h" + h.id,
    hand:h, work:works[h.work_id] || h.works, stale:!(String(h.created_at || "") > fresh) });
  return out.sort((a,b) => String(b.at || "").localeCompare(String(a.at || "")));
}
const noteAgo = at => { if (!at) return "";
  const m = (Date.now() - new Date(at)) / 6e4;
  return m < 2 ? "just now" : m < 60 ? `${Math.round(m)} min ago`
    : m < 1440 ? `${Math.round(m/60)}h ago`
    : m < 10080 ? `${Math.round(m/1440)}d ago` : stampDate(String(at).slice(0,10)); };
function noteRow(n) {
  const t = n.work?.title || n.entry?.works?.title || works[n.entry?.work_id]?.title || "";
  const line = n.kind === "follow" ? "started following you"
    : n.kind === "like" ? (t ? `liked what you said about <b>${esc(t)}</b>` : "liked something you wrote")
    : (t ? `handed you <b>${esc(t)}</b>` : "handed you something");
  const acts = n.kind === "follow"
      ? `<button class="chip ${isFollowing(n.p.id) ? "on" : ""}" data-back="${esc(n.p.id)}">${isFollowing(n.p.id) ? "Following" : "Follow back"}</button>`
    : n.kind === "hand"
      ? `<button class="chip" data-yes="${esc(n.hand.id)}">Take it</button><button class="chip" data-no="${esc(n.hand.id)}">No</button>`
      : "";
  return `<div class="note${n.stale ? "" : " fresh"}" data-note="${esc(n.id)}">${avatar(n.p)}
    <div class="t"><p><b>${esc(n.p?.handle || "somebody")}</b> ${line}</p>
      <small>${noteAgo(n.at)}</small></div>
    ${acts ? `<div class="acts">${acts}</div>` : ""}</div>`;
}
function openNotes() {
  const ns = noteList();
  openSheet(`<h3>What happened</h3>
    <p class="sub">People, agreement, and anything somebody put in front of you.</p>
    <div id="noteBody" style="margin-top:10px">${ns.length ? ns.map(noteRow).join("")
      : `<p class="msg">Nothing yet. When somebody follows you, agrees with something you wrote,
         or hands you a title, it lands here.</p>`}</div>
    <div class="stack"><button class="btn quiet" id="noteClose">Close</button></div>`);
  $("#noteClose").onclick = closeSheet;
  dealIn($$("#noteBody .note"));

  /* marked read on open, not on close — you have seen them, and a badge that survives
     you looking at it is the reason people stop looking */

}
function wireNotes(ns) {
  const el = $("#noteBody"); if (!el) return;
  const by = Object.fromEntries(ns.map(n => [n.id, n]));
  $$("[data-back]", el).forEach(b => b.onclick = async ev => { ev.stopPropagation();
    const id = b.dataset.back, on = !isFollowing(id); b.disabled = true;
    if (await setFollow(id, on)) fillChip(b, on, on ? "Following" : "Follow back");
    b.disabled = false; });
  $$("[data-yes],[data-no]", el).forEach(b => b.onclick = async ev => { ev.stopPropagation();
    const yes = "yes" in b.dataset, h = handIn.find(x => x.id === (b.dataset.yes || b.dataset.no));
    if (!h) return; b.textContent = "…";
    const row = b.closest(".note"), face = row && $(".av", row);
    if (await answerHand(h, yes)) { say(yes ? "On the shelf" : "Gone");
      /* taken means it went somewhere, so show it going: onto the Library tab, which is
         where it now is. Declined just folds away. */
      if (yes) flyTo(face, $('nav button[data-tab="shelf"]'), works[h.work_id]?.cover);
      if (row) { row.classList.remove("fresh");
        const a = $(".acts", row); if (a) a.outerHTML = `<span class="tag dim">${yes ? "taken" : "gone"}</span>`; }
      paintDot(); if (currentTab() === "shelf") renderShelf(); } });
  $$("[data-note]", el).forEach(x => x.onclick = ev => {
    if (ev.target.closest(".acts")) return;
    const n = by[x.dataset.note]; if (!n) return;
    closeSheet();
    if (n.kind === "follow") return openProfile(n.p.id);
    const w = n.hand?.work_id || n.entry?.work_id;
    if (w) openWork(w); else if (n.p) openProfile(n.p.id); });
}

/* ---------- you were both there ---------- */
function together(e, all) {
  if (e.user_id === me.id) return null;
  const mine = myEntries.find(m => m.work_id === e.work_id);
  if (!mine) return null;
  const gap = Math.abs(new Date(mine.rated_on) - new Date(e.rated_on)) / 864e5;
  if (gap > 1.5) return null;
  const withMe = (e.context?.with || "").toLowerCase().includes(lc(me.handle)) || (mine.context?.with || "").toLowerCase().includes(lc(e.profiles?.handle || ""));
  return withMe ? "You were there" : "You both did this";
}

/* ============ shell ============ */
const RENDER = { doors:renderDoors, shelf:renderShelf, taste:renderTaste, clubs:renderClubs };
/* 19 — the pill follows the tab you land on.
   It caches pixel geometry in inline styles, which means anything that moves the nav
   behind its back leaves it pointing at a layout that no longer exists. The way to see
   it: turn the phone to landscape, where .in stops growing at its 560px max-width and
   every tab measures 109 wide, then turn it back. iOS keeps the wide numbers — the pill
   sits a column too far right and runs under the + — because a window resize event is
   not reliably delivered after layout settles on rotation, and is never delivered at all
   for the other things that move the nav: a bfcache restore, the URL bar collapsing, or
   Outfit arriving late and resizing labels inside min-content tracks.
   So watch the element rather than the window. The button is the one source of truth and
   it is re-read whenever its own box could have changed. */
function movePill(instant) { const p = $("#navPill"), on = $("nav button[data-tab].on");
  if (!p || !on || !on.offsetWidth) return;
  if (instant) p.style.transition = "none";
  p.style.left = on.offsetLeft + "px"; p.style.width = on.offsetWidth + "px";
  p.classList.add("set");
  if (instant) { void p.offsetWidth; p.style.transition = ""; } }
addEventListener("resize", () => movePill(true));
addEventListener("orientationchange", () => movePill(true));
addEventListener("pageshow", () => movePill(true));
/* rAF so the re-measure lands after the layout that triggered it, and so forcing a
   reflow inside the callback can't feed back into the observer */
if (window.ResizeObserver) { const nb = $("nav .in");
  if (nb) new ResizeObserver(() => requestAnimationFrame(() => movePill(true))).observe(nb); }
document.fonts?.ready.then(() => movePill(true)).catch(() => {});

const TAB_ORDER = ["doors", "shelf", "taste", "clubs"];
function switchTab(n) { shelfEdit = false;
  if (n !== "doors") leaveRoomChannel();
  /* the new tab enters from the side you came from, so the row of tabs reads as a row */
  const was = TAB_ORDER.indexOf(currentTab()), now = TAB_ORDER.indexOf(n);
  document.documentElement.style.setProperty("--slide", was < 0 || now < 0 || was === now ? "0px" : (now > was ? "22px" : "-22px"));
  $$("nav button[data-tab]").forEach(b => { const on = b.dataset.tab === n;
    b.classList.toggle("on", on); if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); }); $$("main section").forEach(s => s.classList.toggle("on", s.id === "tab-"+n)); movePill(); scrollTo(0,0); RENDER[n]?.();
  if (n === "doors") setTimeout(markSeen, 1200); else paintDot(); }
$$("nav button[data-tab]").forEach(b => b.onclick = () => switchTab(b.dataset.tab));
markLive();
const currentTab = () => $$("main section").find(s => s.classList.contains("on"))?.id.replace("tab-","");
const refresh = () => RENDER[currentTab()]?.();
/* ---------- pulling the page down ----------
   refresh() only redraws what is already in memory, which is the wrong thing to do when
   somebody asks for new. This fetches first. It is deliberately the shared things rather
   than everything: your log, your queue, what you are on, and who is new. */
let pulling = false;
async function pullRefresh() {
  if (pulling || !me) return false;
  pulling = true;
  try {
    await Promise.all([loadMine().catch(()=>{}), loadHand().catch(()=>{}), loadNow().catch(()=>{})]);
    await checkNew().catch(()=>{});
    refresh();
    return true;
  } finally { pulling = false; } }

/* Touch only, and only from a page already at the top. The sheet does its own scrolling
   and must never be dragged out from under itself. Nothing calls preventDefault, so the
   rubber band still does what the phone expects — this only reads the gesture. */
(() => {
  const TRIG = 72;
  /* one-to-one up to the trigger, then resistance. Two hundred pixels of finger buys
     forty more of chip, which is how a phone says there is nothing else to pull. */
  const give = raw => raw <= TRIG ? raw : TRIG + Math.sqrt(raw - TRIG) * 5;
  let y0 = null, live = false, dist = 0, bar = null;
  const chip = () => bar ||= (() => { const d = document.createElement("div");
    d.className = "pull"; d.id = "pullBar"; d.textContent = "Pull down";
    document.body.appendChild(d); return d; })();
  const off = () => { const b = chip(); b.classList.remove("on","ready","going"); b.style.removeProperty("--p"); };
  addEventListener("touchstart", e => {
    if (e.touches.length !== 1 || pulling) return;
    if ($("#sheet")?.classList.contains("on")) return;
    if (window.scrollY > 0 || !me) return;
    y0 = e.touches[0].clientY; dist = 0; live = false;
  }, { passive:true });
  addEventListener("touchmove", e => {
    if (y0 == null) return;
    if (window.scrollY > 0) { y0 = null; if (live) { live = false; off(); } return; }
    dist = e.touches[0].clientY - y0;
    if (dist <= 6) { if (live) { live = false; off(); } return; }
    live = true; const b = chip(), p = Math.min(1.34, give(dist) / TRIG);
    b.style.setProperty("--p", p.toFixed(3));
    b.classList.add("on"); b.classList.toggle("ready", p >= 1);
    b.textContent = p >= 1 ? "Let go" : "Pull down";
  }, { passive:true });
  addEventListener("touchend", async () => {
    if (!live) { y0 = null; return; }
    const go = dist >= TRIG; y0 = null; live = false;
    if (!go) return off();
    const b = chip(); b.classList.add("going"); b.textContent = "Refreshing";
    try { await pullRefresh(); } finally { setTimeout(off, 260); }
  }, { passive:true });

let sheetGoing = null;
/* 03 — a flood of the medium's colour, once, on the way out of a save */
function inkWash(kind) { if (REDUCED) return;
  const el = document.createElement("span"); el.className = "wash";
  el.style.setProperty("--k", `var(--${kind || "mint"})`);
  document.body.appendChild(el); setTimeout(() => el.remove(), 900); }

/* ---------- asking something, in the app's own voice ----------
   prompt() and confirm() work, wrapped or not, but they arrive as a system alert with
   the app's name on top and none of its type or colour — and the first one a new person
   ever meets is the box that asks them to name their room, which is a poor introduction.

   Both return a promise, both close on Escape and on the backdrop, and both hand focus
   to the thing you are meant to touch. */
let askGo = null;
function closeAsk(v) { const a = $("#ask"); if (!a.classList.contains("on")) return;
  a.classList.remove("on"); a.setAttribute("aria-hidden", "true"); $("#askBox").innerHTML = "";
  const f = askGo; askGo = null; f?.(v); }

  return new Promise(res => {
    closeAsk(null);                       /* one at a time, and the old one answers null */
    askGo = res;
    const a = $("#ask"); $("#askBox").innerHTML = html;
    a.classList.add("on"); a.setAttribute("aria-hidden", "false");
    wire(v => closeAsk(v));
  });
}
function askText({ title, sub = "", label = "", value = "", placeholder = "", ok = "Save", max = 0, upper = false }) {
  return openAsk(`<h3>${esc(title)}</h3>${sub ? `<p class="sub">${sub}</p>` : ""}
    ${label ? `<div class="lbl">${esc(label)}</div>` : ""}
    <input id="askIn" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off"
      ${max ? `maxlength="${max}"` : ""}${upper ? ` autocapitalize="characters" spellcheck="false" style="text-transform:uppercase"` : ""}>
    <div class="stack"><button class="btn" id="askOk">${esc(ok)}</button>
      <button class="btn quiet" id="askNo">Not now</button></div>`, done => {
    const inp = $("#askIn");
    const go = () => { const v = (inp.value || "").trim(); if (v) done(v); };
    $("#askOk").onclick = go;
    $("#askNo").onclick = () => done(null);
    inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); go(); } };
    setTimeout(() => { if (inp.isConnected) { inp.focus(); inp.select(); } }, 60);
  });
}
/* Always a boolean, never a null. Escape and the backdrop go through the same door as
   "not now", and a caller written as `if (!await askYesNo(...)) return` cannot tell the
   difference — but one written as `=== false` could, and would be wrong about it. */
function askYesNo(opts) { return askYesNoRaw(opts).then(v => v === true); }
function askYesNoRaw({ title, sub = "", ok = "Yes", no = "Not now", bad = false }) {
  return openAsk(`<h3>${esc(title)}</h3>${sub ? `<p class="sub">${sub}</p>` : ""}
    <div class="stack"><button class="btn ${bad ? "bad" : ""}" id="askOk">${esc(ok)}</button>
      <button class="btn quiet" id="askNo">${esc(no)}</button></div>`, done => {
    $("#askOk").onclick = () => done(true);
    $("#askNo").onclick = () => done(false);
    setTimeout(() => $("#askNo")?.focus(), 60);
  });
}

function openSheet(html) { clearTimeout(sheetGoing); sheetGoing = null;
  $("#sheet").setAttribute("aria-hidden", "false");
  $("#sheetBody").innerHTML = `<div class="grab"></div>` + html;
  $("#sheet").classList.remove("out"); $("#sheet").classList.add("on"); $(".panel").scrollTop = 0; }
function closeSheet() { const sh = $("#sheet"); if (!sh.classList.contains("on")) return;
  sh.setAttribute("aria-hidden", "true");
  if (REDUCED) { sh.classList.remove("on", "out"); return; }
  sh.classList.add("out"); clearTimeout(sheetGoing);
  sheetGoing = setTimeout(() => { sh.classList.remove("on", "out"); sheetGoing = null; }, 200); }
$("#sheet").onclick = e => { if (e.target === $("#sheet")) closeSheet(); };
$("#ask").onclick = e => { if (e.target === $("#ask")) closeAsk(null); };
/* escape answers the question, and only the question — a sheet underneath stays put */
addEventListener("keydown", e => { if (e.key !== "Escape") return;
  if ($("#ask").classList.contains("on")) { e.preventDefault(); closeAsk(null); }
  else if ($("#sheet").classList.contains("on")) closeSheet(); });
/* every phone expects a sheet to be pushable. It only takes the gesture from the top of
   the panel, because the panel scrolls and a drag that started on the content is a scroll. */
(() => {
  const panel = $(".panel"); if (!panel) return;
  let y0 = null, d = 0;
  panel.addEventListener("pointerdown", e => {
    if (REDUCED || panel.scrollTop > 2 || e.clientY - panel.getBoundingClientRect().top > 64) return;
    y0 = e.clientY; d = 0; panel.classList.remove("springing"); panel.classList.add("dragging"); });
  panel.addEventListener("pointermove", e => { if (y0 === null) return;
    d = Math.max(0, e.clientY - y0);
    panel.style.transform = `translateY(${d}px)`; });
  const let_go = () => { if (y0 === null) return; y0 = null;
    panel.classList.remove("dragging");
    const h = panel.getBoundingClientRect().height;
    panel.classList.add("springing");
    if (d > h * 0.4 || d > 220) { panel.style.transform = ""; panel.classList.remove("springing"); closeSheet(); }
    else { panel.style.transform = "translateY(0)";

  ["pointerup","pointercancel","pointerleave"].forEach(t => panel.addEventListener(t, let_go));

/* ============ auth ============ */
function renderAuth() {
  const b = $("#authBody");
  if (sb.__local) { const prev = sb.__db.profile;
    b.innerHTML = `<h1>Every room<br>you’ve <span>been in.</span></h1>
      <p class="say">You used to be able to stand in someone’s front room and know them. The shelves told you. Nothing tells you now. <b>This does.</b></p>

/* ---------- one handle each ----------
   A handle is the only name anybody has here, and until v23 it was free to change and
   free to drop — change yours and the old one went back in the pool, so somebody could
   take the name your friends know you by and be mistaken for you in a room.

   before you press anything; claim_handle is what actually decides, in one statement,
   because two people pressing save at the same moment must not both be told yes. */
async function handleTaken(h) {
  try { const rows = await q(sb.from("handles").select("handle").eq("handle", lc(h)).limit(1));
    return rows.length > 0; } catch { return false; }
}

/* ---------- looking at a room before you are in it ----------
   A link from a friend asked for an account before it would show anything, which is a
   strange order to do it in: sign up, then find out whether it was worth it. This says
   who is in there and how much they have between them. Not a word anybody wrote — the
   code is fair proof that a room is real, and not a licence to publish what is in it. */
async function peekRoom(code) {
  try { const rows = await q(sb.rpc("peek_room", { p_code:code }));
    const r = Array.isArray(rows) ? rows[0] : rows;

function blank(colour, mark, title, body, actions = []) {

/* ---------- the week you have had ----------
   The reel, the cuts and the memories all need a history — a year of it, in places — so
   for the first month the app has nothing to say to somebody who has not just finished
   something. This needs seven days.

   Shown once a week and then put away for a week, whether or not it was opened: a card
   that comes back every time you open the app is not a moment, it is wallpaper. Two
   entries at least, because "you logged one thing" is not a week worth reporting. */
const WEEK_KEY = () => { const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d.toISOString().slice(0, 10); };                 /* the Monday just gone */
function weekPast() {
  const from = new Date(); from.setDate(from.getDate() - 7);
  const since = from.toISOString().slice(0, 10);
  const es = myEntries.filter(e => String(e.rated_on) >= since);
  if (es.length < 2) return null;
  const kinds = {}; es.forEach(e => { const k = kindOf(e.work_id); kinds[k] = (kinds[k] || 0) + 1; });
  const best = es.slice().sort((a, b) => b.score - a.score)[0];
  const loved = {}; es.forEach(e => (e.loved || []).forEach(l => { if (!l.startsWith("person:")) loved[l] = (loved[l] || 0) + 1; }));
  const top = Object.entries(loved).sort((a, b) => b[1] - a[1])[0];
  const first = myEntries.length === es.length;             /* nothing before this week */
  return { n:es.length, kinds, best, top:top && top[1] > 1 ? top[0] : null, first, es };
}
function weekCard() {
  if (P.weekSeen === WEEK_KEY()) return "";
  const w = weekPast(); if (!w) return "";
  const bw = works[w.best.work_id] || {};

    .map(([k,n]) => `${n} ${inWords(k, n)}`);
  return `<div class="card look" id="weekCard"><div class="h">
      <span>${w.first ? "Your first week" : "Your week"}</span><span class="tag dim">${w.n} logged</span></div>
    <div class="say" style="margin-top:10px">${esc(spread.join(" \u00b7 "))}.${
      bw.title ? ` The one you went highest on was <b>${esc(bw.title)}</b>.` : ""}${
      w.top ? ` You singled out <span class="hl" style="background:var(--butter)">${esc(w.top)}</span> more than anything else.` : ""}</div>

const MEM_MIN = 10, MEM_DAYS = 60, MEM_YEARS = [1, 2, 3, 5, 10, 15, 20];
const memGone = () => { try { return new Set(JSON.parse(localStorage.getItem("rooms.mem") || "[]")); }
  catch { return new Set(); } };
const memForget = id => { try { const g = [...memGone(), id].slice(-200);
  localStorage.setItem("rooms.mem", JSON.stringify(g)); } catch {} };
function memories() {
  if (myEntries.length < MEM_MIN) return [];
  const dates = myEntries.map(e => String(e.rated_on)).filter(Boolean).sort();
  if (!dates.length || dayNo(today()) - dayNo(dates[0]) < MEM_DAYS) return [];
  const [Y, M, D] = today().split("-").map(Number), pad = n => String(n).padStart(2, "0");
  const out = [];
  for (const yrs of MEM_YEARS) {
    const then = `${Y - yrs}-${pad(M)}-${pad(D)}`;
    const on = myEntries.filter(e => String(e.rated_on) === then);
    if (on.length) out.push({ id:"day:" + then, kind:"day", yrs, when:then, entries:on,
      head: yrs === 1 ? "A year ago today" : `${Cap(said(yrs))} years ago today` });
  }
  for (const yrs of MEM_YEARS) {

  }

  for (const e of myEntries) { if (seen[e.work_id]) again.add(e.work_id); seen[e.work_id] = 1; }
  const loved = myEntries.filter(e => e.score >= 9 && !again.has(e.work_id)
      && dayNo(today()) - dayNo(String(e.rated_on)) > 400)
    .sort((a,b) => String(a.rated_on).localeCompare(String(b.rated_on)));
  if (loved.length) out.push({ id:"still:" + loved[0].work_id, kind:"still", entries:[loved[0]],
    head:"You gave this five stars" });

  return out.filter(m => !gone.has(m.id)); }

/* The month and the year are not memories, they are reviews: they arrive on a date and
   they already have cards, so this is a door to what is there rather than anything new. */
function dueReview() {
  const [Y, M, D] = today().split("-").map(Number);
  if (M === 1 && D <= 21) { const last = String(Y - 1);
    if (yearOf(myEntries, last).length >= 5) return { kind:"year", year:last, head:`${last}, all of it` }; }
  if (D <= 7) { const pm = M === 1 ? 12 : M - 1, py = M === 1 ? Y - 1 : Y;
    const pre = `${py}-${String(pm).padStart(2,"0")}`;
    const es = myEntries.filter(e => String(e.rated_on).startsWith(pre));
    if (es.length >= 3) return { kind:"month", pre, entries:es,
      head:`${new Date(py, pm-1, 1).toLocaleString("en-GB",{month:"long"})}, in one card` }; }
  return null; }

/* ---------- whose word is good ----------
   The handovers already know who put what in front of you, and your log already knows
   what you made of it. Put them together and the app can answer a question no ratings
   site can: not "is this good" but "is this person right about you".

   The trap is small numbers. One person sends you one thing, you love it, and they top
   the list for ever on a sample of one. So nothing counts below three of theirs logged,
   and the average is pulled toward your own by three phantom entries at your mean —
   somebody with four has to be a long way off you to move, somebody with thirty barely
   feels it. It is the plainest shrinkage there is and it stops the list being noise.

   Private, always. A public ranking of your friends is a different app. */
const HAND_FLOOR = 3;
function whoseWord() {
  const latest = {};
  for (const e of myEntries) { const cur = latest[e.work_id];
    if (!cur || String(e.rated_on) > String(cur.rated_on)) latest[e.work_id] = e; }
  const all = Object.values(latest);
  if (all.length < 5) return [];
  const myMean = all.reduce((a,e) => a + e.score, 0) / all.length;
  const by = {};
  for (const h of handAll) {
    if (h.recipient !== me.id || !h.accepted) continue;
    const b = by[h.sender] ||= { id:h.sender, who:h.sender_p, took:0, logged:0, sum:0 };
    b.took++;
    const e = latest[h.work_id]; if (e) { b.logged++; b.sum += e.score; } }
  return Object.values(by).filter(b => b.logged >= HAND_FLOOR).map(b =>
      Object.assign(b, { myMean, mean:(b.sum + HAND_FLOOR * myMean) / (b.logged + HAND_FLOOR) }))
    .map(b => Object.assign(b, { delta:b.mean - b.myMean }))
    .sort((a,b) => b.mean - a.mean); }
/* people who have handed you things but not enough of them to say anything yet */
const wordPending = () => { const seen = new Set(whoseWord().map(b => b.id));
  return [...new Set(handAll.filter(h => h.recipient === me.id && h.accepted && !seen.has(h.sender))
    .map(h => h.sender))].length; };

/* ---------- what you're in the middle of ----------
   The app has known two states: on the shelf, and logged. A season, a novel, a game you
   will be at for a month — none of them had anywhere to live, and the most present-tense
   thing about a person was invisible to the room.

  try { myNow = await q(sb.from("nows").select(NOW_SEL + ",works(*)").eq("user_id", me.id)

/* "since Tuesday" is the honest fallback when nobody has said where they are up to.

/* ---------- second thoughts ----------
   A ratings site keeps one number per person. A log keeps a history, and the history is

  for (const [id, list] of Object.entries(by)) {
    if (list.length < 2) continue;
    const seq = list.slice().sort((a, b) => String(a.rated_on).localeCompare(String(b.rated_on)));

/* the line a work page shows about your own history with it */

  const first = seq[0], last = seq[seq.length - 1];

  if (last.score === first.score)

/* ---------- how far apart two people are ----------

   you is right. Under three shared titles there is nothing to say. */
function apart(mineEs, theirs) {

    if (!cur || String(e.rated_on) > String(cur.rated_on)) acc[e.work_id] = e; return acc; };
  const a = mineEs.reduce(keep, {}), b = theirs.reduce(keep, {});
  const rows = [];
  for (const id in a) if (b[id]) rows.push({ id, mine:a[id].score, them:b[id].score, d:Math.abs(a[id].score - b[id].score) });
  if (rows.length < 3) return null;

/* ---------- how long it has been waiting ----------
   Under a month is not a conscience, it is a shelf doing its job. */
function shelfAge(id) { const L = activeList(), at = L?.added?.[id]; if (!at) return null;
  const days = Math.floor((Date.now() - new Date(at)) / 864e5);
  return days >= 30 ? days : null; }
/* Everything under two months used to come out as "one months", which is wrong twice:

   years — and nothing is ever one of anything plural. */
const waited = d =>
  d >= 365 ? `${said(Math.floor(d / 365))} year${d >= 730 ? "s" : ""}`
  : d >= 60 ? `${said(Math.round(d / 30))} months`
  : d >= 14 ? `${said(Math.round(d / 7))} weeks`
  : d <= 1  ? "a day"

/* ---------- looking for a person, not a title ----------

    return { id, kind, title:r.title || r.name, year:date.slice(0,4), cover:TMDB_IMG(r.poster_path),

  const body = directed.length ? directed : wrote.length ? wrote : (cr.cast || []).map(asRow).filter(Boolean);
  const rows = body.sort((a, b) => String(b.__date).localeCompare(String(a.__date)))
    .filter(r => P.kinds.includes(r.kind)).slice(0, 8);

async function doSearch(term, onPick, resEl, msgEl, box, acts = null) { msgEl.textContent = "Searching " + P.kinds.map(k => K(k).label.toLowerCase()).join(", ");
  /* the person lookup rides alongside the title searches rather than after them */
  const wantsScreen = P.kinds.includes("film") || P.kinds.includes("tv");
  const [done, person] = await Promise.all([
    Promise.all(P.kinds.map(k => SOURCES[k](term).then(r => ({ k, r })).catch(e => ({ k, err:e.message })))),
    wantsScreen ? byPerson(term).catch(() => null) : null,

    ? blank("var(--pink)","!","Can't search that", errs.join(" · ") + ". Check your key or the worker under your name → Edit.", [])

    r.addEventListener("mousedown", e => e.preventDefault());

      $$(".pick.open", resEl).forEach(o => o.classList.remove("open"));
      r.classList.toggle("open", !was); };
    $$("[data-act]", r).forEach(b => b.onclick = ev => { ev.stopPropagation(); onPick(r, b.dataset.act); box?.focus(); }); }); }
async function ensureWork(hit) { if (works[hit.id]?.credits) return works[hit.id]; const raw = hit.id.split(":")[1]; const extra = await DETAIL[hit.kind](raw).catch(() => ({}));
  const w = Object.assign({ id:hit.id, kind:hit.kind, title:hit.title, year:hit.year, cover:hit.cover, creator:hit.creator||"", length:hit.length||0 }, extra);

async function addToShelf(id) { const L = activeList(), hit = window.__hits?.[id] || works[id]; if (!L || !hit) return; const m = $("#msg"); if (m) m.textContent = "Adding";

async function removeFromShelf(id) { const L = activeList(); if (!L || !L.items.includes(id)) return;

  const back = L.items.slice(); L.items = L.items.filter(x => x !== id);

    .catch(e => { L.items = back; oops(e, "Couldn't take that off the shelf"); if (currentTab() === "shelf") renderShelf(); });

/* ---------- pick a cut, then save it ---------- */
async function openCuts(kind, data, title) {
  const set = CUTS[kind]; if (!set) return;
  P.cut = P.cut || {}; let chosen = Math.min(P.cut[kind] ?? 0, set.cuts.length - 1);
  openSheet(`<h3>${esc(title || set.label)}</h3><p class="sub">Three cuts of the same thing. Pick one.</p>
    <div class="cuts" id="cutRow">${set.cuts.map(([name],i) =>
      `<button data-cut="${i}" class="${i===chosen?"on":""}"><canvas id="cut-${i}" width="216" height="270"></canvas><b>Cut ${i+1} · ${esc(name)}</b></button>`).join("")}</div>
    <div class="lbl">What it's wearing</div>
    <div class="skins" id="skinRow">${Object.entries(CARD_THEMES).map(([k,t]) =>
      `<button data-skin="${esc(k)}" class="${(P.cardSkin||"rooms")===k?"on":""}" aria-label="${esc(t.name)}">
        <span class="sw" style="background:${t.day};${t.dim?"":"box-shadow:inset 0 0 0 1px rgba(21,19,32,.14)"}"></span>
        <b>${esc(t.name)}</b>${t.paid ? `<i>paid</i>` : ""}</button>`).join("")}</div>
    <p class="sub skinnote" id="skinNote" hidden></p>
    <div class="stack"><button class="btn blue" id="cutSave">Save it</button><button class="btn quiet" id="cutClose">Not now</button></div>
    <p class="msg" id="cutMsg"></p>`);
  /* draw each cut small; the skin picker redraws them, so the choice is seen not described */
  const drawAll = async () => {
    for (const [i, [, draw]] of set.cuts.entries()) {
      try { const c = await draw(data); const t = $("#cut-" + i); if (!t) continue;
        const tx = t.getContext("2d"); tx.clearRect(0,0,t.width,t.height); tx.drawImage(c, 0, 0, t.width, t.height); }
      catch (err) { console.warn("cut", i, err); } } };
  /* nothing takes money yet, so a paid skin works and says what it will be rather than
     dangling a lock over something that cannot be bought */
  const paidNote = () => { const el = $("#skinNote"); if (!el) return;
    const t = cardTheme(); el.hidden = !t.paid;
    el.textContent = t.paid ? `${t.name} is part of Rooms paid. Free while that's still being made.` : ""; };
  /* an export appeared finished. It assembles once, before the Save button matters. */
  if (!REDUCED) $$("#cutRow button").forEach(b => b.classList.add("drawing"));
  await drawAll(); paidNote();
  if (!REDUCED) $$("#cutRow button").forEach((b, i) => {
    b.classList.remove("drawing"); b.style.animationDelay = (i * 140) + "ms"; b.classList.add("drawn");
    setTimeout(() => { b.classList.remove("drawn"); b.style.animationDelay = ""; }, 900 + i * 140); });
  $$("[data-skin]").forEach(b => b.onclick = async () => { P.cardSkin = b.dataset.skin; saveP();
    $$("[data-skin]").forEach(x2 => x2.classList.toggle("on", x2 === b)); paidNote(); await drawAll(); });
  $$("[data-cut]").forEach(b => b.onclick = () => { chosen = +b.dataset.cut;
    $$("[data-cut]").forEach(x2 => x2.classList.toggle("on", x2 === b)); });
  $("#cutClose").onclick = closeSheet;
  $("#cutSave").onclick = async () => { P.cut[kind] = chosen; saveP();
    try { const c = await set.cuts[chosen][1](data); await cardOut(c, `rooms-${kind}-cut${chosen+1}.png`); closeSheet(); }
    catch (e) { $("#cutMsg").textContent = e.message; } };
}

/* what a week or a month looks like as data */
/* A stretch is any set of entries with a name on it, so a memory and a month can share
   the card with a window of days rather than each faking the other's shape. */
function spanOf(entries, label, range) {
  const kinds = {}; entries.forEach(e => kinds[kindOf(e.work_id)] = (kinds[kindOf(e.work_id)]||0)+1);
  const t = tasteOf(entries), best = entries.slice().sort((a,b) => b.score - a.score)[0];
  const top = t.craft.slice(0,3).map(c => c[0]);
  return { label, n:entries.length, entries, kinds, t, best,
    line: top.length ? `You went for ${top.join(", ")}.` : "A quiet stretch.", range }; }
function spanData(days, label) {
  const from = new Date(Date.now() - days*864e5).toISOString().slice(0,10);
  return spanOf(myEntries.filter(e => String(e.rated_on) >= from), label,
    `${stampDate(from)} — ${stampDate(today())}`); }

/* the room's year keeps its own cut, and so does the year in review */
/* ---------- the room's year ---------- */
function roomPalmares(es) {
  const per = competition(es, 200);
  if (!per.length) return null;
  const enough = per.filter(f => f.n >= 2);
  const byKind = {}; for (const f of per) { const k = kindOf(f.id); if (!byKind[k] || f.w > byKind[k].w) byKind[k] = f; }
  const agreed = enough.slice().sort((a,b) => (b.agree||0) - (a.agree||0))[0];
  const split = enough.slice().sort((a,b) => (a.agree||100) - (b.agree||100))[0];
  const counts = {}; es.forEach(e => counts[e.user_id] = (counts[e.user_id]||0)+1);
  const busiest = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  return { best:per[0], byKind, agreed, split, busiest, n:es.length };
}

/* your log, grouped: one row per thing, with the arc of what you gave it */
/* A show you have only rated in seasons had nowhere to appear: the log is built from
   entries, and a season is not one of the things the log is about. But you have said
   what you think of it, and a log that hides that is a log that lost something. So it
   gets a row of its own, carrying the worked-out number and dated by the last thing you
   said about it, and it opens the show rather than an entry — because there is no entry,
   which is the whole point of the row. */
function showsFromParts(qtext = "", already = new Set()) {
  const out = [];
  for (const e of myParts) { const sid = showOf(e.work_id);
    if (already.has(sid) || out.some(x => x[0] === sid)) continue;
    const w = works[sid]; if (!w) continue;
    if (qtext && !lc([w.title, w.creator, "TV"].filter(Boolean).join(" ")).includes(qtext)) continue;
    const d = derivedScore(myParts, sid); if (!d) continue;
    out.push([sid, d, myParts.filter(x => showOf(x.work_id) === sid).sort(newestFirst)[0]]); }
  return out; }
/* how many things are in your log, which is not the same as how many entries you have */
const logCount = () => myEntries.length + showsFromParts().length;

function logBlock(id, opts = {}) {
  const n = logCount();
  return `${opts.label !== false ? `<div class="lbl">${opts.label || `Your log · ${n}`}</div>` : ""}
    ${n ? `<input id="${id}-q" class="searchlog" type="search" placeholder="Find something you logged" autocomplete="off" value="${esc(P.logQ||"")}">
      <div id="${id}"></div>` : ""}`; }
function wireLog(id, limit) {
  paintLog(id, limit);
  const q2 = $(`#${id}-q`); if (q2) { let t; q2.oninput = ev => { clearTimeout(t); P.logQ = ev.target.value; t = setTimeout(() => { saveP(); paintLog(id, limit); }, 200); }; } }
function paintLog(id = "logRows", limit = 0) {
  const el = $("#" + id); if (!el) return;
  const qtext = lc(P.logQ || "").trim(); const groups = {};
  for (const e of myEntries) { const w = works[e.work_id] || {};
    if (qtext) { const hay = lc([w.title, w.creator, K(w.kind).label, ...(e.loved||[]).map(k => k.startsWith("person:")?k.slice(7):k), e.note].filter(Boolean).join(" "));
      if (!hay.includes(qtext)) continue; }
    (groups[e.work_id] ||= []).push(e); }
  const partOnly = showsFromParts(qtext, new Set(Object.keys(groups)));
  const all = Object.entries(groups).sort((a,b) => String(b[1][0].rated_on).localeCompare(String(a[1][0].rated_on)));
  const rows = limit ? all.slice(0, limit) : all;
  /* a log made only of seasons is still a log, and returning here on an empty rows
     list would have thrown those rows away before they were ever drawn */
  if (!rows.length && !partOnly.length) { el.innerHTML = `<p class="empty">Nothing matches “${esc(P.logQ)}”.</p>`; return; }
  el.innerHTML = `<div class="card" style="margin-top:8px">${rows.map(([id, es]) => { const w = works[id] || {}; const last = es[0]; const arc = es.slice().reverse();
    return `<div class="row" data-e="${last.id}" data-group="${esc(id)}">${cover(w)}<div class="t"><b>${esc(w.title)}</b>
      <small>${tag(w.kind)} ${when(last.rated_on)}${es.length > 1 ? ` · ${es.length} times` : ""}</small></div>
      ${es.length > 1 ? `<div class="arc">${arc.map((e,i) => `<i class="${i===arc.length-1?"last":""}" style="height:${4 + e.score*1.8}px"></i>`).join("")}</div>` : stars(last.score,"sm")}</div>`; }).join("")}
    ${partOnly.map(([sid, d, last]) => { const w = works[sid] || {};
      return `<div class="row" data-show="${esc(sid)}">${cover(w)}<div class="t"><b>${esc(w.title)}</b>
        <small>${tag("tv")} ${when(last.rated_on)} · ${d.seasons === 1 ? "one season" : d.seasons + " seasons"}</small></div>
        ${stars(Math.round(d.score),"sm")}</div>`; }).join("")}
    ${limit && all.length > limit ? `<div class="row" style="justify-content:center;color:var(--mute);font-weight:700;font-size:13px" data-logmore>Everything you've logged · ${all.length}</div>` : ""}</div>`;
  const more = $("[data-logmore]", el); if (more) more.onclick = () => openWholeLog();
  $$("[data-e]", el).forEach(r => r.onclick = () => { const g = groups[r.dataset.group]; if (g.length === 1) return openEntry(g[0]);
    openSheet(`<h3>${esc(works[r.dataset.group]?.title||"")}</h3><p class="sub">${g.length} entries</p>
      <div class="card">${g.map(e => `<div class="row" data-ge="${e.id}"><div class="t"><b>${when(e.rated_on)}</b><small>${e.note?esc(String(e.note).slice(0,60)):""}</small></div>${stars(e.score,"sm")}</div>`).join("")}</div>
      <div class="stack"><button class="btn quiet" id="gClose">Close</button></div>`);
    $("#gClose").onclick = closeSheet; $$("[data-ge]").forEach(x => x.onclick = () => openEntry(g.find(e => e.id === x.dataset.ge))); });
  $$("[data-show]", el).forEach(r => r.onclick = () => openWork(r.dataset.show)); }

const HALLOWEEN_2026 = {
  id:"halloween-2026", name:"31 Nights In", starts:"2026-10-01", ends:"2026-10-31",
  challenges:[
    { id:"midnight-matinee", kind:"film", icon:"◒", name:"Midnight Matinee", copy:"Log horror films through October." },
    { id:"after-dark", kind:"tv", icon:"▤", name:"After Dark", copy:"Log horror shows through October." },
    { id:"haunted-shelf", kind:"book", icon:"✦", name:"Haunted Shelf", copy:"Log horror books through October." },
    { id:"ghost-machine", kind:"game", icon:"◇", name:"Ghost in the Machine", copy:"Log horror games through October." }
  ]
};
const SEASON_MEDALS = [
  { tier:"bronze", at:1, icon:"●", name:"Bronze" },
  { tier:"silver", at:3, icon:"◐", name:"Silver" },
  { tier:"gold", at:6, icon:"✦", name:"Gold" },
  { tier:"platinum", at:10, icon:"✺", name:"Platinum" }
];
const seasonDate = e => String(e.created_at || e.rated_on || "").slice(0,10);
const seasonKind = e => e.works?.kind || works[e.work_id]?.kind || kindOf(e.work_id);
const seasonGenres = e => (e.works?.meta?.genres || works[e.work_id]?.meta?.genres || []).map(g => String(g).toLowerCase());
const isSeasonHorror = e => seasonGenres(e).some(g => g === "horror" || g.includes("horror fiction"));
function seasonChallengeFor(e, season = HALLOWEEN_2026) {
  const d = seasonDate(e); if (!d || d < season.starts || d > season.ends || !isSeasonHorror(e)) return null;

}
function seasonEntries(challenge, rows = myEntries, season = HALLOWEEN_2026) {
  /* A title is a single notch no matter how many times someone edits or rewatches it. */
  const seen = new Set();
  return rows.filter(e => { if (seasonChallengeFor(e, season)?.id !== challenge.id || seen.has(e.work_id)) return false;
    seen.add(e.work_id); return true; });
}
function seasonMedal(n) { return [...SEASON_MEDALS].reverse().find(m => n >= m.at) || null; }
function seasonEntryStamp(e) {
  if (!me || e.user_id !== me.id) return "";
  const c = seasonChallengeFor(e); if (!c) return "";
  const n = seasonEntries(c).length, medal = seasonMedal(n);
  const label = `${c.name} · ${n} logged${medal ? ` · ${medal.name}` : ""}`;
  return `<span class="season-stamp ${medal?.tier || ""}" aria-label="${esc(label)}" title="${esc(label)}">${medal?.icon || c.icon}</span>`;
}
function seasonPhase(season = HALLOWEEN_2026) {
  const d = today();
  return d < season.starts ? { key:"upcoming", text:`Starts ${when(season.starts)}` }
    : d > season.ends ? { key:"finished", text:`Finished ${when(season.ends)}` }
    : { key:"live", text:`Ends ${when(season.ends)}` };
}
async function seasonRank(season = HALLOWEEN_2026) {
  if (seasonPhase(season).key === "upcoming") return null;
  try {
    const rows = await q(sb.from("entries").select("user_id,work_id,created_at,rated_on,works(kind,meta)").limit(2000));
    const by = new Map();
    for (const e of rows) {
      if (!seasonChallengeFor(e, season)) continue;

    }
    const scores = [...by.entries()].map(([id, ids]) => ({ id, n:ids.size })).filter(x => x.n > 0).sort((a,b) => b.n-a.n);

/* numbers that mean a quantity count up to it */
/* 16 — each digit rolls up to its value; the strip reads down from the target */
function odometer(el, to, suffix = "") { if (!el) return;
  if (to === "—" || to === null || to === undefined) { el.textContent = "—"; return; }
  const text = String(to) + suffix;
  if (REDUCED) { el.textContent = text; return; }
  el.textContent = ""; el.classList.add("odo");
  const strips = [];
  for (const ch of text) {
    if (!/[0-9]/.test(ch)) { const f = document.createElement("span"); f.className = "fix"; f.textContent = ch; el.appendChild(f); continue; }
    const d = +ch, reel = document.createElement("span"), strip = document.createElement("span");
    reel.className = "reel"; strip.className = "strip";
    for (let i = 0; i < 10; i++) { const b = document.createElement("b"); b.textContent = String((d - i + 10) % 10); strip.appendChild(b); }
    strip.style.transform = "translateY(calc(-7 * var(--oh)))"; reel.appendChild(strip); el.appendChild(reel); strips.push(strip); }
  requestAnimationFrame(() => strips.forEach(st => { st.style.transform = "translateY(0)"; }));
}

function countUp(el, to, suffix = "", ms = 600) {
  if (!el || to === "—" || to === null || to === undefined) { if (el) el.textContent = to ?? "—"; return; }
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = to + suffix; return; }
  const target = parseFloat(to), dec = String(to).includes(".") ? 1 : 0, t0 = performance.now();
  const tick = now => { const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    el.textContent = (target * e).toFixed(dec) + suffix; if (k < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}

/* ---------- marks ----------
   Records, not achievements: every one of these describes something that already
   happened, and none of them can be got at by using the app differently. Nine of the
   twelve are computable from what a profile already loads. The three left out —
   Charter, Called It, and the room's year — each need a sweep across everybody's
   rows, so they wait until there is a reason to pay for that query. */
const decadeOf = w => w?.year ? Math.floor(+String(w.year).slice(0,4) / 10) * 10 : null;
const yearsSince = iso => iso ? (Date.now() - new Date(iso)) / (365.25 * 864e5) : 0;

function marksFor(p, es, taste, match, extra = {}) {
  const out = [];
  const add = (key, name, rule) => out.push({ key, name, rule });

  if (p.founder) add("founder", "Founder", "made the place");

  /* how far apart the two of you landed on the same thing */
  const byWork = {};
  for (const e of es) byWork[e.work_id] = Math.max(byWork[e.work_id] ?? -1, e.score);
  let splits = 0;
  if (p.id !== me.id) for (const m of myEntries) {
    const theirs = byWork[m.work_id];
    if (theirs !== undefined && Math.abs(theirs - m.score) >= 4) splits++;
  }
  if (splits >= 20) add("argument", "The Argument", `${splits} splits with you`);
  else if (splits >= 1) add("split", "The Split", splits === 1 ? "a split with you" : `${splits} splits with you`);

  if (Object.keys(KINDS).every(k => taste.kinds[k])) add("house", "The Whole House", "all four mediums");

  const decades = new Set(es.map(e => decadeOf(works[e.work_id])).filter(Boolean));
  if (decades.size >= 4) add("longview", "The Long View", `${decades.size} decades`);

  if (match !== null && match >= 90 && taste.tagged >= 3 && tasteOf(myEntries).tagged >= 3)
    add("twin", "Twin", `${match}% with you`);

  const yrs = Math.floor(yearsSince(p.created_at));
  if (yrs >= 3) add("stillhere", "Still Here", `${yrs} years in`);

  if (extra.clubsFinished > 0)
    add("table", "Ran the Table", extra.clubsFinished === 1 ? "finished a club" : `${extra.clubsFinished} clubs finished`);

  const notes = es.filter(e => e.note && e.note.trim()).length;
  if (notes >= 50) add("saidwhy", "Said Why", `${notes} entries with a note`);

  return out;
}
async function clubsFinishedBy(userId) {
  try { const rows = await q(sb.from("club_members").select("finished_at").eq("user_id", userId));
    return rows.filter(r => r.finished_at).length; } catch { return 0; }
}

    <div class="markrow">${ms.map(m => `<span class="mk mk-${m.key}"><b>${esc(m.name)}</b><small>${esc(m.rule)}</small></span>`).join("")}</div></div>`;

/* The work page asks this as a card of its own. After a spin it is the very next
   question — "fine, but where" — so the result carries a compact form of the same
   thing: the logos and nothing else. A compact block stays silent when the answer is
   about our setup rather than the film, because a pick is no place to be told the

async function paintWatch(w, target = "wWatch", compact = false) {
  const el = $("#" + target); if (!el) return;

    el.innerHTML = (isSoon(w) ? `<p class="empty" style="margin:8px 0 0">Out ${when(w.release)}.</p>`

/* ---------- one token ----------
   Every number here comes off the width of the poster, so a tray changes size by
   changing one figure. The depth is the medium: a box set is fatter than a film, a book
   is fatter than both and shows its pages down the right edge. */
const TOK_DEPTH = { film:0.20, tv:0.34, book:0.28, game:0.24 };
const TOK_TINT = { film:"var(--film)", tv:"var(--tv)", book:"var(--book)", game:"var(--game)" };
/* a stand-in when there is no cover, which for books is most of the time. The same hash
   and the same palette as the avatars, so it reads as part of the app rather than as a
   picture that failed to load. */
function tokFace(w) {
  const h = avHash(w.id);
  const base = AV_COLS[h % (AV_COLS.length - 1)], deep = avShade(base, -.42), lite = avShade(base, .26);
  const k = h % 4;
  const art = k === 0 ? `<circle cx="30" cy="34" r="15" fill="${base}"/><rect y="56" width="60" height="34" fill="${lite}" opacity=".5"/>`
    : k === 1 ? `<path d="M0 60L60 24v18L0 78z" fill="${base}"/><circle cx="44" cy="66" r="7" fill="${lite}"/>`
    : k === 2 ? `<rect x="18" y="16" width="24" height="58" rx="2" fill="${base}"/>`
    : `<path d="M30 22c9 0 14 8 14 17 0 8-4 12-4 16l2 35H18l2-35c0-4-4-8-4-16 0-9 5-17 14-17z" fill="${base}"/>`;
  return `<svg viewBox="0 0 60 90" aria-hidden="true"><rect width="60" height="90" fill="${deep}"/>${art}</svg>`;
}
const tokEdge = kind => kind === "book"
  ? `<svg viewBox="0 0 60 90" preserveAspectRatio="none" aria-hidden="true"><rect width="60" height="90" fill="#efe6d4"/>${
      Array.from({length:14}, (_, i) => `<rect y="${4+i*6.2}" width="60" height="1.8" fill="#d9cdb6"/>`).join("")}</svg>`
  : `<svg viewBox="0 0 60 90" preserveAspectRatio="none" aria-hidden="true"><rect width="60" height="90" fill="var(--line)"/></svg>`;

const TOK_NAME = 15;                      /* the band the title sits in, inside the box */
function tokenHTML(w, face = 52, five = false) {
  const fw = face, fh = Math.round(fw * 1.42);
  const dep = Math.max(4, Math.round(fw * (TOK_DEPTH[w.kind] || .22)));
  const pad = Math.round(fw * .30), sideL = Math.round((fw - dep) / 2);
  /* the plinth is centred on the object's bottom edge: half of it is behind the thing
     standing on it and half shows in front, which is what makes it read as a plinth
     rather than as a bar under a picture */
  const bw = Math.round(fw * 1.14), bh = Math.max(7, Math.round(fw * .22));
  const box = fw + pad * 2, boxh = fh + Math.ceil(bh / 2);
  const front = w.cover
    ? `<img src="${esc(w.cover)}" alt="" onload="this.classList.add('ok')" onerror="this.replaceWith(document.createRange().createContextualFragment(this.dataset.fb))" data-fb="${esc(tokFace(w))}">`
    : tokFace(w);
  return `<button type="button" class="tok" data-tok="${esc(w.id)}" title="${esc(w.title)}"
      style="width:${box}px;height:${boxh + TOK_NAME}px;--t:${(avHash(w.id) % 150) / 10}s">
    <span class="ob" style="left:${pad}px;top:0;width:${fw}px;height:${fh}px">
      <span class="fc" style="inset:0;border-radius:2px 3px 3px 2px;transform:translateZ(${dep/2}px);
        box-shadow:0 ${Math.round(fw*.09)}px ${Math.round(fw*.2)}px -${Math.round(fw*.08)}px rgba(21,19,32,.45)">${front}</span>
      <span class="fc" style="inset:0;border-radius:3px 2px 2px 3px;transform:rotateY(180deg) translateZ(${dep/2}px);background:var(--line)"></span>
      <span class="fc" style="left:${sideL}px;top:0;width:${dep}px;height:${fh}px;transform:rotateY(-90deg) translateZ(${fw/2}px);background:${TOK_TINT[w.kind]||"var(--line)"}"></span>
      <span class="fc" style="left:${sideL}px;top:0;width:${dep}px;height:${fh}px;transform:rotateY(90deg) translateZ(${fw/2}px)">${tokEdge(w.kind)}</span>
    </span>
    <span class="plinth" style="left:${Math.round((box-bw)/2)}px;bottom:${TOK_NAME}px;width:${bw}px;height:${bh}px;background:${TOK_TINT[w.kind]||"var(--line)"}"></span>
    ${five ? `<span class="halo" style="left:${Math.round((box-bw)/2)-5}px;bottom:${TOK_NAME-5}px;width:${bw+10}px;height:${bh+10}px"></span>` : ""}
    <span class="nm">${esc(w.title)}</span></button>`;
}

/* ---------- the shape of a show ----------
   Folded away, and fetched only when opened: a show you logged once and never think
   about again should cost nothing and look exactly as it did before any of this existed.

   A season row carries the number you gave it, or — in grey — the one its episodes add
   up to. An episode carries a tick, because "I have seen this" and "this was a seven"
   are different sentences and making people say the second to mean the first is how a
   log starts feeling like homework. */
const TICK_SVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4.5 4.5L19 7"/></svg>`;
let mySeen = new Set();
async function loadSeen() {
  if (!me) return;
  try { const rows = await q(sb.from("seen").select("work_id").eq("user_id", me.id));
    mySeen = new Set(rows.map(r => r.work_id)); }
  catch (e) { if (missingBit(e)) needs("v20", "ticking an episode will not stick"); }
}
async function tickEpisode(w, on) {
  await ensurePart(w);
  if (on) { mySeen.add(w.id); try { await q(sb.from("seen").upsert({ user_id:me.id, work_id:w.id })); } catch { mySeen.delete(w.id); throw 0; } }
  else { mySeen.delete(w.id); try { await q(sb.from("seen").delete().eq("user_id", me.id).eq("work_id", w.id)); } catch { mySeen.add(w.id); throw 0; } }
}
/* your latest word on one part, which is what its row shows */
const myPartScore = id => { const es = myParts.filter(e => e.work_id === id).sort(newestFirst); return es.length ? es[0].score : null; };

async function paintParts(show) {

  const byS = partScores(myParts, show.id);
  box.innerHTML = `<div class="seas">${seasons.map(sn => {
    const own = myPartScore(sn.id);
    const from = byS[sn.id];
    const calc = own == null && from && from.eps.length ? from.eps.reduce((a,b)=>a+b,0) / from.eps.length : null;
    const n = own != null ? (own/2).toFixed(1) : calc != null ? (calc/2).toFixed(1) : "—";
    return `<button class="sr" data-season="${esc(sn.id)}" aria-expanded="false">

const epRow = ep => { const sc = myPartScore(ep.id), on = mySeen.has(ep.id);
  return `<div class="er ${on ? "seen" : ""}" data-ep="${esc(ep.id)}">

  });
}

/* ---------- getting a face for somebody ----------
   Works saved before any of this have no map and are never refetched — ensureWork stops
   at `credits`. Rather than widen that and re-fetch every work, the log sheet asks once
   for the one work it is showing, and the answer is kept on the work so it is asked once
   ever. Failure is silent: a missing photograph is initials, not an error. */
const faceCache = {};

  if (w?.meta?.faces) return w.meta.faces;

  if (w.kind !== "film" && w.kind !== "tv") return (faceCache[w.id] = {});
  faceCache[w.id] = {};                        /* claim it, so a second open doesn't refetch */
  try {

/* ---------- import ----------
   letterboxd: Date,Name,Year,Letterboxd URI,Rating   · goodreads: Title,Author,My Rating,Date Read
   steam: name,hours (or a plain list of titles) — anything with a title column works. */
function parseCSV(text) {
  const rows = []; let row = [], cell = "", quoted = false;
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (quoted) { if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else quoted = false; } else cell += c; }
    else if (c === '"') quoted = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r") cell += c; }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function readImport(text) {
  const rows = parseCSV(text); if (rows.length < 2) return { kind:null, items:[] };
  const head = rows[0].map(h => lc(h.trim()));
  const col = (...names) => { for (const n of names) { const i = head.indexOf(n); if (i >= 0) return i; } return -1; };
  const iTitle = col("name","title","game","book title"), iYear = col("year","original publication year","first published"),
        iRating = col("rating","my rating","score"), iDate = col("date","date read","watched date","date added"), iAuthor = col("author","director","developer");
  if (iTitle < 0) return { kind:null, items:[] };
  const kind = col("letterboxd uri") >= 0 ? "film" : col("my rating") >= 0 || col("author") >= 0 ? "book" : col("hours") >= 0 || col("app id","appid") >= 0 ? "game" : null;
  const items = rows.slice(1).map(r => ({ title:(r[iTitle]||"").trim(), year:iYear>=0?(r[iYear]||"").trim().slice(0,4):"",
    rating:iRating>=0?parseFloat(r[iRating]):NaN, date:iDate>=0?(r[iDate]||"").trim().slice(0,10):"", author:iAuthor>=0?(r[iAuthor]||"").trim():"" }))
    .filter(x => x.title);
  return { kind, items };
}
/* ---------- bringing a log that has no account with it ----------
   Somebody can use Rooms without an account: the whole log sits in this browser and no
   server ever sees it. That was always meant to be a real way to use it rather than a
   trial, but it left a hole at the other end — make an account, or install the app, and
   the log did not come. It was not lost, it was just on the wrong side of a door with no
   handle. "Back up the log" wrote a file and nothing in the hosted build would read it.

   Reads either file the app produces, because they are the same shape where it matters:
   the raw store that Back up the log writes, and what Download everything makes.

   What cannot come is everything that is about other people — rooms, follows, clubs,
   likes, handovers. A room is not a thing you own, it is a thing you are in, and a
   device-only log's rooms have nobody in them. Saying that up front is better than

  const entries = Array.isArray(j.entries) ? j.entries : null;
  if (!works || !entries) throw new Error("That isn't a Rooms file \u2014 it has no log in it.");
  const arr = k => Array.isArray(j[k]) ? j[k] : [];
  const n = entries.length + arr("list_items").length + arr("nows").length + arr("seen").length;
  if (n > BRING_MAX) throw new Error("That file is bigger than this can take in one go.");
  return { works, entries,
    listItems: arr("list_items"), tops: arr("top_lists"), topItems: arr("top_list_items"),
    nows: arr("nows"), seen: arr("seen"),
    leftBehind: { rooms:arr("rooms").length, follows:arr("follows").length,
      clubs:arr("clubs").length, likes:arr("reactions").length, handovers:arr("handovers").length } };
}
/* one round trip per chunk rather than per row: a log of four hundred entries is four
   hundred waits otherwise, and the person is watching a bar the whole time */
const inChunks = (rows, n = 50) => { const out = [];
  for (let i = 0; i < rows.length; i += n) out.push(rows.slice(i, i + n)); return out; };

async function bringOver(b, say = () => {}) {
  const out = { works:0, entries:0, shelf:0, ten:0, nows:0, seen:0, skipped:0 };
  /* works first, always: everything else has a foreign key pointing at one, and a row
     that arrives before the thing it is about is a constraint error, not a missing row */
  const wanted = new Set();
  b.entries.forEach(e => wanted.add(e.work_id));
  b.listItems.forEach(i => wanted.add(i.work_id));
  b.topItems.forEach(i => wanted.add(i.work_id));
  b.nows.forEach(x => wanted.add(x.work_id));
  b.seen.forEach(x => wanted.add(x.work_id));
  const rows = [...wanted].map(id => b.works[id]).filter(w => w && w.id && w.kind && w.title)
    .map(w => ({ id:w.id, kind:w.kind, title:w.title, year:w.year || "", cover:w.cover || "",
      creator:w.creator || "", length:w.length || 0, meta:w.meta || null,
      credits:w.credits || null, parent_id:w.parent_id || null }));
  /* a season before its episodes, for the same reason */
  rows.sort((x, y) => String(x.id).length - String(y.id).length);
  for (const c of inChunks(rows)) { await q(sb.from("works").upsert(c)); out.works += c.length;
    say(`Titles \u00b7 ${out.works} of ${rows.length}`); }

  /* what you already said about something on a day stays what you said: a second import
     of the same file should change nothing rather than double everything */
  const had = new Set(myEntries.concat(myParts).map(e => e.work_id + "|" + e.rated_on));
  const fresh = b.entries.filter(e => e.work_id && b.works[e.work_id]
    && Number.isFinite(+e.score) && !had.has(e.work_id + "|" + e.rated_on))
    .map(e => ({ user_id:me.id, work_id:e.work_id, rated_on:e.rated_on || today(),
      score:Math.max(1, Math.min(10, Math.round(+e.score))), note:e.note || null,
      loved:e.loved?.length ? e.loved : null, context:e.context || null,
      breakdown:e.breakdown || null, room_only:!!e.room_only }));
  out.skipped = b.entries.length - fresh.length;
  for (const c of inChunks(fresh)) { await q(sb.from("entries").insert(c)); out.entries += c.length;
    say(`Entries \u00b7 ${out.entries} of ${fresh.length}`); }

  /* everything on a shelf goes onto your shelf. A device-only log has one, and merging
     is the only answer that does not need you to decide anything. */
  const L = activeList();
  if (L && b.listItems.length) {
    const have = new Set(L.items);
    const add = b.listItems.filter(i => i.work_id && b.works[i.work_id] && !have.has(i.work_id))
      /* the hand-placed order is a thing somebody did on purpose, so it comes too */
      .map(i => ({ list_id:L.id, work_id:i.work_id, added_at:i.added_at || null,
        position:Number.isFinite(+i.position) ? +i.position : null }));
    for (const c of inChunks(add)) { await q(sb.from("list_items").insert(c)); out.shelf += c.length;
      say(`The shelf \u00b7 ${out.shelf} of ${add.length}`); }
  }

  /* only into an empty ten. Overwriting somebody's ten with an older one is the single
     most annoying thing this could do, and it is not undoable. */
  if (b.topItems.length) {
    let mine = { items:[] }; try { mine = await ensureMyTop(); } catch {}
    if (mine?.id && !mine.items.length) {
      const first = b.tops[0];
      /* the column is rank, it counts from one, and it is not null — position is what
         list_items used to be called and writing it here fails outright */
      const items = b.topItems.filter(i => !first || i.top_list_id === first.id)
        .filter(i => i.work_id && b.works[i.work_id])
        .sort((x, y) => (x.rank ?? x.position ?? 0) - (y.rank ?? y.position ?? 0)).slice(0, 10)
        .map((i, n) => ({ top_list_id:mine.id, work_id:i.work_id, rank:n + 1 }));
      if (items.length) { await q(sb.from("top_list_items").insert(items)); out.ten = items.length;
        say(`Your ten \u00b7 ${items.length}`); }
    }
  }

  const nowRows = b.nows.filter(x => x.work_id && b.works[x.work_id])
    .map(x => ({ user_id:me.id, work_id:x.work_id, started_on:x.started_on || today(), at:x.at || null }));
  if (nowRows.length) { await q(sb.from("nows").upsert(nowRows)); out.nows = nowRows.length;
    say(`What you're in the middle of \u00b7 ${nowRows.length}`); }

  const seenRows = b.seen.filter(x => x.work_id && b.works[x.work_id])
    .map(x => ({ user_id:me.id, work_id:x.work_id, seen_on:x.seen_on || today() }));
  for (const c of inChunks(seenRows)) { await q(sb.from("seen").upsert(c)); out.seen += c.length;
    say(`Episodes \u00b7 ${out.seen} of ${seenRows.length}`); }
  return out;
}

    const btn = $("#impRun"); btn.disabled = true; let done = 0, added = 0, missed = [];

    for (const x of items) {
      done++; $("#impProg").style.width = Math.round(done/items.length*100) + "%";
      $("#impMsg").textContent = `${done} of ${items.length} · ${x.title}`;
      try {
        const hits = await SOURCES[kind](x.title);

        if (!hit) { missed.push(x.title); continue; }

        const w = await ensureWork(hit);

        if (score) await q(sb.from("entries").insert({ user_id:me.id, work_id:w.id, rated_on:/^\d{4}-\d{2}-\d{2}$/.test(x.date) ? x.date : today(), score, note:null, loved:null, context:null, breakdown:null }));
        else if (L && !L.items.includes(w.id)) { await q(sb.from("list_items").insert({ list_id:L.id, work_id:w.id })); L.items.push(w.id); }

    $("#impMsg").textContent = "";

      <div class="stack"><button class="btn" id="impDone">Done</button></div></div>`;
    $("#impDone").onclick = () => { closeSheet(); switchTab("taste"); };
  }
}

/* ---------- everything you have ever put in, in one file ----------
   backup was gated to local mode, so a hosted account had no way out at all. This
   builds the same shape the local store uses, which means the file you download
   restores into an offline log — the data is yours in a form that opens. */
async function exportEverything() {
  const grab = async (t, sel, col) => { try { return await q(sb.from(t).select(sel).eq(col, me.id)); } catch { return []; } };
  /* it said "everything" and fetched four tables out of seventeen. Clubs, votes, your
     ten, what you are in the middle of and anything anybody handed you were all missing,
     and the two lists that were there came out with their dates blanked. */
  const [entries, myReplies, myReactions, myFollows, myNows, myHands, myTops, myVotes, myClubIn, mySeenRows, myBlocks, myHandles] =
    await Promise.all([
      grab("entries", "*", "user_id"),
      grab("replies", "*", "user_id"),
      grab("reactions", "*", "user_id"),
      grab("follows", "*", "follower"),
      grab("nows", "*", "user_id"),
      (async () => { try { return await q(sb.from("handovers").select("*")
        .or(`sender.eq.${me.id},recipient.eq.${me.id}`)); } catch { return []; } })(),
      grab("top_lists", "*,top_list_items(*)", "owner"),
      grab("club_votes", "*", "user_id"),
      grab("club_members", "*", "user_id"),
      grab("seen", "*", "user_id"),
      grab("blocks", "*", "blocker"),
      grab("handles", "*", "owner"),
    ]);
  const myClubs = [...clubs, ...openClubs].filter(c => myClubIn.some(m => m.club_id === c.id));
  const usedWorks = {};
  for (const id of new Set([...entries.map(e => e.work_id), ...lists.flatMap(l => l.items)]))
    if (works[id]) usedWorks[id] = works[id];
  return {
    exported_at: new Date().toISOString(), from: location.origin + location.pathname,
    profile: { id:me.id, handle:me.handle, bio:me.bio || "", avatar:me.avatar || null },
    signedOut: false, profiles: [],
    works: usedWorks,
    entries: entries.map(e => { const { works:_w, profiles:_p, ...row } = e; return row; }),
    lists: lists.map(l => ({ id:l.id, owner:me.id, name:l.name, created_at:null })),
    /* how long a thing has sat on the shelf is part of what the shelf knows, so it goes
       out with it rather than being blanked */
    list_items: lists.flatMap(l => l.items.map((id, i) => ({ list_id:l.id, work_id:id,
      added_at:(l.added && l.added[id]) || null, position:l.arranged ? i : null }))),
    rooms: rooms.map(r => ({ id:r.id, name:r.name, code:r.code })),
    room_members: rooms.flatMap(r => r.members.map(m => ({ room_id:r.id, user_id:m.id }))),
    clubs: myClubs.map(c => ({ id:c.id, room_id:c.room_id, name:c.name, label:c.label,
      scope:c.scope, items:c.items, due:c.due, created_by:c.created_by, created_at:c.created_at })),
    club_members: myClubIn, club_votes: myVotes,
    reactions: myReactions, replies: myReplies,
    top_lists: myTops.map(t => { const { top_list_items:_i, ...row } = t; return row; }),
    top_list_items: myTops.flatMap(t => t.top_list_items || []),
    nows: myNows, handovers: myHands, seen: mySeenRows, blocks: myBlocks, handles: myHandles,
    follows: myFollows,
  };
}
function downloadJSON(obj, name) {
  const url = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type:"application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
