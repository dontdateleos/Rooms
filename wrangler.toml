# deploy with: wrangler deploy
# then the four secrets, ORIGIN included or the worker serves 503 to everything:
#   wrangler secret put TMDB_KEY
#   wrangler secret put IGDB_CLIENT_ID
#   wrangler secret put IGDB_CLIENT_SECRET
#   wrangler secret put ORIGIN          # https://dontdateleos.github.io
# and, so Open Library knows who to contact rather than throttling us:
#   wrangler secret put CONTACT         # an email address for the app
# and, for notifications on people's phones, once (it makes the keys and sets both):
#   node tools/push-keys.mjs
# plus the service key, so only this worker can look up where to send them
# (Supabase → Project Settings → API → service_role — never put it in the app):
#   wrangler secret put SUPABASE_SERVICE_KEY
name = "rooms"
main = "worker.js"
compatibility_date = "2026-09-01"

# once an hour the worker sends the rooms' reminders (each belongs to one local hour, so
# it goes out once): this week's question, voting open, watch night, a season ending.
# Local time is TZ (default Australia/Sydney):  wrangler secret put TZ  — or [vars] TZ = "..."
[triggers]
crons = ["0 * * * *"]
